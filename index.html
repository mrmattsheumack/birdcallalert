// ─── History "Corpus" view: lists every on-disk training clip for one species,
//      straight from the Pi, with Trim + Delete (delete -> quarantine, reversible).
function HistoryCorpusList({ species, label }) {
  const [clips, setClips] = useState(null);
  const [err, setErr] = useState(null);
  const [trim, setTrim] = useState(null);
  const [busy, setBusy] = useState(null);
  useEffect(() => {
    let alive = true;
    setClips(null); setErr(null); setTrim(null); setBusy(null);
    fetch(`${PI_AUDIO_BASE}/corpus/clips?species=${encodeURIComponent(species)}`)
      .then(r => r.json())
      .then(j => { if (!alive) return; setClips(Array.isArray(j) ? j : (j.clips || [])); })
      .catch(e => { if (alive) setErr(String(e)); });
    return () => { alive = false; };
  }, [species]);
  const del = (filename) => {
    if (!window.confirm(`Delete this ${label} clip from the corpus? It moves to quarantine and is recoverable.`)) return;

    fetch(`${PI_AUDIO_BASE}/corpus_delete`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ species, filename, token: PI_TRIM_TOKEN }),
    })
      .then(r => r.json().then(j => ({ ok: r.ok, j })))
      .then(({ ok, j }) => {
        if (!ok || (j && j.error)) { alert("Delete failed: " + ((j && j.error) || "unknown")); setBusy(null); return; }

      })
      .catch(e => { alert("Delete failed: " + e); setBusy(null); });

      ) : clips.map(c => {
        const url = `${PI_AUDIO_BASE}/clips/${c.filename}`;
        const isTrim = trim === c.filename;
        const isDel = busy === c.filename;
        return (
          <div key={c.filename} style={{ display: "flex", flexDirection: "column", gap: 4, padding: "8px 4px", borderBottom: "1px solid var(--border)" }}>
            <span style={{ fontSize: 11, color: "var(--text-2)", fontFamily: "monospace", wordBreak: "break-all" }}>{c.filename}</span>
            <audio controls preload="none" style={{ width: "100%", height: 34 }} src={url} />
            {!isTrim ? (
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => setTrim(c.filename)} style={{ padding: "5px 10px", borderRadius: "var(--r-sm)", border: "1px solid var(--border)", background: "var(--surface-2)", color: "var(--text-2)", fontSize: 12, cursor: "pointer" }}>\u2702 Trim</button>
                <button disabled={isDel} onClick={() => del(c.filename)} style={{ padding: "5px 10px", borderRadius: "var(--r-sm)", border: "1px solid #e0b4b4", background: "#fbeaea", color: "#c0392b", fontSize: 12, cursor: isDel ? "default" : "pointer", opacity: isDel ? 0.6 : 1 }}>{isDel ? "Deleting\u2026" : "\ud83d\uddd1 Delete"}</button>
              </div>
            ) : (
              <TrimEditor clipUrl={url} clipFilename={c.filename} onClose={() => setTrim(null)} onSaved={() => setTrim(null)} />
            )}
          </div>
        );
      })}

  );
}

// ─── App version ────────────────────────────────────────────────────

// ─── v5.8.0: Service Worker registration ──────────────────────────────
// Registers /sw.js so registration.showNotification() works on Chrome
// Android (where new Notification() is unsupported). Also handles
// notification clicks (focus app window). Runs once on page load.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js")
      .then((reg) => {
        console.log("[sw] registered, scope:", reg.scope);
      })
      .catch((err) => {
        console.warn("[sw] registration failed:", err);
      });
  });
}

// ─── v5.8.0: Notification helper (SW-first, fallback to direct) ───────
// Use this everywhere INSTEAD of `new Notification()`. On Chrome Android,
// `new Notification()` fails silently because the spec requires SW route.
// This helper tries SW first, then falls back to direct constructor.
async function showBirdNotif(title, body, tag) {
  if (typeof Notification === "undefined") {
    console.warn("[notif] Notification API unavailable");
    return;
  }
  if (Notification.permission !== "granted") {
    console.warn("[notif] permission not granted:", Notification.permission);
    return;
  }
  const options = {
    body: body,
    tag: tag || "bird-detection",
  };
  try {
    if ("serviceWorker" in navigator) {
      const reg = await navigator.serviceWorker.ready;
      if (reg && reg.showNotification) {
        await reg.showNotification(title, options);
        console.log("[notif] shown via SW:", title);
        return;
      }
    }
  } catch (e) {
    console.warn("[notif] SW route failed, falling back:", e);
  }
  try {
    new Notification(title, options);
    console.log("[notif] shown via direct constructor:", title);
  } catch (e) {
    console.warn("[notif] direct constructor failed:", e);
  }
}

// ─── Training corpus tier thresholds ────────────────────────────────
// v5.7.5: 5-tier collection-progress system. The dot next to a species
// indicates how close that species is to having enough training data.
//   0-14   → no dot         "starting" - urgent, keep collecting
//   15-49  → orange ◐       "building" - keep collecting
//   50-79  → lime ◐         "sufficient" - keep but lower priority
//   80-99  → green ●        "ready" - target hit, can mute if you want
//   100+   → gray ●         "saturated" - stop, you have plenty
// Source-of-truth count comes from Supabase: rows with either a
// manual_label OR confirmed=true for a given normalised species label.
const CORPUS_TIER_BUILDING = 15;
const CORPUS_TIER_SUFFICIENT = 50;
const CORPUS_TIER_READY = 80;
const CORPUS_TIER_SATURATED = 100;

// Helper: map a count to {tier, dot, color}. Single source of truth
// used by both the per-card display and the settings list.
function corpusTier(count) {
  if (count >= CORPUS_TIER_SATURATED) {
    return { tier: "saturated", dot: "●", dotColor: "#94a3b8" };
  }
  if (count >= CORPUS_TIER_READY) {
    return { tier: "ready", dot: "●", dotColor: "var(--success)" };
  }
  if (count >= CORPUS_TIER_SUFFICIENT) {
    return { tier: "sufficient", dot: "◐", dotColor: "#84cc16" };
  }
  if (count >= CORPUS_TIER_BUILDING) {
    return { tier: "building", dot: "◐", dotColor: "#ca8a04" };
  }
  return { tier: "starting", dot: "", dotColor: "transparent" };
}

// ─── v5.5: BirdNET post-processor remapping ──────────────────────────
// Empirical remapping table derived from user correction history.
// For each BirdNET prediction shown here, the user has corrected it
// to a different species often enough that we should lead with the
// most-likely real label and show BirdNET's original guess as subtext.
//
// `primary` = most-likely actual species when BirdNET predicts this
// `alternates` = other frequent corrections, offered as quick-confirm chips
// `confidence` = "high" (one dominant correction target) | "medium" | "low"
//
// Confirm button behaviour when remap is active: writes manual_label =
// `primary` (treated as a correction), routing the WAV to the corrected
// species' training-corpus folder rather than BirdNET's wrong folder.
//
// To regenerate this table, run the per-species accuracy query in
// Supabase, then update entries here. Keep in sync with corpus reality.
// Source data: 1678 detections analysed 2026-05-13.
const BIRDNET_REMAPS = {
  // ─── High-confidence remaps (single dominant correction target) ───
  "Red Wattlebird":         { primary: "Little Wattlebird",        alternates: [],                                                confidence: "high" },
  "Gang-gang Cockatoo":     { primary: "Sulphur-crested Cockatoo", alternates: [],                                                confidence: "high" },
  "Eastern Rosella":        { primary: "Crimson Rosella",          alternates: [],                                                confidence: "high" },
  "Olive-backed Oriole":    { primary: "Common Myna",              alternates: [],                                                confidence: "high" },

  // ─── Medium-confidence remaps (clear primary + alternates) ────────
  "Satin Bowerbird":        { primary: "Common Myna",              alternates: ["Little Wattlebird", "Polly", "Little Raven"],   confidence: "medium" },
  "European Greenfinch":    { primary: "Cricket",                  alternates: ["Brown Thornbill"],                              confidence: "medium" },

  // ─── Low-confidence remaps (suggestive, multiple targets) ─────────
  "Australasian Swamphen":  { primary: "Polly",                    alternates: ["Common Myna"],                                  confidence: "low" },
  "Eurasian Coot":          { primary: "Cricket",                  alternates: ["Little Corella"],                               confidence: "low" },
};

// Return remap info for a BirdNET prediction, or null if no remap applies.
// Returned object: { primary, alternates, confidence, original }
//   primary    : best-guess actual species name
//   alternates : array of other likely species
//   confidence : "high" | "medium" | "low"
//   original   : the BirdNET prediction (passed through for display)
function remapBirdNet(speciesGuess) {
  if (!speciesGuess) return null;
  const entry = BIRDNET_REMAPS[speciesGuess];
  if (!entry) return null;
  return {
    primary: entry.primary,
    alternates: entry.alternates || [],
    confidence: entry.confidence,
    original: speciesGuess,
  };
}

const LS = {
  classifications: "bca_classifications",  // v4: {species_label: state}
  classificationsSeeded: "bca_classifications_seeded",
  muted_legacy:    "bca_muted",   // v3 and earlier - migrate once
  filter:          "bca_filter",
  notifMode:       "bca_notif_mode",
  conf:            "bca_conf",
  lastNotif:       "bca_last_notif_id",
  historyStatusFilter: "bca_history_status_filter",  // v5.4: persisted history status pick
  historySpeciesFilter: "bca_history_species_filter",  // v5.7: persisted history species pick
  liveSort:        "bca_live_sort",   // v6.1: live feed sort direction "desc"|"asc"
};

// ─── Classification helpers (abstraction layer) ─────────────────────
// All reads/writes go through these functions. When we eventually
// migrate to Supabase-backed classification, only these change.
function loadClassifications() {
  try {
    const raw = localStorage.getItem(LS.classifications);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;  // null = needs seeding
}
function saveClassifications(obj) {
  try { localStorage.setItem(LS.classifications, JSON.stringify(obj)); }
  catch (e) {}
}
function seedClassifications() {
  // Build initial classifications:
  //   - All DEFAULT_PRIORITY_SPECIES → priority
  //   - All species in old bca_muted → muted (one-time v3→v4 migration)
  //   - Everything else → no entry (treated as "normal" by default)
  const obj = {};
  for (const s of DEFAULT_PRIORITY_SPECIES) obj[s] = "priority";
  try {
    const oldMuted = JSON.parse(localStorage.getItem(LS.muted_legacy) || "[]");
    for (const s of oldMuted) obj[s] = "muted";
  } catch (e) {}
  saveClassifications(obj);
  localStorage.setItem(LS.classificationsSeeded, "1");
  return obj;
}
const CLASSIFICATION_RANK = { normal: 0, priority: 1, suspect: 2, muted: 3 };
// v6.19: canonical key for a classification entry. Strips any legacy
// "Common_Scientific" suffix, then runs the full display canonicaliser
// (which also collapses sub-species). One species => one key.
function classificationKey(label) {
  if (!label) return label;
  const common = String(label).split("_")[0];
  return canonicaliseSpeciesLabel(common) || common;
}
// v6.19: one-time migration. Canonicalise every saved key and merge
// duplicates that collapse to the same species, keeping the strongest
// intent (muted > suspect > priority). Drops stored "normal" entries.
function migrateClassificationKeys(obj) {
  if (!obj || typeof obj !== "object") return obj;
  const out = {};
  let changed = false;
  for (const [k, v] of Object.entries(obj)) {
    if (!v || v === "normal") { changed = true; continue; }
    const ck = classificationKey(k);
    if (ck !== k) changed = true;
    const cur = out[ck];
    if (!cur || (CLASSIFICATION_RANK[v] || 0) > (CLASSIFICATION_RANK[cur] || 0)) {
      if (cur && cur !== v) changed = true;
      out[ck] = v;
    } else {
      changed = true;
    }
  }
  if (changed) { try { saveClassifications(out); } catch (e) {} }
  return out;
}
// v6.19: resolve a classification by canonical key so any stored form
// (slug, Title Case, or legacy "_Scientific") is found. Exact hit first
// for speed, then canonical match.
function getClassification(label, classifications) {
  if (!classifications) return "normal";
  if (classifications[label]) return classifications[label];
  const ck = classificationKey(label);
  if (classifications[ck]) return classifications[ck];
  for (const k in classifications) {
    if (classificationKey(k) === ck) return classifications[k];
  }
  return "normal";
}

// Sync the muted species list to Supabase pi_config table so the Pi
// stops saving audio for muted species. Called whenever classifications
// change. Failure is non-blocking.
async function syncMutedToServer(classifications) {
  const muted = Object.entries(classifications)
    .filter(([_, state]) => state === "muted")
    .map(([label]) => label);
  try {
    // Upsert: if row exists, update value; else insert
    await fetch(
      `${SUPA_URL}/rest/v1/pi_config?key=eq.muted_species`,
      {
        method: "PATCH",
        headers: { ...SUPA_HEADERS, "Prefer": "return=minimal" },
        body: JSON.stringify({ value: muted }),
      }
    );
  } catch (e) {
    console.warn("Failed to sync muted list to Pi:", e);
  }
}

// ─── Helpers ────────────────────────────────────────────────────────
function birdLabel(d) {
  const m = d.metadata || {};
  if (m.label) return m.label;
  if (m.scientific_name) return `${d.species_guess}_${m.scientific_name}`;
  return d.species_guess || "Unknown";
}

// v6.18: classification species for a detection. Trust the decider's
// blended verdict (decider_species) whenever it exists - including its
// default-bn picks - and fall back to canonicalised BirdNET only on a
// true decline (blank decider_species). Routes mute/priority/suspect off
// the ensemble instead of the individual engines.
function classificationSpecies(d) {
  if (d && d.decider_species) {
    const c = canonicaliseSpeciesLabel(d.decider_species);
    if (c) return c;
  }
  return canonicaliseSpeciesLabel(d.species_guess) || birdLabel(d);
}

// True if a detection should be flagged as priority. v6.18: keyed off the
// decider's species (which already blends BirdNET + BB), replacing the
// earlier dual BN/BB check.
// v6.19: collect every species named for this clip (decider, BirdNET, BB),
// canonicalised + de-duped. Muting is CONSERVATIVE (hide only if ALL named
// species are muted) so a rare bird BirdNET flags is never hidden just
// because the decider sided with BB. Priority/suspect are PERMISSIVE
// (flag if ANY named species matches).
function namedSpecies(d) {
  const out = [];
  const add = (raw) => { const c = canonicaliseSpeciesLabel(raw); if (c && !out.includes(c)) out.push(c); };
  if (d) {
    if (d.decider_species) add(d.decider_species);
    if (d.species_guess)   add(d.species_guess);
    if (d.bb_species)      add(d.bb_species);
  }
  if (out.length === 0) { const b = birdLabel(d); if (b) out.push(b); }
  return out;
}
function isPriority(d, classifications) {
  return namedSpecies(d).some(s => getClassification(s, classifications) === "priority");
}
// Conservative mute: suppress only when EVERY named species is muted.
function isMuted(d, classifications) {
  const names = namedSpecies(d);
  if (names.length === 0) return false;
  return names.every(s => getClassification(s, classifications) === "muted");
}
function isSuspect(d, classifications) {
  return namedSpecies(d).some(s => getClassification(s, classifications) === "suspect");
}

// True if the user has manually relabelled this detection AND the new label
// is different from BirdNET's original guess. We compare on the common-name
// portion (label has form "CommonName_ScientificName" or just "CommonName").
// This is what drives the green ✓ "corrected" badge on the card.
function isCorrected(d) {
  const meta = d.metadata || {};
  const manual = (meta.manual_label || "").trim();
  if (!manual) return false;
  const original = (d.species_guess || "").trim();
  if (!original) return manual.length > 0;  // no original to compare, treat as touched
  // Case-insensitive compare. If user typed back the same species (confirmation,
  // not correction) we DON'T flag it - the badge means "different from BirdNET".
  return manual.toLowerCase() !== original.toLowerCase();
}

// v5.2: True if the user has explicitly confirmed BirdNET's guess via
// the new Confirm button. Drives the blue ✓ "confirmed" badge and the
// Pi-side promote into `training-corpus/<species_guess>/`.
function isConfirmed(d) {
  const meta = d.metadata || {};
  return meta.confirmed === true;
}

// v5.4: True if the user has explicitly marked this card as reviewed
// without confirming or correcting. Drives the grey badge in history.
// A "reviewed" card is one the user has chosen to skip but has seen -
// it should NOT appear in the Unaddressed history filter. The clip is
// NOT added to the training corpus (no Pi action on reviewed-only).
function isReviewed(d) {
  const meta = d.metadata || {};
  return !!meta.reviewed_at;
}

// v5.2: Normalise a species label the same way the Pi promote-poll does
// (lowercase, trim, replace whitespace with dashes). Used client-side to
// match up corpus counts across slight spelling variations ("Common Mynah"
// vs "Common mynah" vs "common-mynah").
function normaliseCorpusLabel(s) {
  if (!s) return "";
  return String(s).trim().toLowerCase().replace(/\s+/g, "-");
}

// ─── v5.7.6: Label consolidation remap ──────────────────────────────
// Mirrors the Pi-side _V4_LABEL_REMAPS exactly. The Pi consolidates
// similar species into single training-corpus folders (e.g. Little
// Wattlebird + Red Wattlebird both → wattlebird/). For the app's
// count display to match what the Pi actually has in training-corpus,
// we apply the same consolidation here when counting. Without this,
// the app would show "Little Wattlebird: 62" + "Red Wattlebird: 24"
// as separate entries while the Pi has a single "wattlebird: 98"
// folder, and counts would never match.
const LABEL_CONSOLIDATION_REMAP = {
  "little wattlebird": "Wattlebird",
  "red wattlebird":    "Wattlebird",
  "australian raven":  "Raven",
  "forest raven":      "Raven",
  "little raven":      "Raven",
  // v6.7: also collapse the canonical lowercase forms (BB output) so
  // they merge with the Title Case variants in the picker/history filter.
  "wattlebird":        "Wattlebird",
  "raven":             "Raven",
};

// Apply consolidation: returns the consolidated pretty form for known
// species, or the original label unchanged. Case-insensitive matching.
function consolidateLabel(label) {
  if (!label) return label;
  const key = String(label).trim().toLowerCase();
  return LABEL_CONSOLIDATION_REMAP[key] || label;
}

// ─── v6.2: Canonical species naming (slug -> Title Case) ────────────
// BirdNET writes species in Title Case (e.g. "Rainbow Lorikeet").
// BoundaryBirds writes lowercase-hyphenated slugs ("rainbow-lorikeet").
// When a slug form leaks into manual_label, the picker shows two
// entries for the same bird ("Rainbow Lorikeet" + "rainbow-lorikeet").
// This function converts slug form to Title Case so all surfaces use
// the canonical form. Non-slug input is passed through unchanged.
//
// Detection of slug form: all lowercase + at least one hyphen + no
// spaces. Anything with a space, or anything with uppercase, is left
// alone so user-typed labels like "Not bird" or "BellBird" pass through.
const SLUG_TO_TITLE_OVERRIDES = {
  "sulphur-crested-cockatoo": "Sulphur-crested Cockatoo",
  "magpie-lark": "Magpie-lark",
  "not-bird": "Not-bird",
};
// v6.4: variant remap for Title-Case strings that should collapse to
// a single canonical form. Keyed by lowercase-stripped input.
const TITLE_CASE_REMAPS = {
  "not bird": "Not-bird",
  "notbird":  "Not-bird",
};
function canonicaliseSpeciesLabel(s) {
  if (!s) return s;
  const trimmed = String(s).trim();
  if (!trimmed) return trimmed;
  // v6.4: apply variant remap BEFORE slug check. Lookup uses lowercase
  // form so "Not Bird", "Not bird", "NOT BIRD" all collapse.
  const remapKey = trimmed.toLowerCase();
  // v6.7: consolidation remap (e.g. "Little Wattlebird" -> "Wattlebird")
  // takes precedence so sub-species collapse happens regardless of case.
  if (LABEL_CONSOLIDATION_REMAP[remapKey]) {
    return LABEL_CONSOLIDATION_REMAP[remapKey];
  }
  if (TITLE_CASE_REMAPS[remapKey]) {
    return TITLE_CASE_REMAPS[remapKey];
  }
  // Is it slug form? all-lowercase + has hyphen + no spaces
  // v6.11: lowercase single-word (no hyphen, no space) - Title Case it.
  // Catches BB slugs like "polly", "wattlebird", "raven", "cricket".
  if (/^[a-z]+$/.test(trimmed)) {
    return trimmed[0].toUpperCase() + trimmed.slice(1);
  }
  const isSlug = (
    trimmed === trimmed.toLowerCase() &&
    trimmed.indexOf("-") !== -1 &&
    trimmed.indexOf(" ") === -1
  );
  if (!isSlug) return trimmed;
  // Override map for tricky cases (preserved internal hyphens)
  if (SLUG_TO_TITLE_OVERRIDES[trimmed]) {
    return SLUG_TO_TITLE_OVERRIDES[trimmed];
  }
  // Generic: hyphens to spaces, capitalise each word.
  return trimmed.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

// v6.11: write-side canonicaliser. Same slug->Title and variant-spelling
// normalisation as canonicaliseSpeciesLabel, but DELIBERATELY skips the
// LABEL_CONSOLIDATION_REMAP (sub-species collapse). Used when writing to
// the DB so historic ground truth preserves sub-species ("Little Raven",
// "Red Wattlebird" etc) for future class-split work. Display layer still
// uses the full canonicaliser, so the UI continues to collapse for counts.
function canonicaliseForWrite(s) {
  if (!s) return s;
  const trimmed = String(s).trim();
  if (!trimmed) return trimmed;
  const remapKey = trimmed.toLowerCase();
  // Spelling variants are fine to normalise (e.g. "Not bird" -> "Not-bird")
  if (TITLE_CASE_REMAPS[remapKey]) {
    return TITLE_CASE_REMAPS[remapKey];
  }
  // INTENTIONALLY skip LABEL_CONSOLIDATION_REMAP - preserve sub-species on write.
  // v6.11: lowercase single-word (no hyphen, no space) - Title Case it.
  // Catches BB slugs like "polly", "wattlebird", "raven", "cricket".
  if (/^[a-z]+$/.test(trimmed)) {
    return trimmed[0].toUpperCase() + trimmed.slice(1);
  }
  const isSlug = (
    trimmed === trimmed.toLowerCase() &&
    trimmed.indexOf("-") !== -1 &&
    trimmed.indexOf(" ") === -1
  );
  if (!isSlug) return trimmed;
  if (SLUG_TO_TITLE_OVERRIDES[trimmed]) {
    return SLUG_TO_TITLE_OVERRIDES[trimmed];
  }
  return trimmed.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}


// Date-bucket label for the History page grouping.
// Boundaries are based on local-time calendar dates (not strict 24h windows)
// so "Today" means today's date, "Yesterday" means yesterday's date, etc.
//   Today:      today's calendar date
//   Yesterday:  yesterday's calendar date
//   This week:  within last 7 days, excluding today/yesterday
//   This month: within last 30 days, excluding the above
//   Older:      anything older than 30 days
function historyBucket(ts) {
  const then = new Date(ts);
  const now = new Date();
  const startOfDay = (d) => {
    const x = new Date(d);
    x.setHours(0, 0, 0, 0);
    return x;
  };
  const today = startOfDay(now);
  const yest = new Date(today);
  yest.setDate(yest.getDate() - 1);
  const weekAgo = new Date(today);
  weekAgo.setDate(weekAgo.getDate() - 7);
  const monthAgo = new Date(today);
  monthAgo.setDate(monthAgo.getDate() - 30);

  const tDay = startOfDay(then);
  if (tDay.getTime() === today.getTime()) return "Today";
  if (tDay.getTime() === yest.getTime()) return "Yesterday";
  if (tDay.getTime() >= weekAgo.getTime()) return "This week";
  if (tDay.getTime() >= monthAgo.getTime()) return "This month";
  return "Older";
}
const HISTORY_BUCKET_ORDER = ["Today", "Yesterday", "This week", "This month", "Older"];

// Time-range bounds for each history bucket (as ISO strings, UTC).
// Used to build Supabase queries that fetch one bucket at a time.
// Returns { gte, lt } where: created_at >= gte AND created_at < lt
// Same calendar-day logic as historyBucket() above.
function historyBucketRange(bucket) {
  const now = new Date();
  const startOfDay = (d) => {
    const x = new Date(d);
    x.setHours(0, 0, 0, 0);
    return x;
  };
  const today = startOfDay(now);
  const tomorrow = new Date(today);
  tomorrow.setDate(tomorrow.getDate() + 1);
  const yest = new Date(today);
  yest.setDate(yest.getDate() - 1);
  const weekAgo = new Date(today);
  weekAgo.setDate(weekAgo.getDate() - 7);
  const monthAgo = new Date(today);
  monthAgo.setDate(monthAgo.getDate() - 30);

  switch (bucket) {
    case "Today":      return { gte: today.toISOString(),     lt: tomorrow.toISOString() };
    case "Yesterday":  return { gte: yest.toISOString(),      lt: today.toISOString() };
    case "This week":  return { gte: weekAgo.toISOString(),   lt: yest.toISOString() };
    case "This month": return { gte: monthAgo.toISOString(),  lt: weekAgo.toISOString() };
    case "Older":      return { gte: null,                    lt: monthAgo.toISOString() };
    default:           return { gte: null, lt: null };
  }
}

function fmtAge(ts) {
  if (!ts) return "";
  const mins = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  if (mins < 1440) {
    const h = Math.floor(mins / 60);
    const remM = mins % 60;
    return remM === 0 ? `${h}h ago` : `${h}h ${remM}m ago`;
  }
  return `${Math.floor(mins / 1440)}d ago`;
}

function fmtAgeShort(ts) {
  if (!ts) return "";
  const mins = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  if (mins < 1) return "now";
  if (mins < 60) return `${mins}m`;
  if (mins < 1440) return `${Math.floor(mins / 60)}h`;
  return `${Math.floor(mins / 1440)}d`;
}

function lsGet(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v === null ? fallback : v;
  } catch (e) {
    return fallback;
  }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, val); } catch (e) {}
}

// ─── Detection card ─────────────────────────────────────────────────
// ─── In-app clip trimmer (v6.20) ───────────────────
// Pure audio core for the in-app trimmer. No DOM, no JSX - unit-testable.
const TRIM_TOTAL = 240000, TRIM_RATE = 48000;
const TRIM_AMBIENT_WIN = 19200; // 0.4s ambient source window
const TRIM_FADE = 240;          // 5ms seam crossfade
const TRIM_QUIET_MAX_RMS = 3000; // if the quietest 0.4s window is still louder
                                 // than this (~-27 dBFS), there is no clean
                                 // ambient to pad with -> decline.

function _trimParseWav(buf) {
  const dv = new DataView(buf);
  const tag = (o) => String.fromCharCode(dv.getUint8(o),dv.getUint8(o+1),dv.getUint8(o+2),dv.getUint8(o+3));
  if (tag(0) !== "RIFF" || tag(8) !== "WAVE") throw new Error("Not a WAV file");
  let off = 12, fmt = null, dataOff = -1, dataLen = 0;
  while (off + 8 <= dv.byteLength) {
    const id = tag(off), sz = dv.getUint32(off+4, true), body = off + 8;
    if (id === "fmt ") fmt = { audioFormat: dv.getUint16(body,true), channels: dv.getUint16(body+2,true),
                               sampleRate: dv.getUint32(body+4,true), bitsPerSample: dv.getUint16(body+14,true) };
    else if (id === "data") { dataOff = body; dataLen = sz; }
    off = body + sz + (sz & 1);
  }
  if (!fmt || dataOff < 0) throw new Error("Missing fmt/data chunk");
  if (fmt.audioFormat !== 1 || fmt.bitsPerSample !== 16) throw new Error("Not 16-bit PCM");
  const n = Math.floor(dataLen / 2);
  const samples = new Int16Array(n);
  for (let i = 0; i < n; i++) samples[i] = dv.getInt16(dataOff + i*2, true);
  return { sampleRate: fmt.sampleRate, channels: fmt.channels, bitsPerSample: fmt.bitsPerSample, samples };
}

function _trimRms(s, start, len) { let a = 0; for (let i=0;i<len;i++){const v=s[start+i]; a+=v*v;} return Math.sqrt(a/len); }

function _trimFindQuietWindow(s, winLen) {
  const n = s.length;
  if (winLen >= n) return { start: 0, rms: _trimRms(s,0,n) };
  const step = Math.max(1, Math.floor(winLen/4));
  let best = 0, bestRms = Infinity;
  for (let start = 0; start + winLen <= n; start += step) {
    const r = _trimRms(s, start, winLen);
    if (r < bestRms) { bestRms = r; best = start; }
  }
  return { start: best, rms: bestRms };
}

function _trimBuild(samples, selStart, selEnd, force) {
  const n = samples.length;
  selStart = Math.max(0, Math.min(selStart|0, n));
  selEnd   = Math.max(selStart, Math.min(selEnd|0, n));
  let L = selEnd - selStart;
  if (L <= 0) return { ok:false, reason:"Empty selection" };
  if (L > TRIM_TOTAL) { const extra=L-TRIM_TOTAL; selStart+=Math.floor(extra/2); L=TRIM_TOTAL; selEnd=selStart+L; }
  const out = new Int16Array(TRIM_TOTAL);
  if (L === TRIM_TOTAL) { for (let i=0;i<TRIM_TOTAL;i++) out[i]=samples[selStart+i]; return { ok:true, out, padded:0 }; }
  const q = _trimFindQuietWindow(samples, Math.min(TRIM_AMBIENT_WIN, n));
  if (q.rms > TRIM_QUIET_MAX_RMS && !force)
    return { ok:false, canForce:true,
             reason:"No quiet gap in this clip - padding will reuse the least-loud section (more of the same sound). Fine if that section is the bird; not fine if it is an obstruction (cars/voices).",
             detail:{ quietRms:Math.round(q.rms), maxRms:TRIM_QUIET_MAX_RMS } };
  const amb = samples.subarray(q.start, q.start + Math.min(TRIM_AMBIENT_WIN, n));
  const m = amb.length;
  const ambAt = (i) => { const cyc = Math.floor(i/m) % 2; const idx = cyc===0 ? (i%m) : (m-1-(i%m)); return amb[idx]; };
  const padTotal = TRIM_TOTAL - L;
  const padLeft = Math.floor(padTotal/2), padRight = padTotal - padLeft;
  const clamp = (v) => v<-32768?-32768:(v>32767?32767:Math.round(v));
  for (let i=0;i<padLeft;i++) out[i]=ambAt(i);
  for (let i=0;i<L;i++) out[padLeft+i]=samples[selStart+i];
  for (let i=0;i<padRight;i++) out[padLeft+L+i]=ambAt(padLeft+L+i);
  // left seam crossfade ambient->selection (only if there is left pad)
  if (padLeft > 0) {
    const f = Math.min(TRIM_FADE, L, padLeft);
    for (let i=0;i<f;i++){ const t=i/(f-1||1); const pos=padLeft+i; out[pos]=clamp(ambAt(pos)*(1-t)+samples[selStart+i]*t); }
  }
  // right seam crossfade selection->ambient (only if there is right pad)
  if (padRight > 0) {
    const f = Math.min(TRIM_FADE, L, padRight);
    for (let i=0;i<f;i++){ const t=i/(f-1||1); const pos=padLeft+L-f+i; out[pos]=clamp(samples[selStart+(L-f+i)]*(1-t)+ambAt(pos)*t); }
  }
  return { ok:true, out, padded:padTotal };
}

function _trimEncodeWav(int16) {
  const n = int16.length, buf = new ArrayBuffer(44 + n*2), dv = new DataView(buf);
  const wstr = (o,s) => { for (let i=0;i<s.length;i++) dv.setUint8(o+i, s.charCodeAt(i)); };
  wstr(0,"RIFF"); dv.setUint32(4,36+n*2,true); wstr(8,"WAVE"); wstr(12,"fmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,TRIM_RATE,true); dv.setUint32(28,TRIM_RATE*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  wstr(36,"data"); dv.setUint32(40,n*2,true);
  for (let i=0;i<n;i++) dv.setInt16(44+i*2, int16[i], true);
  return buf;
}

function _trimAbToB64(ab){
  const bytes=new Uint8Array(ab); let bin=""; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH){ bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+CH)); }
  return btoa(bin);
}

function TrimEditor({ clipUrl, clipFilename, onClose, onSaved }) {
  const [phase,setPhase]=useState("loading"); // loading|ready|error|saving
  const [err,setErr]=useState("");
  const [n,setN]=useState(0);
  const [selStart,setSelStart]=useState(0);
  const [selEnd,setSelEnd]=useState(0);
  const [needsForce,setNeedsForce]=useState(false);
  const samplesRef=useRef(null);
  const canvasRef=useRef(null);
  const containerRef=useRef(null);
  const draggingRef=useRef(null);
  const audioCtxRef=useRef(null);
  const srcNodeRef=useRef(null);
  const MINSEL=4800; // 0.1s minimum selection

  useEffect(()=>{
    let alive=true;
    (async()=>{
      try{
        const resp=await fetch(clipUrl);
        if(!resp.ok) throw new Error("fetch "+resp.status);
        const ab=await resp.arrayBuffer();
        const p=_trimParseWav(ab);
        if(!alive) return;
        samplesRef.current=p.samples;
        setN(p.samples.length); setSelStart(0); setSelEnd(p.samples.length);
        setPhase("ready");
      }catch(e){ if(alive){ setErr(String(e.message||e)); setPhase("error"); } }
    })();
    return ()=>{ alive=false; try{ if(srcNodeRef.current) srcNodeRef.current.stop(); }catch(_){} };
  },[clipUrl]);

  useEffect(()=>{
    const cv=canvasRef.current, s=samplesRef.current;
    if(!cv||!s||!n) return;
    const W=cv.width, H=cv.height, ctx=cv.getContext("2d");
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#0e1512"; ctx.fillRect(0,0,W,H);
    const xs=Math.round(selStart/n*W), xe=Math.round(selEnd/n*W);
    ctx.fillStyle="rgba(76,175,129,0.18)"; ctx.fillRect(xs,0,Math.max(1,xe-xs),H);
    ctx.strokeStyle="#7fb89e"; ctx.beginPath();
    const mid=H/2;
    for(let x=0;x<W;x++){
      const a=Math.floor(x/W*n), b=Math.min(n,Math.floor((x+1)/W*n));
      let mn=32767,mx=-32768;
      for(let i=a;i<b;i++){ const v=s[i]; if(v<mn)mn=v; if(v>mx)mx=v; }
      if(b<=a){ mn=0; mx=0; }
      const y1=mid-(mx/32768)*mid, y2=mid-(mn/32768)*mid;
      ctx.moveTo(x+0.5,y1); ctx.lineTo(x+0.5,y2);
    }
    ctx.stroke();
    const drawHandle=(x)=>{ const hx=Math.max(2,Math.min(W-2,x));
      ctx.strokeStyle="#ff3b30"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(hx,0); ctx.lineTo(hx,H); ctx.stroke();
      ctx.fillStyle="#ff3b30"; ctx.fillRect(hx-5,0,10,7); ctx.fillRect(hx-5,H-7,10,7); };
    drawHandle(xs); drawHandle(xe);
    ctx.lineWidth=1;
  },[n,selStart,selEnd]);

  function posToSample(clientX){
    const el=containerRef.current; if(!el||!n) return 0;
    const r=el.getBoundingClientRect();
    let f=(clientX-r.left)/r.width; f=f<0?0:(f>1?1:f);
    return Math.round(f*n);
  }
  function onDown(e){ e.stopPropagation(); const s=posToSample(e.clientX);
    draggingRef.current = Math.abs(s-selStart)<=Math.abs(s-selEnd) ? "start":"end"; onMove(e); }
  function onMove(e){
    if(!draggingRef.current) return; e.stopPropagation();
    const s=posToSample(e.clientX);
    if(draggingRef.current==="start"){ const cap=selEnd-MINSEL; setSelStart(Math.max(0, Math.min(s, cap<0?0:cap))); }
    else { const floor=selStart+MINSEL; setSelEnd(Math.min(n, Math.max(s, floor>n?n:floor))); }
  }
  function onUp(){ draggingRef.current=null; }

  function stopPlay(){ try{ if(srcNodeRef.current){ srcNodeRef.current.stop(); srcNodeRef.current=null; } }catch(_){} }
  function playSelection(e){
    e.stopPropagation(); const s=samplesRef.current; if(!s) return; stopPlay();
    const ctx=audioCtxRef.current||(audioCtxRef.current=new (window.AudioContext||window.webkitAudioContext)());
    const L=Math.max(1,selEnd-selStart);
    const buff=ctx.createBuffer(1,L,TRIM_RATE); const ch=buff.getChannelData(0);
    for(let i=0;i<L;i++) ch[i]=s[selStart+i]/32768;
    const node=ctx.createBufferSource(); node.buffer=buff; node.connect(ctx.destination); node.start();
    srcNodeRef.current=node;
  }

  async function save(e, force){
    e.stopPropagation(); const s=samplesRef.current; if(!s) return;
    const r=_trimBuild(s, selStart, selEnd, force);
    if(!r.ok){
      if(r.canForce && !force){ setNeedsForce(true); setErr(r.reason + (r.detail?(" ["+JSON.stringify(r.detail)+"]"):"")); return; }
      setErr(r.reason + (r.detail?(" ["+JSON.stringify(r.detail)+"]"):"")); return;
    }
    setNeedsForce(false);
    setErr(""); setPhase("saving"); stopPlay();
    try{
      const b64=_trimAbToB64(_trimEncodeWav(r.out));
      const resp=await fetch(PI_AUDIO_BASE+"/trim",{ method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ clip:clipFilename, wav_b64:b64, token:PI_TRIM_TOKEN }) });
      const txt=await resp.text();
      if(!resp.ok) throw new Error(resp.status+" "+txt);
      onSaved && onSaved();
    }catch(e2){ setErr("Save failed: "+String(e2.message||e2)); setPhase("ready"); }
  }

  const lenSec=(selEnd-selStart)/TRIM_RATE;
  const btn={ padding:"8px 12px", borderRadius:"var(--r-sm)", border:"1px solid var(--border)",
              background:"var(--surface-2)", color:"var(--text)", fontSize:13, cursor:"pointer" };
  return (
    <div onClick={(e)=>e.stopPropagation()} style={{ border:"1px solid var(--border)", borderRadius:"var(--r-sm)", padding:10, background:"var(--surface)" }}>
      {phase==="loading" && <div style={{ fontSize:13, color:"var(--text-2)" }}>Loading clip...</div>}
      {phase==="error" && <div style={{ fontSize:13, color:"#e06666" }}>Could not load clip: {err}</div>}
      {(phase==="ready"||phase==="saving") && (
        <div>
          <div ref={containerRef}
               onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerLeave={onUp}
               style={{ position:"relative", width:"100%", touchAction:"none", cursor:"ew-resize" }}>
            <canvas ref={canvasRef} width={600} height={80} style={{ width:"100%", height:80, display:"block", borderRadius:4 }} />
          </div>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:8, gap:8, flexWrap:"wrap" }}>
            <span style={{ fontSize:12, color:"var(--text-2)" }}>Keeping {lenSec.toFixed(2)}s of 5.00s</span>
            <div style={{ display:"flex", gap:6 }}>
              <button style={btn} onClick={playSelection}>&#9654; Play selection</button>
              <button style={{...btn, background:"#2e7d52", color:"#fff", borderColor:"#2e7d52", opacity:phase==="saving"?0.6:1 }}
                      disabled={phase==="saving"} onClick={save}>{phase==="saving"?"Saving...":"Save trimmed"}</button>
              {needsForce && (
                <button style={{...btn, background:"#b8860b", color:"#fff", borderColor:"#b8860b" }}
                        onClick={(e)=>save(e,true)}>Save anyway</button>
              )}
              <button style={btn} onClick={(e)=>{ e.stopPropagation(); stopPlay(); onClose&&onClose(); }}>Cancel</button>
            </div>
          </div>
          {err && <div style={{ fontSize:12, color:"#e06666", marginTop:6 }}>{err}</div>}
          <div style={{ fontSize:11, color:"var(--text-3)", marginTop:6 }}>
            Drag the edges to keep just the call. Saved as a 5s 48kHz clip; the cut parts are replaced with this clip&#39;s own quiet background. Overwrites the clip on the Pi (a timestamped backup is kept).
          </div>
        </div>
      )}
    </div>
  );
}

// Single detection row, used in both the live feed and the history view.
// `mode` is "live" or "history" - in live mode, the action buttons are
// Confirm (✓) and Dismiss (×); in history they appear too, but only on
// cards that haven't been acted on yet. Cards already corrected or
// confirmed in history show no buttons (the action is done).
//
// v4 props: classification (priority/normal/suspect/muted),
//           onSetClassification(label, newState) - changes user's classification
//           onSetManualLabel(detectionId, label) - records manual relabel
// v5.2 props: onConfirm(detectionId) - records "BirdNET was right" + dismisses
//             corpusCount: number of clips already in training corpus for this
//               species (used for per-card tier dot)
// v5.4 props: onReview(detectionId) - marks card as reviewed (no opinion).
//             Wired to the × button when in history mode, so reviewing-but-not-
//             confirming-or-correcting becomes an explicit action. Cards marked
//             reviewed get a grey badge and drop out of the Unaddressed filter.
// v5.4.2 props: labelSuggestions: deduped sorted list of strings combining
//             prior manual_labels and BirdNET species_guess values across
//             all loaded detections. Used to drive autocomplete on the
//             "what is this actually?" input. Prevents duplicate variants
//             like "Common Myna" vs "Common Mynah".
function DetectionCard({ d, expanded, onToggle, onDismiss, onRestore, mode,
                         classification, onSetClassification, onSetManualLabel,
                         onConfirm, onReview, onDiscard, corpusCount, labelSuggestions,
                         onSetSwapVerdict }) {
  const label = birdLabel(d);
  const meta = d.metadata || {};
  const conf = Math.round((d.confidence || 0) * 100);

  const isPriorityCls = classification === "priority";
  const isSuspectCls  = classification === "suspect";

  // v5: user has supplied a correction (manual_label differs from species_guess)
  const corrected = isCorrected(d);

  // v5.2: user has confirmed BirdNET was right (separate from correction)
  const confirmed = isConfirmed(d);

  // v5.4: user has marked card as reviewed (no opinion either way)
  const reviewed = isReviewed(d);

  // v5.5: BirdNET post-processor remap. Applies only when:
  //   - BirdNET's guess is in BIRDNET_REMAPS table, AND
  //   - The user hasn't already acted on the card (no correction/confirm)
  // When active, we display the remap.primary as the headline label and
  // show BirdNET's original guess in subtext. Confirm button writes the
  // remapped label as manual_label (so the Pi promotes to the right folder).
  const remap = (!corrected && !confirmed) ? remapBirdNet(d.species_guess) : null;
  const displaySpecies = remap ? remap.primary : d.species_guess;

  // Do we show the Confirm/Dismiss buttons?
  // Live: always show.
  // History: show only if not already actioned in any way (no badge of any colour).
  const actioned = corrected || confirmed || reviewed;
  const showActionButtons = mode === "live" || !actioned;

  // v6: Swap UI - shown when this card qualifies (live + BB ran + not yet actioned).
  // Two prediction "buttons" stacked: higher-confidence at top, lower at bottom.
  // User can tap bottom to swap them. Top = "current selection" committed on tick.
  const useSwapUI = (mode === "live" || mode === "history") && !!d.bb_species && !corrected && !confirmed && !reviewed;

  // selectedSource tracks which prediction is "the top one" right now.
  // Initial: whichever model has higher confidence.
  const _bnConfRaw = d.confidence || 0;
  const _bbConfRaw = d.bb_confidence || 0;
  const _decConfRaw = d.decider_confidence || 0;
  const hasDecider = !!d.decider_species;
  const deciderReasonBadge = (() => {
    const r = String(d.decider_reason || "").toLowerCase();
    if (r.indexOf("agreement") === 0) return "both agree";
    if (r.indexOf("pair+hour") === 0) return "time-of-day history";
    if (r.indexOf("pair") === 0) return "history";
    if (r.indexOf("bn-unreliable") === 0) return "BN unreliable";
    if (r.indexOf("conf") === 0) return "confidence";
    if (r.indexOf("fallback") === 0) return "best guess";
    return d.decider_reason || "decider";
  })();
  // Item C: when the card is region-flagged ("LIKELY MISIDENTIFIED") and BB
  // has an opinion, default BB to the top prediction - BirdNET's guess is
  // suspect for this region. User can still tap to swap back to BirdNET.
  // Uses d.metadata directly (regionFlagged var is declared further down).
  const [selectedSource, setSelectedSource] = useState(
    hasDecider ? "decider"
      : (d.metadata && d.metadata.region_match === false && d.bb_species) ? "boundarybirds"
      : (_bnConfRaw >= _bbConfRaw ? "birdnet" : "boundarybirds")
  );
  // v6.1: customLabel holds user-typed species when selectedSource === "custom".
  // Save button promotes the typed value to top without writing to DB.
  const [customLabel, setCustomLabel] = useState("");
  // v6.2: addToCorpus controls whether ticking ALSO saves the clip to corpus.
  // Default OFF - user must opt in to corpus inclusion. Lets you confirm a
  // verdict without polluting training data with noisy/multi-bird clips.
  const [addToCorpus, setAddToCorpus] = useState(false);
  // v6.15: bothAlsoCorrect: opt-in flag, when ticked it modifies the
  // tick button to write bb_also_correct=true. Resets when card unmounts.
  const [bothAlsoCorrect, setBothAlsoCorrect] = useState(false);

  // Helpers to get top and bottom prediction details based on selectedSource.
  // v6.1: "custom" source means user typed a different species via Save.
  // verdict for "custom" maps to "neither" (top write target).
  const getTopPrediction = () => {
    if (selectedSource === "custom") {
      return { species: customLabel, conf: null, source: "neither" };
    }
    if (selectedSource === "decider") {
      return { species: canonicaliseSpeciesLabel(d.decider_species), conf: _decConfRaw, source: "decider" };
    }
    if (selectedSource === "birdnet") {
      return { species: d.species_guess, conf: _bnConfRaw, source: "birdnet" };
    }
    return { species: canonicaliseSpeciesLabel(d.bb_species), conf: _bbConfRaw, source: "boundarybirds" };
  };
  const getBottomPrediction = () => {
    // When custom is on top, bottom shows BirdNET as the revert option.
    // (User can tap to revert to BN. If they wanted BB, tap again to swap.)
    if (selectedSource === "custom") {
      return { species: d.species_guess, conf: _bnConfRaw, source: "birdnet" };
    }
    if (selectedSource === "birdnet") {
      return { species: canonicaliseSpeciesLabel(d.bb_species), conf: _bbConfRaw, source: "boundarybirds" };
    }
    return { species: d.species_guess, conf: _bnConfRaw, source: "birdnet" };
  };

  // v3: regional plausibility
  const regionFlagged = meta.region_match === false;
  const regionCount = typeof meta.region_count === "number" ? meta.region_count : null;

  // v4: manual label persisted in the row's metadata

  const filteredSuggestions = useMemo(() => {
    if (!labelSuggestions || labelSuggestions.length === 0) return [];
    const q = (manualLabelDraft || "").trim().toLowerCase();
    if (q.length < 2) return [];
    // Two-bucket ranking: exact-prefix matches first, then substring matches
    const prefix = [];
    const substring = [];
    for (const s of labelSuggestions) {
      const lower = s.toLowerCase();
      if (lower === q) continue;  // skip exact match (no point suggesting current input)
      if (lower.startsWith(q)) prefix.push(s);
      else if (lower.includes(q)) substring.push(s);
    }
    return [...prefix, ...substring].slice(0, 6);
  }, [manualLabelDraft, labelSuggestions]);

  // Stop propagation so action button clicks don't toggle the card
  function handleAction(e, fn) {
    e.stopPropagation();
    fn?.();
  }

  // Border styling by classification (live mode only)

    } else if (isSuspectCls) {
      borderColor = "rgba(202, 138, 4, 0.55)";
      borderLeft = "4px solid #ca8a04";
    } else if (regionFlagged) {
      borderColor = "rgba(202, 138, 4, 0.45)";
      borderLeft = "4px solid #ca8a04";
    }
  }

  async function handleSaveManualLabel(e) {
    e.stopPropagation();
    if (manualSaving) return;
    const trimmed = manualLabelDraft.trim();
    if (!trimmed) return;
    // v6.1: In swap mode, Save promotes the custom value to top WITHOUT
    // writing to DB. User must then click tick/cross to commit (and choose
    // whether to save the clip to corpus or just record the decision).
    if (useSwapUI) {
      setCustomLabel(trimmed);
      setSelectedSource("custom");
      return;
    }
    // Legacy flow: old cards without swap UI write directly + auto-dismiss.
    setManualSaving(true);
    try {
      await onSetManualLabel?.(d.id, trimmed, clipFilename);
    } finally {
      setManualSaving(false);
    }
  }

  function cycleClassification(e) {
    e.stopPropagation();
    const order = ["normal", "priority", "suspect", "muted"];
    const cur = classification || "normal";
    const next = order[(order.indexOf(cur) + 1) % order.length];
    onSetClassification?.(label, next);
  }

  return (
    <div onClick={onToggle}
      style={{
        position: "relative",
        background: "var(--surface)",
        border: "1px solid " + borderColor,
        borderLeft,
        borderRadius: "var(--r-md)",
        padding: "14px 16px",
        cursor: "pointer",
        boxShadow: "var(--shadow)",
        opacity: mode === "history" ? 0.85 : 1,
      }}>

      {/* v5.7: discard button - history mode only. Renders independently
          of the action-buttons cluster so it appears on actioned cards
          (confirmed/corrected/reviewed) too - those are exactly the
          cards in training-corpus that we might want to remove. Positioned
          left of the badge area so it doesn't overlap. */}
      {mode === "history" && onDiscard && (
        <button
          onClick={(e) => {
            e.stopPropagation();
            if (window.confirm("Discard this clip? It'll be removed from training.")) {
              onDiscard(d.id);
            }
          }}
          aria-label="Discard from training corpus"
          title="Discard: remove this clip from training"
          style={{
            position: "absolute", top: 8, right: 38,
            width: 22, height: 22, borderRadius: "50%",
            background: "#b91c1c",
            color: "#fff",
            border: "none",
            cursor: "pointer",
            fontSize: 11, lineHeight: 1,
            display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: "0 1px 3px rgba(185, 28, 28, 0.4)",
            zIndex: 3,
          }}
        >🗑</button>
      )}

      {/* v5/v5.2/v5.4: top-right corner content. Mutually exclusive:
          - Corrected (green ✓ badge) takes priority over confirmed
          - Confirmed (blue ✓ badge) takes priority over reviewed
          - Reviewed (grey · badge, v5.4) - "I looked at this, no opinion"
          - Otherwise show the action buttons (Confirm ✓ and × Skip/Dismiss).
            In live mode × dismisses to history. In history mode × marks
            the card as reviewed so it leaves the Unaddressed filter.
          v5.4: badges are FILLED with no border. Buttons have a thin white
          border + outer shadow so they read as interactive. This stops the
          "is it a button or a badge?" confusion. */}
      {corrected && (
        <div
          title={`You corrected this to: ${meta.manual_label}`}
          aria-label={`Corrected to ${meta.manual_label}`}
          style={{
            position: "absolute", top: 8, right: 8,
            width: 22, height: 22, borderRadius: "50%",
            background: "var(--success)",
            color: "#fff",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 13, fontWeight: 700, lineHeight: 1,
            boxShadow: "0 1px 2px rgba(21, 128, 61, 0.35)",
            zIndex: 2,
          }}
        >✓</div>
      )}
      {confirmed && !corrected && (
        <div
          title={`You confirmed: ${d.species_guess}`}
          aria-label={`Confirmed ${d.species_guess}`}
          style={{
            position: "absolute", top: 8, right: 8,
            width: 22, height: 22, borderRadius: "50%",
            background: "#1d4ed8",
            color: "#fff",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 13, fontWeight: 700, lineHeight: 1,
            boxShadow: "0 1px 2px rgba(29, 78, 216, 0.35)",

      {reviewed && !confirmed && !corrected && (
        <div
          title="You marked this as reviewed (no opinion). Not in training corpus."
          aria-label="Reviewed - no opinion"
          style={{
            position: "absolute", top: 8, right: 8,

            background: "var(--text-3)",
            color: "#fff",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 13, fontWeight: 700, lineHeight: 1,
            boxShadow: "0 1px 2px rgba(0, 0, 0, 0.15)",

      {showActionButtons && !actioned && (
        <div style={{
          position: "absolute", top: 6, right: 6,
          display: "flex", gap: 4, zIndex: 2,
        }}>
          {onConfirm && (
            <button
              onClick={(e) => handleAction(e, () => {
                // v6.2: Tick = Confirm. Records the verdict regardless of

                if (onSetSwapVerdict) {
                  // Determine the top prediction:
                  //   swap mode: use getTopPrediction (handles BN/BB/custom)
                  //   legacy mode: use the displayed species (manual_label > remap > BN)
                  let topSpecies, topSource;
                  if (useSwapUI) {
                    const top = getTopPrediction();
                    topSpecies = top.species;
                    topSource = top.source;
                  } else {
                    topSpecies = (meta.manual_label || (remap && remap.primary) || d.species_guess || "").trim();
                    // Non-swap card with manual_label or remap: source counts
                    // as "neither" since user/system overrode BirdNET.
                    // No manual_label and no remap: it's just BirdNET.
                    topSource = (meta.manual_label || remap) ? "neither" : "birdnet";
                  }
                  if (topSpecies) {
                    onSetSwapVerdict(d.id, {
                      verdict: topSource,
                      speciesTruth: topSpecies,
                      addToCorpus: addToCorpus,
                      source: topSource,
                      // v6.15: opt-in flag from checkbox below classification
                      bbAlsoCorrect: bothAlsoCorrect,
                    });
                    return;
                  }
                }
                // Fallback if onSetSwapVerdict not wired (defensive): legacy
                // confirm path. Should not happen in live mode.
                if (remap && onSetManualLabel) {
                  onSetManualLabel(d.id, remap.primary, clipFilename);
                } else {
                  onConfirm(d.id);
                }
              })}
              aria-label={remap ? `Confirm as ${remap.primary}` : "Confirm BirdNET's call"}
              title={remap ? `Confirm: ${remap.primary}` : "Confirm: BirdNET is right"}
              style={{
                width: 32, height: 32, borderRadius: "50%",
                background: "#1d4ed8",
                color: "#fff",
                // v5.4: buttons get a white inner border so they're visually
                // distinct from the flat-filled badges
                border: "2px solid #fff",
                cursor: "pointer",
                fontSize: 14, fontWeight: 700, lineHeight: 1,
                display: "flex", alignItems: "center", justifyContent: "center",
                boxShadow: "0 2px 6px rgba(29, 78, 216, 0.45)",
              }}
            >✓</button>
          )}
          {/* The × button:
              - in live mode: dismisses to history
              - in history mode: marks the card as reviewed (drops out of Unaddressed)
              v5.4 fix: previously this button did nothing in history because
              onDismiss wasn't wired for history. */}
          <button
            onClick={(e) => handleAction(e, () => {
              // v6.2: Cross = pure dismiss. No verdict logged. No clip
              // saved. The card disappears and that's it - no judgement
              // captured. Use when you genuinely don't know what the
              // species is (3 birds in clip, garbled audio, etc).
              if (mode === "history" && onReview) {
                onReview(d.id);
              } else if (onDismiss) {
                onDismiss();
              }
            })}
            aria-label={mode === "history" ? "Mark reviewed" : "Dismiss"}
            title={mode === "history"
              ? "Skip: mark as reviewed (no opinion)"
              : "Dismiss: file without acting"}
            style={{
              width: 32, height: 32, borderRadius: "50%",
              background: "#fff",
              color: "var(--text-2)",
              border: "2px solid var(--border)",
              cursor: "pointer",
              fontSize: 18, fontWeight: 600, lineHeight: 1,
              display: "flex", alignItems: "center", justifyContent: "center",
              boxShadow: "0 2px 6px rgba(0, 0, 0, 0.12)",
            }}
          >×</button>
        </div>
      )}

      {/* Suspect banner takes priority over region banner. Both are yellow but
          carry slightly different messages. */}
      {isSuspectCls && mode === "live" && (
        <div style={{
          display: "flex", alignItems: "center", gap: 8,
          margin: "-2px -4px 10px",
          padding: "8px 10px",
          background: "rgba(254, 243, 199, 0.85)",
          border: "1px solid rgba(202, 138, 4, 0.45)",
          borderRadius: "var(--r-sm)",
          fontSize: 12, color: "#854d0e", lineHeight: 1.35,
        }}>
          <span style={{ fontSize: 16, lineHeight: 1 }}>⚠️</span>
          <span style={{ flex: 1 }}>
            <strong>Suspect</strong> — you've marked this species as likely misidentified.
            Listen to the clip and record what it actually is.
          </span>
        </div>
      )}
      {!isSuspectCls && regionFlagged && mode === "live" && (
        <div style={{
          display: "flex", alignItems: "center", gap: 8,
          margin: "-2px -4px 10px",
          padding: "8px 10px",
          background: "rgba(254, 243, 199, 0.85)",
          border: "1px solid rgba(202, 138, 4, 0.35)",
          borderRadius: "var(--r-sm)",
          fontSize: 12, color: "#854d0e", lineHeight: 1.35,
        }}>
          <span style={{ fontSize: 16, lineHeight: 1 }}>⚠️</span>
          <span style={{ flex: 1 }}>
            <strong>Likely misidentified</strong> — not recorded within 10km of your home in eBird data.
          </span>
        </div>
      )}

      <div style={{ display: "flex", alignItems: "flex-start",
          justifyContent: "space-between", gap: 12 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          {useSwapUI ? (
            hasDecider ? (
            (() => {
            const decS = canonicaliseSpeciesLabel(d.decider_species);
            const decP = Math.round((_decConfRaw||0)*100);
            const bnS = d.species_guess, bbS = canonicaliseSpeciesLabel(d.bb_species);
            const bnP = Math.round((_bnConfRaw||0)*100), bbP = Math.round((_bbConfRaw||0)*100);
            const dlc = String(decS||"").toLowerCase();
            const mBN = !!dlc && dlc === String(canonicaliseSpeciesLabel(d.species_guess)||"").toLowerCase();
            const mBB = !!dlc && dlc === String(bbS||"").toLowerCase();
            const sD = selectedSource==="decider", sB=selectedSource==="birdnet", sX=selectedSource==="boundarybirds";
            const evN = (typeof d.decider_evidence_n==="number") ? d.decider_evidence_n : null;
            const box = (a,lab,sp,p,pick,fn) => (
              <button onClick={(e)=>{e.stopPropagation();fn();}} aria-label={"Select "+lab+": "+sp} title={"Select "+lab+": "+sp}
                style={{flex:1,minWidth:0,textAlign:"left",padding:"6px 8px",background:a?"rgba(31,107,58,0.10)":"var(--surface-2)",border:a?"2px solid var(--success)":"1px solid var(--border)",borderRadius:"var(--r-sm)",cursor:"pointer",fontFamily:"inherit",display:"flex",flexDirection:"column",gap:2}}>
                <span style={{display:"flex",alignItems:"center",gap:4}}>
                  <span style={{fontSize:9,fontWeight:700,color:"var(--text-3)",letterSpacing:0.5}}>{lab}</span>
                  {pick && (<span style={{fontSize:8,fontWeight:700,color:"var(--success)",letterSpacing:0.3}}>= DEC</span>)}
                  <span style={{marginLeft:"auto",fontSize:10,color:"var(--text-3)"}}>{p}%</span>
                </span>
                <span style={{fontSize:13,color:"var(--text-2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{sp}</span>
              </button>
            );
            return (
              <div>
                {selectedSource==="custom" && (
                  <button onClick={(e)=>{e.stopPropagation();setSelectedSource("custom");}} aria-label={"Your typed label: "+customLabel} title={"You typed: "+customLabel}
                    style={{width:"100%",textAlign:"left",padding:"10px 12px",background:"rgba(31,107,58,0.12)",border:"2px solid var(--success)",borderRadius:"var(--r-sm)",marginBottom:6,cursor:"pointer",fontFamily:"inherit"}}>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:10,fontWeight:700,color:"var(--success)",letterSpacing:0.5}}>YOU TYPED</span>
                      <span style={{marginLeft:"auto",fontSize:11,color:"var(--text-3)",fontWeight:600}}>tap tick to save</span>
                    </div>
                    <div style={{fontSize:17,fontWeight:600,color:"var(--text)",lineHeight:1.25,marginTop:2}}>{customLabel}</div>
                  </button>
                )}
                <button onClick={(e)=>{e.stopPropagation();setSelectedSource("decider");}} aria-label={"Select decider verdict: "+decS} title={"Decider best guess: "+decS}
                  style={{width:"100%",textAlign:"left",padding:"10px 12px",background:sD?"rgba(31,107,58,0.12)":"var(--surface-2)",border:sD?"2px solid var(--success)":"1px solid var(--border)",borderRadius:"var(--r-sm)",marginBottom:6,cursor:"pointer",fontFamily:"inherit"}}>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    {isPriorityCls && (<span style={{color:"var(--accent)"}}>★</span>)}
                    {isSuspectCls && !isPriorityCls && (<span style={{color:"#ca8a04"}}>⚠</span>)}
                    <span style={{fontSize:10,fontWeight:700,color:"var(--success)",letterSpacing:0.5}}>DECIDER</span>
                    <span style={{fontSize:9,fontWeight:600,color:"var(--text-3)",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:999,padding:"1px 6px"}}>{deciderReasonBadge}</span>
                    <span style={{marginLeft:"auto",fontSize:11,color:"var(--text-3)",fontWeight:600}}>{decP}%</span>

                  <div style={{fontSize:10,color:"var(--text-3)",marginTop:3}}>decider · {deciderReasonBadge}{evN!==null?" · n="+evN:""}</div>

                </div>
              </div>
            );
            })()
            ) : (
            (() => {
              const top = getTopPrediction();

              const topConfPct = Math.round((top.conf || 0) * 100);

                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      {isPriorityCls && (
                        <span style={{ color: "var(--accent)" }}>★</span>

                      {isSuspectCls && !isPriorityCls && (
                        <span style={{ color: "#ca8a04" }}>⚠</span>
                      )}
                      <span style={{ fontSize: 10, fontWeight: 700,
                          color: "var(--success)", letterSpacing: 0.5 }}>
                        {topLabel}
                      </span>
                      <span style={{ marginLeft: "auto", fontSize: 11,
                          color: "var(--text-3)", fontWeight: 600 }}>
                        {topConfPct}%
                      </span>
                    </div>
                    <div style={{ fontSize: 17, fontWeight: 600,
                        color: "var(--text)", lineHeight: 1.25, marginTop: 2 }}>
                      {top.species}
                    </div>
                  </div>
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      setSelectedSource(bot.source);
                    }}
                    aria-label={"Switch selection to " + bot.species}
                    title={"Tap to select " + botLabel + ": " + bot.species}
                    style={{
                      width: "100%",
                      padding: "6px 10px",
                      background: "var(--surface-2)",
                      border: "1px solid var(--border)",
                      borderRadius: "var(--r-sm)",
                      cursor: "pointer",
                      textAlign: "left",
                      display: "flex", alignItems: "center", gap: 6,
                      fontFamily: "inherit",
                    }}
                  >
                    <span style={{ fontSize: 9, fontWeight: 700,
                        color: "var(--text-3)", letterSpacing: 0.5 }}>
                      {botLabel}
                    </span>
                    <span style={{ fontSize: 13, color: "var(--text-2)" }}>
                      {bot.species}
                    </span>
                    <span style={{ marginLeft: "auto", fontSize: 11,
                        color: "var(--text-3)" }}>
                      {botConfPct}%
                    </span>
                    <span style={{ fontSize: 11, color: "var(--text-3)",
                        marginLeft: 4 }} title="Tap to swap">⇅</span>
                  </button>
                </div>

            })()
            )
          ) : (
            <div style={{ fontSize: 17, fontWeight: 600, color: "var(--text)",
                lineHeight: 1.25 }}>
              {isPriorityCls && mode === "live" && (
                <span style={{ color: "var(--accent)", marginRight: 6 }}>★</span>
              )}
              {isSuspectCls && mode === "live" && !isPriorityCls && (
                <span style={{ color: "#ca8a04", marginRight: 6 }}>⚠</span>
              )}
              {displaySpecies}
            </div>
          )}
          {/* v5.5: when post-processor has remapped this prediction, surface
              BirdNET's original guess as small audit-trail text. Helps the
              user spot when the remap looks wrong, and preserves trust by
              not hiding the raw model output. */}
          {remap && !useSwapUI && (
            <div style={{ fontSize: 11, color: "var(--text-3)",
                marginTop: 3, fontStyle: "italic" }}>
              BirdNET said: {remap.original}
              {remap.confidence === "low" && (
                <span style={{ marginLeft: 6, color: "#ca8a04" }}>· uncertain</span>
              )}
            </div>
          )}
          {meta.scientific_name && !remap && !useSwapUI && (
            <div style={{ fontSize: 13, color: "var(--text-2)",
                fontStyle: "italic", marginTop: 3 }}>
              {meta.scientific_name}
            </div>
          )}
          {/* v5.5: quick-confirm chips for alternate likely species when
              the remap has more than one common correction target. Tap a
              chip to confirm THAT label instead of the primary. */}
          {remap && remap.alternates.length > 0 && mode === "live" && !useSwapUI && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 4,
                marginTop: 6 }}>
              <span style={{ fontSize: 11, color: "var(--text-3)",
                  alignSelf: "center", marginRight: 2 }}>or:</span>
              {remap.alternates.map(alt => (
                <button
                  key={alt}
                  onClick={(e) => handleAction(e, () => onSetManualLabel(d.id, alt, clipFilename))}
                  style={{
                    fontSize: 11, padding: "2px 8px",
                    background: "transparent", color: "var(--text-2)",
                    border: "1px solid var(--border)",
                    borderRadius: 999, cursor: "pointer",
                    whiteSpace: "nowrap",
                  }}
                  title={`Confirm as ${alt}`}
                >{alt}</button>
              ))}
            </div>
          )}
          {/* Manual relabel chip if set */}
          {meta.manual_label && (
            <div style={{ fontSize: 12, color: "var(--text)",
                marginTop: 6, padding: "3px 8px",
                background: "rgba(31, 107, 58, 0.1)",
                border: "1px solid rgba(31, 107, 58, 0.25)",
                borderRadius: 999, display: "inline-block" }}>
              You: <strong>{meta.manual_label}</strong>
            </div>
          )}
          {/* v6: BoundaryBirds 2nd-opinion chip. Only renders when bb_species
              is set. Color indicates whether BB agrees with the effective
              species (user correction wins over BirdNET guess). */}
          {d.bb_species && !useSwapUI && (() => {
            const _bbNorm = (s) => {
              if (!s) return "";
              // v6.11: normalise hyphens to spaces so slug "common-myna" and
              // Title "Common Myna" compare equal here.
              const k = String(s).trim().toLowerCase().replace(/-/g, " ");
              const remaps = {
                "little wattlebird": "wattlebird",
                "red wattlebird": "wattlebird",
                "australian raven": "raven",
                "forest raven": "raven",
                "little raven": "raven",
              };
              if (remaps[k]) return remaps[k];
              return k.split(/\s+/).join("-");
            };
            const effectiveTitle = (meta.manual_label || d.species_guess || "").trim();
            const agrees = _bbNorm(effectiveTitle) === _bbNorm(d.bb_species);
            const bbConfPct = Math.round((d.bb_confidence || 0) * 100);
            const bg = agrees
              ? "rgba(31, 107, 58, 0.08)"
              : "rgba(202, 138, 4, 0.10)";
            const border = agrees
              ? "rgba(31, 107, 58, 0.25)"
              : "rgba(202, 138, 4, 0.30)";
            const labelColor = agrees ? "var(--text-2)" : "#ca8a04";
            return (
              <div style={{ fontSize: 12, color: "var(--text)",
                  marginTop: 6, padding: "3px 8px",
                  background: bg,
                  border: "1px solid " + border,
                  borderRadius: 999, display: "inline-flex",
                  alignItems: "center", gap: 6,
                  maxWidth: "100%" }}
                title={agrees
                  ? "BoundaryBirds agrees with current label"
                  : "BoundaryBirds disagrees - listen to verify"}>
                <span style={{ fontSize: 10, fontWeight: 700,
                    color: labelColor, letterSpacing: 0.5 }}>BB</span>
                <strong style={{ fontWeight: 600 }}>{canonicaliseSpeciesLabel(d.bb_species)}</strong>
                <span style={{ color: "var(--text-3)" }}>.</span>
                <span>{bbConfPct}%</span>
                {!agrees && (
                  <span style={{ color: "#ca8a04", marginLeft: 2 }}
                    aria-label="disagreement">!</span>
                )}
              </div>
            );
          })()}
          <div style={{ fontSize: 13, color: "var(--text-2)", marginTop: 6 }}>
            {fmtAge(d.created_at)}
          </div>
          {/* v6.2: opt-in checkbox for adding to training corpus.
              Default OFF. Only shown when card has action buttons
              available (live mode or unactioned history). */}
        </div>
        <div style={{ display: "flex", flexDirection: "column",
            alignItems: "flex-end", flexShrink: 0, gap: 6,
            paddingTop: 28 }}>
          <div style={{
            fontSize: 18, fontWeight: 700,
            color: conf >= 75 ? "var(--success)" :
                   conf >= 50 ? "var(--primary)" : "var(--text-2)",
          }}>{conf}%</div>
          <div style={{ fontSize: 11, color: "var(--text-3)" }}>
            confidence
          </div>
          {/* v5.2: per-card corpus stat - shows how many clips are already
              in the training corpus for this species. Same font weight/colour
              as the confidence label so it doesn't fight for attention.
              Tier dot signals when a species is well-collected (green ●),
              building (yellow ◐), or still under-collected (no dot). */}
          {typeof corpusCount === "number" && (() => {
            // v5.7.5: 5-tier system via corpusTier helper
            const { dot, dotColor } = corpusTier(corpusCount);
            return (
              <div style={{
                fontSize: 11, color: "var(--text-3)",
                marginTop: 4, display: "flex",
                alignItems: "baseline", gap: 3,
                justifyContent: "flex-end",
              }}>
                <span>{corpusCount} clip{corpusCount === 1 ? "" : "s"}</span>
                {dot && <span style={{ color: dotColor, fontSize: 11 }}>{dot}</span>}
              </div>
            );
          })()}
          {/* Old × and Restore buttons removed in v5.2 - actions now live
              in the top-right corner button cluster. */}
        </div>
      </div>

      {expanded && (
        <div style={{ marginTop: 12, paddingTop: 12,
            borderTop: "1px solid var(--border)" }}>

          {/* v6.5: Save-clip checkbox moved INTO dropdown to prevent
              accidental ticks before listening. Right-aligned so it sits
              away from the audio play button. Same state + handlers as
              the previous header-level version. */}
          {showActionButtons && !actioned && (
            <div style={{ display: "flex", justifyContent: "flex-end",
                marginBottom: 8 }}>
              <label
                onClick={(e) => e.stopPropagation()}
                style={{
                  display: "inline-flex",
                  alignItems: "center", gap: 6,
                  fontSize: 11, color: "var(--text-2)",
                  cursor: "pointer",
                  userSelect: "none",
                }}
                title="When ticked, this clip will be saved to /training-corpus/<species>/ on confirm"
              >
                <input
                  type="checkbox"
                  checked={addToCorpus}
                  onChange={(e) => {
                    e.stopPropagation();
                    setAddToCorpus(e.target.checked);
                  }}
                  onClick={(e) => e.stopPropagation()}
                  style={{ cursor: "pointer", margin: 0 }}
                />
                <span>Save clip to training corpus</span>
              </label>
            </div>
          )}

          {/* v5.4.1: Inline audio player. Previously this was a "Play in new
              tab" link because the Pi served plain HTTP and the HTTPS web app
              couldn't mix-content-play inline. Now the Pi serves audio over
              HTTPS via Tailscale Serve, so the audio element works inline.
              Requires Tailscale running on the device for the .ts.net
              hostname to resolve correctly. */}
          {clipUrl && (
            <div style={{ marginBottom: 12 }}>
              <audio
                controls
                preload="none"
                src={trimmedAt ? clipUrl + (clipUrl.indexOf("?")>=0?"&":"?") + "t=" + trimmedAt : clipUrl}
                onClick={(e) => e.stopPropagation()}
                style={{
                  width: "100%",
                  height: 40,
                  borderRadius: "var(--r-sm)",
                }}
              />
            </div>
          )}
          {clipUrl && (mode === "live" || mode === "history") && (
            <div style={{ marginBottom: 12 }}>
              {!trimOpen ? (
                <button onClick={(e) => { e.stopPropagation(); setTrimOpen(true); }}
                  style={{ padding:"6px 12px", borderRadius:"var(--r-sm)", border:"1px solid var(--border)",
                           background:"var(--surface-2)", color:"var(--text-2)", fontSize:12, cursor:"pointer" }}>
                  ✂ Trim clip
                </button>
              ) : (
                <TrimEditor clipUrl={clipUrl} clipFilename={clipFilename}
                  onClose={() => setTrimOpen(false)}
                  onSaved={() => { setTrimmedAt(Date.now()); setTrimOpen(false); }} />
              )}
            </div>
          )}

          {/* Manual relabel input - available in both live and history mode.
              v5.3: previously gated to mode === "live" which meant cards
              that aged out of live (or were dismissed/confirmed) couldn't
              be relabelled. The 24h live window makes this problematic if
              the user doesn't get to review a card within a day. Now
              available everywhere. */}
          {clipUrl && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ display: "flex", gap: 6, position: "relative" }}>
                <div style={{ flex: 1, position: "relative" }}>
                  <input
                    type="text"
                    value={manualLabelDraft}
                    onChange={(e) => {
                      e.stopPropagation();
                      setManualLabelDraft(e.target.value);
                      setSuggestionsOpen(true);
                    }}
                    onFocus={() => setSuggestionsOpen(true)}
                    onBlur={() => {
                      // Defer the close so a click on a suggestion item can register
                      setTimeout(() => setSuggestionsOpen(false), 150);
                    }}
                    onClick={(e) => e.stopPropagation()}
                    placeholder="What is this actually? e.g. unknown"
                    style={{
                      width: "100%", padding: "8px 10px",
                      border: "1px solid var(--border)",
                      borderRadius: "var(--r-sm)",
                      fontSize: 14, fontFamily: "inherit",
                      background: "var(--surface)",
                      boxSizing: "border-box",
                    }}
                  />
                  {/* v5.4.2: autocomplete dropdown. Shows when input has 2+
                      chars and there are matching suggestions. Suggestions
                      come from your prior manual_labels + BirdNET's species
                      guesses across all loaded detections. */}
                  {suggestionsOpen && filteredSuggestions.length > 0 && (
                    <div
                      onClick={(e) => e.stopPropagation()}
                      style={{
                        position: "absolute",
                        top: "calc(100% + 2px)",
                        left: 0, right: 0,
                        background: "#fff",
                        border: "1px solid var(--border)",
                        borderRadius: "var(--r-sm)",
                        boxShadow: "0 4px 12px rgba(0, 0, 0, 0.1)",
                        maxHeight: 220,
                        overflowY: "auto",
                        zIndex: 10,
                      }}
                    >
                      {filteredSuggestions.map((s, i) => (
                        <button
                          key={s}
                          // onMouseDown fires before onBlur, so the suggestion
                          // click registers before the input deferred-close fires
                          onMouseDown={(e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            setManualLabelDraft(s);
                            setSuggestionsOpen(false);
                          }}
                          style={{
