                            display: "block", width: "100%", textAlign: "left",
                            padding: "8px 10px",
                            background: "transparent",
                            border: "none",
                            borderBottom: i < filteredSuggestions.length - 1
                              ? "1px solid var(--border)" : "none",
                            fontSize: 14,
                            fontFamily: "inherit",
                            color: "var(--text)",
                            cursor: "pointer",
                          }}
                        >
                          {s}
                        </button>
                      ))}
                    </div>
                  )}
                </div>
                <button
                  onClick={handleSaveManualLabel}
                  disabled={manualSaving || !manualLabelDraft.trim() || manualLabelDraft.trim() === (meta.manual_label || "")}
                  style={{
                    padding: "8px 14px",
                    background: "var(--primary)", color: "#fff",
                    border: "none", borderRadius: "var(--r-sm)",
                    fontSize: 13, fontWeight: 600, cursor: "pointer",
                    opacity: (manualSaving || !manualLabelDraft.trim() || manualLabelDraft.trim() === (meta.manual_label || "")) ? 0.5 : 1,
                  }}
                >{manualSaving ? "..." : "Save"}</button>
              </div>
            </div>
          )}

          {/* Classification quick-toggle */}
          {mode === "live" && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 10, color: "var(--text-3)",
                  fontWeight: 600, letterSpacing: 0.5,
                  textTransform: "uppercase", marginBottom: 6 }}>
                Species classification
              </div>
              <div style={{ display: "flex", gap: 4 }}>
                {Object.entries(CLASSIFICATIONS).map(([key, cfg]) => {
                  const active = (classification || "normal") === key;
                  return (
                    <button key={key}
                      onClick={(e) => { e.stopPropagation(); onSetClassification?.(label, key); }}
                      style={{
                        flex: 1, padding: "8px 6px",
                        background: active ? cfg.color : "var(--surface)",
                        color: active ? "#fff" : "var(--text-2)",
                        border: "1px solid " + (active ? cfg.color : "var(--border)"),
                        borderRadius: "var(--r-sm)",
                        fontSize: 11, fontWeight: 500, cursor: "pointer",
                        display: "flex", flexDirection: "column", gap: 2,
                        alignItems: "center",
                      }}>
                      <span style={{ fontSize: 14 }}>{cfg.icon}</span>
                      <span>{cfg.label}</span>
                    </button>
                  );
                })}
              </div>
              <div style={{ fontSize: 11, color: "var(--text-3)", marginTop: 6 }}>
                Affects all detections of <strong>{d.species_guess}</strong>, current and future.
              </div>
            </div>
          )}

          {/* v6.15: Both-correct checkbox. Opt-in metadata that the
              tick button reads. Only shown when BB ran on this clip
              and the card is actionable. Ticking it then clicking the
              tick (top-right) writes bb_also_correct=true. */}
          {useSwapUI && mode === "live" && showActionButtons && !actioned && (
            <div style={{ marginBottom: 12 }}>
              <label
                onClick={(e) => e.stopPropagation()}
                style={{
                  display: "inline-flex",
                  alignItems: "center", gap: 6,
                  fontSize: 12, color: "var(--text-2)",
                  cursor: "pointer",
                  userSelect: "none",
                }}
                title="Tick if both BirdNET and BB are calling real species in this clip (multi-bird)"
              >
                <input
                  type="checkbox"
                  checked={bothAlsoCorrect}
                  onChange={(e) => {
                    e.stopPropagation();
                    setBothAlsoCorrect(e.target.checked);
                  }}
                  onClick={(e) => e.stopPropagation()}
                  style={{ cursor: "pointer", margin: 0 }}
                />
                <span>Both correct</span>
              </label>
            </div>
          )}

          {/* Metadata grid */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {[
              { l: "Detected", v: new Date(d.created_at).toLocaleString("en-AU", {
                  hour: "2-digit", minute: "2-digit",
                  day: "2-digit", month: "short" }) },
              { l: "Window", v: meta.start_time_secs != null
                  ? `${meta.start_time_secs.toFixed(1)}–${(meta.end_time_secs || 0).toFixed(1)}s`
                  : "—" },
              ...(meta.region_match !== undefined ? [{
                l: "10km eBird records",
                v: regionFlagged
                  ? "Not recorded within 10km"
                  : (regionCount ? `${regionCount.toLocaleString()} sighting${regionCount === 1 ? "" : "s"}` : "Plausible"),
                span: true,
              }] : []),
            ].map(x => (
              <div key={x.l} style={{ background: "var(--surface-2)",
                  borderRadius: "var(--r-sm)", padding: "8px 10px",
                  gridColumn: x.span ? "1 / -1" : "auto" }}>
                <div style={{ fontSize: 10, color: "var(--text-3)",
                    fontWeight: 600, letterSpacing: 0.5,
                    textTransform: "uppercase", marginBottom: 2 }}>{x.l}</div>
                <div style={{ fontSize: 13,
                    color: x.l === "10km eBird records" && regionFlagged ? "#854d0e" : "var(--text)",
                    fontWeight: 500 }}>{x.v}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Main app ───────────────────────────────────────────────────────
function App() {
  const [detections, setDetections] = useState([]);
  // reappear-fix: IDs the user just actioned (dismiss/confirm/correct/swap).
  // Maps id -> expiry timestamp. fetchLive keeps these hidden until the
  // server catches up, so a poll mid-PATCH can't resurrect a handled card.
  const pendingDismissRef = useRef(new Map());
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [lastFetch, setLastFetch] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);
  // v6.8: separate corpus sheet (top-level reference view).
  const [corpusOpen, setCorpusOpen] = useState(false);
  const [expandedId, setExpandedId] = useState(null);
  const [now, setNow] = useState(Date.now());

  // viewMode = "live" (default) | "history"
  const [viewMode, setViewMode] = useState("live");

  const [viewFilter, setViewFilter] = useState(() => lsGet(LS.filter, "all"));
  // v6.1: live feed sort direction. "desc" = newest first (default),
  // "asc" = oldest first (helps grind through backlog chronologically).
  const [liveSortDir, setLiveSortDir] = useState(() => lsGet(LS.liveSort, "desc"));
  const [notifMode, setNotifMode] = useState(() => lsGet(LS.notifMode, "priority"));
  const [confThreshold, setConfThreshold] = useState(() => parseFloat(lsGet(LS.conf, "0.40")));

  // v4: quad-state classification per species. Loaded from localStorage,
  // seeded with DEFAULT_PRIORITY_SPECIES on first run. Migrated from the
  // old bca_muted set if present.
  const [classifications, setClassificationsState] = useState(() => {
    let c = loadClassifications();
    if (c === null) {
      c = seedClassifications();
    } else {
      c = migrateClassificationKeys(c);  // v6.19: one-time canonical de-dupe
    }
    return c;
  });

  // Wrapper that persists + syncs to server. Use this everywhere instead
  // of setClassificationsState directly.
  const setClassifications = useCallback((updater) => {
    setClassificationsState(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      saveClassifications(next);
      // Fire-and-forget sync of muted list to Supabase pi_config
      syncMutedToServer(next);
      return next;
    });
  }, []);

  const [notifPerm, setNotifPerm] = useState(() =>
    typeof Notification !== "undefined" ? Notification.permission : "unsupported");
  const lastNotifId = useRef(lsGet(LS.lastNotif, null));
  // v5.2: ref to fetchCorpusStats so action callbacks can nudge a refresh
  // without taking fetchCorpusStats as a dep (it's defined later in the
  // component, and we'd rather not reorder code).
  const corpusRefreshRef = useRef(null);

  // Persist settings
  useEffect(() => { lsSet(LS.filter, viewFilter); }, [viewFilter]);
  useEffect(() => { lsSet(LS.liveSort, liveSortDir); }, [liveSortDir]);
  useEffect(() => { lsSet(LS.notifMode, notifMode); }, [notifMode]);
  useEffect(() => { lsSet(LS.conf, String(confThreshold)); }, [confThreshold]);

  // Sync muted list to Pi once on mount. Future updates go through
  // setClassifications which also syncs.
  useEffect(() => {
    syncMutedToServer(classifications);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Tick "now" every 30s so age labels update without re-fetching
  useEffect(() => {
    const iv = setInterval(() => setNow(Date.now()), 30000);
    return () => clearInterval(iv);
  }, []);

  // ─── Data layer: live window + history buckets ─────────────────────
  //
  // We split data into two scopes:
  //   1. LIVE WINDOW: last 24 hours. Pulled every 20s. Includes both
  //      dismissed and non-dismissed rows. The live feed shows the
  //      non-dismissed subset; the History "Today" bucket shows the
  //      dismissed subset of this same data, so dismissing a card today
  //      makes it appear in "Today" instantly with no extra fetch.
  //   2. HISTORY BUCKETS (Yesterday / This week / This month / Older):
  //      lazy-loaded. Not fetched until the user expands the bucket.
  //      Cached for the session after first load.
  //
  // This is the v5 fix for the limit=100 problem: in v4 we asked for the
  // last 100 rows regardless of age, so high detection volume pushed
  // older dismissed rows out of the response before they reached the
  // client. Now the live query is time-bounded, and history queries are
  // bucket-bounded.

  // History bucket cache. Keyed by bucket name. Each entry:
  //   { items: [...], loading: bool, loaded: bool, error: string|null }
  // "loaded" distinguishes "we tried and got zero results" from "we
  // haven't tried yet".
  const [historyBuckets, setHistoryBuckets] = useState({});

  // Which history buckets are expanded. Today is expanded by default
  // (it auto-fills from the live window). Others wait for user tap.
  const [expandedBuckets, setExpandedBuckets] = useState(() => ({
    "Today": true,
    "Yesterday": false,
    "This week": false,
    "This month": false,
    "Older": false,
  }));

  // History classification filter: which classifications to show.
  // v5.8.1: muted is now included as a chip (default OFF) so user can
  // opt-in to viewing muted clips for audit/quality-review purposes.
  const [historyClsFilter, setHistoryClsFilter] = useState({
    priority: true,
    suspect: true,
    normal: true,
    muted: false,
  });

  // v5.4: History status filter. One-of-four pick (single select):
  //   - "all" (default): show everything regardless of badge state
  //   - "unaddressed": show cards with no badge - haven't been actioned
  //   - "confirmed": show only cards you tapped Confirm on (blue ✓)
  //   - "corrected": show only cards you manually relabeled (green ✓)
  //   - "reviewed": show only cards you marked reviewed/skipped (grey ·)
  //
  // Persisted in localStorage so it survives across sessions.
  const [historyStatusFilter, setHistoryStatusFilter] = useState(() => {
    const _v = lsGet(LS.historyStatusFilter, "all");
    return (_v === "confirmed" || _v === "corrected") ? "corpus" : _v;
  });
  useEffect(() => {
    lsSet(LS.historyStatusFilter, historyStatusFilter);
  }, [historyStatusFilter]);

  // v5.7: History species filter. Single-select: "all" or a specific
  // species_guess value. Source list is derived from currently-loaded
  // history items, so the dropdown only ever offers species you can
  // actually filter to. Persisted in localStorage.
  const [historySpeciesFilter, setHistorySpeciesFilter] = useState(() =>
    lsGet(LS.historySpeciesFilter, "all"));
  useEffect(() => {
    lsSet(LS.historySpeciesFilter, historySpeciesFilter);
  }, [historySpeciesFilter]);

  // Refs for callbacks that should not re-create the polling interval
  const classificationsRef = useRef(classifications);
  useEffect(() => { classificationsRef.current = classifications; }, [classifications]);

  // Fetch the live 24-hour window. Includes dismissed and non-dismissed
  // so the "Today" bucket of history is populated for free. Returns
  // newest-first, capped at 500 rows as a safety net (24h × ~10/h ≈ 240
  // typical, but storms can spike).
  const fetchLive = useCallback(async () => {
    try {
      // v5.7.4: extended live window from 24h to 48h to give the user
      // more time to review before clips drop into History.
      const cutoff = new Date(Date.now() - 48 * 60 * 60 * 1000).toISOString();
      const r = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?source=eq.bird_detection`
          + `&created_at=gte.${encodeURIComponent(cutoff)}`
          + `&order=created_at.desc&limit=500`,
        { headers: SUPA_HEADERS }
      );
      if (!r.ok) {
        setError(`Couldn't load detections (${r.status})`);
        setLoading(false);
        return;
      }
      const data = await r.json();
      // reappear-fix: honour locally-pending dismissals. Prune expired
      // entries and any the server now agrees are dismissed.
      {
        const pend = pendingDismissRef.current;
        const tnow = Date.now();
        for (const [pid, exp] of Array.from(pend.entries())) {
          if (exp < tnow) pend.delete(pid);
        }
        const rows = (data || []).map(row => {
          if (pend.has(row.id)) {
            if (row.dismissed) { pend.delete(row.id); return row; }
            return { ...row, dismissed: true };
          }
          return row;
        });
        setDetections(rows);
      }
      setLastFetch(new Date());
      setError(null);

      // Notification for newest detection, gated by notifMode + classification
      const cls_now = classificationsRef.current;
      if (data && data.length > 0 && notifPerm === "granted" && notifMode !== "off") {
        for (const newest of data) {
          if (newest.dismissed) continue;
          if (newest.id === lastNotifId.current) break;
          // v6.19.1: notify gating via the valve. Suppress only when the
          // whole card is muted (every named species muted); suppress a
          // suspect card unless it also names a priority bird (priority wins
          // the ping).
          if (isMuted(newest, cls_now)) continue;
          if (isSuspect(newest, cls_now) && !isPriority(newest, cls_now)) continue;
          const ageMin = (Date.now() - new Date(newest.created_at).getTime()) / 60000;
          const passesMode =
            notifMode === "all" ||
            (notifMode === "priority" && isPriority(newest, cls_now));
          if (
            ageMin < 5 &&
            passesMode &&
            (newest.confidence || 0) >= confThreshold
          ) {
            // v5.8.0: showBirdNotif uses SW route (works on Chrome Android),
            // falls back to direct constructor for older browsers.
            const _notifTitle = `🐦 ${newest.species_guess}`;
            const _notifBody = `Detected nearby · ${Math.round((newest.confidence || 0) * 100)}% confidence`;
            showBirdNotif(_notifTitle, _notifBody, "bird-detection");
            lastNotifId.current = newest.id;
            lsSet(LS.lastNotif, newest.id);
            break;
          }
        }
      }
    } catch (e) {
      setError("Network error");
    }
    setLoading(false);
  }, [notifPerm, confThreshold, notifMode]);

  useEffect(() => {
    fetchLive();
    const iv = setInterval(fetchLive, 20000);
    return () => clearInterval(iv);
  }, [fetchLive]);

  // Fetch one history bucket from Supabase. Yesterday / This week /
  // This month / Older. Only dismissed rows are pulled — non-dismissed
  // older items would mean something weird is happening (live feed
  // should keep them visible until age >= 24h, at which point they're
  // dismissed-or-not in the older buckets, but we treat the older
  // buckets as "the archive" so we include both states there).
  //
  // Actually, important: an item more than 24h old that the user never
  // dismissed should STILL appear in history (otherwise it falls into
  // a gap between live and history). So we don't filter by dismissed
  // for buckets older than Today — we include everything in the range.
  const fetchHistoryBucket = useCallback(async (bucket) => {
    setHistoryBuckets(prev => ({
      ...prev,
      [bucket]: { items: prev[bucket]?.items || [], loading: true, loaded: false, error: null },
    }));
    try {
      const { gte, lt } = historyBucketRange(bucket);
      let q = `${SUPA_URL}/rest/v1/candidate_sightings?source=eq.bird_detection`;
      if (gte) q += `&created_at=gte.${encodeURIComponent(gte)}`;
      if (lt)  q += `&created_at=lt.${encodeURIComponent(lt)}`;
      // v5.8.3: paginated fetch. Supabase caps each request at 1000 rows
      // server-side regardless of client `limit` or `Range` header, so for
      // high-volume buckets (e.g. "This week" with 3000+ rows) a single
      // request misses older rows in the range, hiding most of the data.
      // Loop fetches up to 10 pages (10000 rows max per bucket).
      q += `&order=created_at.desc`;
      const PAGE_SIZE = 1000;
      const MAX_PAGES = 10;
      const allRows = [];
      let pageError = null;
      for (let page = 0; page < MAX_PAGES; page++) {
        const from = page * PAGE_SIZE;
        const to = from + PAGE_SIZE - 1;
        const pageHeaders = { ...SUPA_HEADERS, Range: `${from}-${to}` };
        const r = await fetch(q, { headers: pageHeaders });
        if (!r.ok) {
          pageError = `HTTP ${r.status} on page ${page + 1}`;
          break;
        }
        const pageData = await r.json();
        if (!Array.isArray(pageData) || pageData.length === 0) {
          break;
        }
        allRows.push(...pageData);
        if (pageData.length < PAGE_SIZE) {
          // Last page - we got fewer rows than requested, no more data.
          break;
        }
      }
      if (pageError) {
        setHistoryBuckets(prev => ({
          ...prev,
          [bucket]: { items: [], loading: false, loaded: false, error: pageError },
        }));
        return;
      }
      setHistoryBuckets(prev => ({
        ...prev,
        [bucket]: { items: allRows, loading: false, loaded: true, error: null },
      }));
    } catch (e) {
      setHistoryBuckets(prev => ({
        ...prev,
        [bucket]: { items: [], loading: false, loaded: false, error: "Network error" },
      }));
    }
  }, []);

  // Auto-fetch buckets as the user expands them. Today doesn't need
  // its own fetch — it's derived from the live window.
  //
  // v5.8.1: when user picks a specific species in the filter, auto-expand
  // AND auto-fetch all buckets so they immediately see all data for that
  // species. Without this, the user only sees rows from buckets they had
  // manually expanded, which can hide most of the data.
  // v5.9.1: track last seen species filter so we only auto-expand
  // buckets when the filter VALUE changes, not on every state update.
  // Previous code re-expanded on every render while a filter was active,
  // which made it impossible for the user to collapse buckets.
  const lastSpeciesFilterRef = useRef(historySpeciesFilter);

  useEffect(() => {
    const speciesFilterActive = historySpeciesFilter !== "all";
    const filterChanged = historySpeciesFilter !== lastSpeciesFilterRef.current;
    lastSpeciesFilterRef.current = historySpeciesFilter;

    // Only force-expand buckets on the EDGE where the user just picked
    // a new species. Once expanded, the user is free to collapse them.
    if (speciesFilterActive && filterChanged) {
      setExpandedBuckets(prev => ({
        ...prev,
        "Yesterday": true,
        "This week": true,
        "This month": true,
        "Older": true,
      }));
    }
    for (const bucket of ["Yesterday", "This week", "This month", "Older"]) {
      const shouldFetch = speciesFilterActive || expandedBuckets[bucket];
      if (shouldFetch && !historyBuckets[bucket]?.loaded && !historyBuckets[bucket]?.loading) {
        fetchHistoryBucket(bucket);
      }
    }
  }, [expandedBuckets, historyBuckets, fetchHistoryBucket, historySpeciesFilter]);

  // Live-view list: from the 24h window, non-dismissed, passes confidence
  // + classification, passes filter.
  // Sorted: priority first, then suspect, then normal, by recency within each group.
  const liveItems = useMemo(() => {
    const items = detections.filter(d => {
      if (d.dismissed) return false;
      if ((d.confidence || 0) < confThreshold) return false;
      // v6.19.1: route hide + priority-filter through the named-species
      // valve so a card naming a wanted bird stays visible even if another
      // named species (e.g. BirdNET's guess) is muted.
      if (isMuted(d, classifications)) return false;
      if (viewFilter === "priority" && !isPriority(d, classifications)) return false;
      return true;
    });
    // v6.1: when sort is "asc" (oldest first), pure chronological - ignore
    // classification grouping so backlog can be ground through in time order.
    // Default "desc" preserves classification-grouped + newest-first ordering.
    if (liveSortDir === "asc") {
      items.sort((a, b) => new Date(a.created_at).getTime() - new Date(b.created_at).getTime());
    } else {
      // v6.19.1: rank via the valve (priority if any named species is
      // priority, else suspect if any is suspect, else normal) so grouping
      // matches the new mute/priority semantics.
      const rank = (d) => isPriority(d, classifications) ? 0
                        : (isSuspect(d, classifications) ? 1 : 2);
      items.sort((a, b) => {
        const oa = rank(a);
        const ob = rank(b);
        if (oa !== ob) return oa - ob;
        return new Date(b.created_at).getTime() - new Date(a.created_at).getTime();
      });
    }
    return items;
  }, [detections, viewFilter, confThreshold, classifications, liveSortDir]);

  // v5.9: compute "effective species" for a detection — user's correction
  // (manual_label) wins over BirdNET's guess (species_guess). Returns
  // empty string if neither is set. Used by species filter, dropdown
  // population, and total clip count display.
  const effectiveSpecies = (d) => {
    const meta = (d && d.metadata) || {};
    // v6.3: canonicalise so slug forms like "rainbow-lorikeet" collapse
    // to Title Case before being used by filter list, filter comparison,
    // and the settings classification list.
    const raw = ((meta.manual_label || "").trim() || ((d && d.species_guess) || "").trim());
    return canonicaliseSpeciesLabel(raw);
  };

  // v5.7: derive sorted unique species_guess values from currently-loaded
  // history items. Used to populate the species filter dropdown. We pull
  // from todayItems (always loaded) AND from any expanded history bucket
  // the user has fetched. Sorted alphabetically for predictable order.
  const historyAvailableSpecies = useMemo(() => {
    const seen = new Set();
    // v5.9: collect effective species (manual_label OR species_guess)
    // so corrected-into species appear in the filter dropdown even when
    // BirdNET never originally tagged anything with that label.
    // Today bucket (derived from detections in live window)
    for (const d of detections) {
      if (!d.dismissed) continue;
      const es = effectiveSpecies(d);
      if (es) seen.add(es);
    }
    // Any other loaded bucket
    for (const bucket of Object.values(historyBuckets)) {
      if (!bucket || !bucket.items) continue;
      for (const d of bucket.items) {
        const es = effectiveSpecies(d);
        if (es) seen.add(es);
      }
    }
    return [...seen].sort((a, b) => a.localeCompare(b));
  }, [detections, historyBuckets]);

  // Helper: shared filter applied to history items.
  // - Muted species are always excluded from history
  // - The historyClsFilter chips decide which of priority/suspect/normal show
  // - v5.4: historyStatusFilter narrows to a single badge state
  const filterHistoryItems = useCallback((items) => {
    return items.filter(d => {
      // v5.7: hide discarded rows. We're not building an "audit log" view
      // yet - discarded clips should disappear from History so the user
      // can see clear progress through the corpus cleanup task.
      if (d.metadata && d.metadata.discarded === true) return false;
      // v5.9: species filter uses effective species (manual_label OR
      // species_guess) so corrected-into clips show up under their
      // corrected species, not BirdNET's original guess.
      if (historySpeciesFilter !== "all") {
        if (effectiveSpecies(d) !== historySpeciesFilter) return false;
      }
      const label = birdLabel(d);
      const cls = getClassification(label, classifications);
      // v5.8.1: muted now respects the chip toggle (default OFF) so user
      // can opt into seeing muted clips for audit/quality-review.
      if (cls === "muted"    && !historyClsFilter.muted)    return false;
      if (cls === "priority" && !historyClsFilter.priority) return false;
      if (cls === "suspect"  && !historyClsFilter.suspect)  return false;
      if (cls === "normal"   && !historyClsFilter.normal)   return false;

      // v5.4: status filter. Compute badge state for this card and check
      // against the active filter. corrected wins over confirmed wins
      // over reviewed - same precedence as the badge rendering.
      if (historyStatusFilter !== "all") {
        const c = isCorrected(d);
        const cf = !c && isConfirmed(d);
        const rv = !c && !cf && isReviewed(d);
        const unaddressed = !c && !cf && !rv;
        if (historyStatusFilter === "corrected"   && !c)   return false;
        if (historyStatusFilter === "confirmed"   && !cf)  return false;
        if (historyStatusFilter === "reviewed"    && !rv)  return false;
        if (historyStatusFilter === "unaddressed" && !unaddressed) return false;
      }
      return true;
    });
  }, [classifications, historyClsFilter, historyStatusFilter, historySpeciesFilter]);

  // History "Today" bucket: items dismissed today.
  // Derived from the live window (already in memory) so dismissing a card
  // makes it appear in Today instantly with no fetch.
  //
  // We filter to dismissed-only here because today is the "actioned" view:
  // you're actively triaging in the live feed, and history is where things
  // go when you've explicitly cleared them. Yesterday and older buckets
  // include everything (dismissed or not) because at that point the
  // distinction is moot — those are the archive view.
  const todayItems = useMemo(() => {
    const { gte, lt } = historyBucketRange("Today");
    const filtered = detections.filter(d => {
      if (!d.dismissed) return false;
      const t = d.created_at;
      return t >= gte && t < lt;
    });
    return filterHistoryItems(filtered)
      .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());
  }, [detections, filterHistoryItems]);

  // Counts for each history bucket (for the header chips).
  // Today comes from local data. Others come from the bucket cache once
  // loaded (we show "—" until they've been fetched).
  const bucketCounts = useMemo(() => {
    const out = { "Today": todayItems.length };
    for (const b of ["Yesterday", "This week", "This month", "Older"]) {
      const entry = historyBuckets[b];
      if (entry?.loaded) {
        out[b] = filterHistoryItems(entry.items).length;
      } else {
        out[b] = null;  // unknown until loaded
      }
    }
    return out;
  }, [todayItems, historyBuckets, filterHistoryItems]);

  // Total count of items hidden by the current live filter (for the
  // "X hidden by current filter" notice)
  const hiddenByFilter = useMemo(() => {
    if (viewMode !== "live") return 0;
    const visibleNonDismissed = detections.filter(d => !d.dismissed).length;
    return visibleNonDismissed - liveItems.length;
  }, [detections, liveItems, viewMode]);

  // ─── v5.2: Training corpus stats ──────────────────────────────────
  // Per-species count of clips that have either a manual_label set
  // (corrections) OR confirmed=true (confirmations). These are the rows
  // the Pi promote-poll has copied into training-corpus/.
  //
  // Stored as: { total, entries: [{ label, count }], byNormalisedLabel }
  // where byNormalisedLabel is a lookup keyed on the normalised form
  // ("common-mynah" rather than "Common Mynah") so per-card lookups work
  // regardless of casing.
  //
  // Fetched directly from Supabase as a count aggregation, refreshed
  // every 60 seconds plus immediately after any Confirm or Correct
  // action so the displayed count moves with the user's interaction.
  const [corpusStats, setCorpusStats] = useState(null);

  const fetchCorpusStats = useCallback(async () => {
    // We need both manual_label values AND confirmed flags. The simplest
    // safe query is to ask Supabase for all rows where either is set,
    // returning just enough columns to bucket them. We paginate via the
    // count header in case the result is large.
    try {
      // v5.7.7: read truth-from-disk via pi_config.corpus_counts.
      // The Pi publishes its actual training-corpus folder file counts
      // every ~120s. We just slugify any incoming species name to look
      // up its count here, instead of trying to count Supabase rows
      // (which drift from Pi disk due to historical artefacts, manual
      // corrections, discards, etc).
      const url = `${SUPA_URL}/rest/v1/pi_config`
        + `?key=eq.corpus_counts`
        + `&select=value`;
      const r = await fetch(url, { headers: SUPA_HEADERS });
      if (!r.ok) {
        // Quietly fail. Settings panel just keeps "loading…".
        return;
      }
      const rows = await r.json();
      if (!rows || !rows.length || !rows[0].value) {
        // Pi hasn't published yet. Show nothing rather than stale data.
        setCorpusStats({ total: 0, entries: [], byNormalisedLabel: new Map() });
        return;
      }
      // value is {slug: count, ...}. Slug is the Pi's folder name and is
      // already in our normalised form (lowercase + dashes). Build pretty
      // label by capitalising each dash-segment.
      const piCounts = rows[0].value;
      const counts = new Map();         // pretty label → {label, count}
      const norm = new Map();           // normalised slug → count
      for (const slug of Object.keys(piCounts)) {
        const count = piCounts[slug];
        if (typeof count !== "number" || count <= 0) continue;
        const pretty = slug.split("-").map(w =>
          w ? w[0].toUpperCase() + w.slice(1) : w
        ).join(" ");
        counts.set(slug, { label: pretty, count });
        norm.set(slug, count);
      }
      const entries = [...counts.values()].sort((a, b) => b.count - a.count);
      const total = entries.reduce((s, e) => s + e.count, 0);
      setCorpusStats({ total, entries, byNormalisedLabel: norm });
    } catch (e) {
      // Network error - keep the previous stats visible. Silent.
    }
  }, []);

  // Fetch corpus stats on mount and then every 60s. The numbers don't
  // need to be real-time; they're a rough progress indicator.
  useEffect(() => {
    corpusRefreshRef.current = fetchCorpusStats;
    fetchCorpusStats();
    const iv = setInterval(fetchCorpusStats, 60000);
    return () => clearInterval(iv);
  }, [fetchCorpusStats]);

  // Helper used by DetectionCard to look up how many clips this species
  // already has in the training corpus. Returns 0 if not yet loaded or
  // unknown.
  const corpusCountFor = useCallback((d) => {
    if (!corpusStats) return null;
    // Match priority: user's manual_label (most specific), then
    // species_guess (BirdNET's guess - what we'd promote to on Confirm).
    const meta = d.metadata || {};
    // v5.7.6: consolidate species name (so Little Wattlebird lookups
    // resolve to the consolidated "wattlebird" entry) THEN normalise.
    const candidates = [
      meta.manual_label,
      d.species_guess,
    ].filter(Boolean).map(s => normaliseCorpusLabel(consolidateLabel(s)));
    for (const k of candidates) {
      if (corpusStats.byNormalisedLabel.has(k)) {
        return corpusStats.byNormalisedLabel.get(k);
      }
    }
    return 0;
  }, [corpusStats]);

  // Species summary - one row per species, used both in feed grouping and
  // in the settings classification list. Built from the live (24h) window
  // only; older species require checking the History view to find.
  const speciesByLabel = useMemo(() => {
    const m = new Map();
    for (const d of detections) {  // use unfiltered list so settings sees everything in window
      // v6.10: build the species list from the RESOLVED species, not just
      // BirdNET's raw guess. If the user corrected this clip (manual_label),
      // key + display by the canonical corrected name so correction-only
      // species (e.g. "Common Myna", which BirdNET never emits directly -
      // it guesses Satin Bowerbird / Olive-backed Oriole) actually appear
      // in Settings and can be classified/muted. Uncorrected clips keep the
      // existing birdLabel key so prior classifications are preserved.
      const md = d.metadata || {};
      // v6.10: resolve the TRUE species from the best available signal.
      // Order: species_truth (set by swap-UI tick) -> manual_label (typed
      // correction) -> confirmed (user accepted BirdNET). Canonicalise so
      // naming variants ("Common Myna" vs "common-myna") collapse to one
      // row. This surfaces species reached by TAPPING the swap UI (e.g.
      // Common Myna, which BirdNET never emits - it guesses Satin Bowerbird
      // / Olive-backed Oriole), not just typed corrections.
      const _truthRaw = d.species_truth
        || md.manual_label
        || (md.confirmed === true ? d.species_guess : null);
      const corrected = _truthRaw ? canonicaliseSpeciesLabel(_truthRaw) : null;
      // v6.12: canonicaliseSpeciesLabel on the fallback path too so that
      // un-voted clips (which take birdLabel(d) = raw Title Case) collapse
      // with voted clips (which take corrected = slug) under one key.
      // Fixes Settings duplicate rows like 'Common Myna 70' + 'Common Myna 2'.
      // v6.13: use species_guess (not birdLabel) for key generation so the
      // 'Common Myna_Acridotheres tristis' style suffix never enters the key.
      // Display path already uses canonicaliseSpeciesLabel(d.species_guess).
      // birdLabel(d) is kept as a last-resort fallback for edge cases.
      const _canonGuess = canonicaliseSpeciesLabel(d.species_guess);
      const label = corrected || _canonGuess || canonicaliseSpeciesLabel(birdLabel(d));
      const displayCommon = corrected || canonicaliseSpeciesLabel(d.species_guess);
      const e = m.get(label) || {
        label, common: displayCommon, count: 0, latestTs: null, maxConf: 0,
        scientific: corrected ? null : (md.scientific_name || null),
      };
      e.count += 1;
      const ts = new Date(d.created_at).getTime();
      if (e.latestTs === null || ts > e.latestTs) e.latestTs = ts;
      e.maxConf = Math.max(e.maxConf, d.confidence || 0);
      m.set(label, e);
    }
    // v6.17: ALSO include species with any non-default classification
    // (muted/priority/suspect) even if not detected in the live window.
    // Without this, muting a species "traps" it - it disappears from
    // the Settings list because it no longer appears in the feed,
    // leaving no UI to unmute. Uses the actual classifications key as
    // label so the click handler mutates the right entry. Legacy keys
    // ("Common Name_Scientific") and canonical keys ("Common Name") are
    // both handled. count=0 + latestTs=0 so they sort to the bottom.
    for (const [clsKey, clsState] of Object.entries(classifications || {})) {
      if (clsState === "normal") continue;
      const ck = classificationKey(clsKey);   // v6.19: fold to canonical
      if (m.has(ck)) continue;                 // detection row already exists
      const parts = String(clsKey).split("_");
      m.set(ck, {
        label: ck,
        common: canonicaliseSpeciesLabel(parts[0]) || ck,
        scientific: parts[1] || null,
        count: 0,
        latestTs: 0,
        maxConf: 0,
      });
    }
    // Add lastSeen as ISO string for easy display, sorted by recency
    return [...m.values()]
      .map(e => ({ ...e, lastSeen: e.latestTs ? new Date(e.latestTs).toISOString() : null }))
      .sort((a, b) => b.latestTs - a.latestTs);
  }, [detections, classifications]);

  // v5.4.2: deduped label suggestions for the manual_label input autocomplete.
  // Combines two sources:
  //   1. Prior manual_label values (your typed corrections from history)
  //   2. BirdNET species_guess values (every species name BirdNET has used)
  // Sources are merged and ranked by FREQUENCY of use across all loaded
  // detections, so common labels surface first. Includes both live (24h)
  // detections and any history buckets the user has loaded.
  const labelSuggestions = useMemo(() => {
    const counts = new Map();
    function bump(s) {
      if (!s) return;
      // v6.2: canonicalise slug forms to Title Case BEFORE counting so
      // "rainbow-lorikeet" and "Rainbow Lorikeet" collapse to one entry.
      const trimmed = canonicaliseSpeciesLabel(s);
      if (!trimmed) return;
      counts.set(trimmed, (counts.get(trimmed) || 0) + 1);
    }
    // Live detections
    for (const d of detections) {
      bump(d.species_guess);
      bump((d.metadata || {}).manual_label);
    }
    // History buckets - whatever's loaded
    for (const bucket of Object.values(historyBuckets)) {
      if (!bucket || !bucket.items) continue;
      for (const d of bucket.items) {
        bump(d.species_guess);
        bump((d.metadata || {}).manual_label);
      }
    }
    return [...counts.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([label]) => label);
  }, [detections, historyBuckets]);

  // Dismiss / un-dismiss a detection. Optimistically updates local state
  // so the UI is instant, then PATCHes Supabase. If the PATCH fails we
  // roll back.
  const setDismissed = useCallback(async (id, dismissed) => {
    // Optimistic update
    setDetections(prev => prev.map(d => d.id === id ? { ...d, dismissed } : d));
    // reappear-fix: protect an optimistic dismiss from poll clobber.
    if (dismissed) pendingDismissRef.current.set(id, Date.now() + 90000);
    else pendingDismissRef.current.delete(id);
    try {
      const r = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}`,
        {
          method: "PATCH",
          headers: { ...SUPA_HEADERS, "Prefer": "return=minimal" },
          body: JSON.stringify({ dismissed }),
        }
      );
      if (!r.ok) {
        // Roll back on failure
        pendingDismissRef.current.delete(id);
        setDetections(prev => prev.map(d => d.id === id ? { ...d, dismissed: !dismissed } : d));
        setError(`Couldn't ${dismissed ? "clear" : "restore"} (${r.status})`);
        setTimeout(() => setError(null), 3000);
      }
    } catch (e) {
      pendingDismissRef.current.delete(id);
      setDetections(prev => prev.map(d => d.id === id ? { ...d, dismissed: !dismissed } : d));
      setError("Network error");
      setTimeout(() => setError(null), 3000);
    }
  }, []);

  // v4: write a manual label to a detection's metadata. The Pi polls
  // Supabase periodically and copies labelled clips into the training
  // corpus locally - we don't make a cross-origin HTTPS→HTTP fetch from
  // the browser (modern browsers block that as mixed content).
  // Optimistically updates local state; rolls back on Supabase failure.
  // v5.2: saving a correction now also auto-dismisses so the card moves
  // to history in one action rather than requiring a second tap on X.
  const setManualLabel = useCallback(async (id, manualLabel, clipFilename) => {
    if (!manualLabel) return;
    // v6.2: canonicalise BEFORE writing to DB. If user picked a slug-form
    // suggestion (legacy contamination), force Title Case here so we
    // never propagate "rainbow-lorikeet" style values forward.
    // v6.11: use canonicaliseForWrite to preserve sub-species ("Little Raven"
    // stays "Little Raven", "Red Wattlebird" stays "Red Wattlebird") so future
    // sub-species class splits have ground truth. Matches setSwapVerdict policy.
    const labelTrim = canonicaliseForWrite(manualLabel);

    // Optimistic update of local detection - label AND dismissed in one go
    let prevMeta = null;
    let prevDismissed = null;
    setDetections(prev => prev.map(d => {
      if (d.id !== id) return d;
      prevMeta = d.metadata;
      prevDismissed = d.dismissed;
      const optMeta = { ...(d.metadata || {}), manual_label: labelTrim };
      // v5.3: if this card was previously confirmed, clear that flag so
      // the badge updates from blue (confirmed) to green (corrected).
      delete optMeta.confirmed;
      return {
        ...d,
        metadata: optMeta,
        dismissed: true,
      };
    }));
    // reappear-fix
    pendingDismissRef.current.set(id, Date.now() + 90000);

    // PATCH the Supabase row's metadata + dismissed. We fetch the existing
    // metadata first to merge into the jsonb without clobbering other keys.
    try {
      const current = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}&select=metadata`,
        { headers: SUPA_HEADERS }
      );
      const rows = await current.json();
      const fullMeta = (rows && rows[0] && rows[0].metadata) || {};
      // v5.3: writing a correction overrides any prior confirmation.
      // We remove the confirmed flag AND the v5.2 corpus-done sentinel
      // so the Pi's promote-poll will re-process this row and copy the
      // WAV to the corrected-species folder. Note: the WAV may already
      // exist in the original species folder from a prior confirm; that
      // stale copy stays there until a future corpus cleanup pass. TODO.
      const newMeta = { ...fullMeta, manual_label: labelTrim };
      delete newMeta.confirmed;
      delete newMeta._v5_2_corpus_done;
      const r = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}`,
        {
          method: "PATCH",
          headers: { ...SUPA_HEADERS, "Prefer": "return=minimal" },
          body: JSON.stringify({ metadata: newMeta, dismissed: true }),
        }
      );
      if (!r.ok) throw new Error(`Supabase PATCH ${r.status}`);
      // v5.2: nudge a corpus stats refresh shortly after, so the per-card
      // and Settings stat counts move quickly after the user acts.
      setTimeout(() => { try { corpusRefreshRef.current?.(); } catch {} }, 1500);
    } catch (e) {
      // Roll back both fields
      pendingDismissRef.current.delete(id);
      setDetections(prev => prev.map(d => d.id === id
        ? { ...d, metadata: prevMeta, dismissed: prevDismissed } : d));
      setError("Couldn't save label");
      setTimeout(() => setError(null), 3000);
      return;
    }
  }, []);

  // v5.7: discard a clip. Sets metadata.discarded=true + discarded_at.
  // The Pi's discard-poll picks this up on next tick (within 2 min) and
  // moves the WAV from training-corpus/<slug>/ to _quarantine/<slug>/.
  // This is reversible - clearing metadata.discarded would let the v4
  // promote flow re-promote the clip on next poll (assuming the WAV is
  // restored from quarantine first). The web app does not currently
  // expose an undiscard button - that's tomorrow's work.
  const setDiscarded = useCallback(async (id) => {
    let prevMeta = null;
    const nowIso = new Date().toISOString();
    const mutateRow = (d) => {
      if (d.id !== id) return d;
      if (prevMeta === null) prevMeta = d.metadata;
      return {
        ...d,
        metadata: {
          ...(d.metadata || {}),
          discarded: true,
          discarded_at: nowIso,
        },
      };
    };
    setDetections(prev => prev.map(mutateRow));
    setHistoryBuckets(prev => {
      const next = {};
      for (const [bucket, entry] of Object.entries(prev)) {
        if (!entry || !entry.items) { next[bucket] = entry; continue; }
        next[bucket] = { ...entry, items: entry.items.map(mutateRow) };
      }
      return next;
    });

    // PATCH Supabase. Fetch existing metadata first to merge cleanly.
    try {
      const current = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}&select=metadata`,
        { headers: SUPA_HEADERS }
      );
      const rows = await current.json();
      const fullMeta = (rows && rows[0] && rows[0].metadata) || {};
      const newMeta = {
        ...fullMeta,
        discarded: true,
        discarded_at: new Date().toISOString(),
      };
      const r = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}`,
        {
          method: "PATCH",
          headers: { ...SUPA_HEADERS, "Prefer": "return=minimal" },
          body: JSON.stringify({ metadata: newMeta }),
        }
      );
      if (!r.ok) throw new Error(`Supabase PATCH ${r.status}`);
      setTimeout(() => { try { corpusRefreshRef.current?.(); } catch {} }, 1500);
    } catch (e) {
      const restoreRow = (d) => (d.id === id ? { ...d, metadata: prevMeta } : d);
      setDetections(prev => prev.map(restoreRow));
      setHistoryBuckets(prev => {
        const next = {};
        for (const [bucket, entry] of Object.entries(prev)) {
          if (!entry || !entry.items) { next[bucket] = entry; continue; }
          next[bucket] = { ...entry, items: entry.items.map(restoreRow) };
        }
        return next;
      });
      setError("Couldn't discard clip");
      setTimeout(() => setError(null), 3000);
      return;
    }
  }, []);

  // v5.2: confirm that BirdNET's guess was right.
  // Writes metadata.confirmed=true AND dismissed=true in one PATCH so the
  // card moves to history immediately. The Pi promote-poll thread treats
  // confirmed=true rows the same way as manual_label rows: copy the WAV
  // into training-corpus/<species_guess>/ (normalised). This builds the
  // "positive confirmations" half of the BoundaryBirds training data,
  // complementing the corrections half.
  // v6: setSwapVerdict - the new commit handler used by the 2-prediction
  // swap UI on Live cards. Writes the new schema columns (verdict,
  // verdict_source, species_truth, add_to_corpus) AND mirrors the existing
  // metadata writes so badges and Pi-side auto-relabel still work.
  // args = { verdict, speciesTruth, addToCorpus, source }
  //   verdict: "birdnet" | "boundarybirds" | "neither"
  //   speciesTruth: the final species string (display form, e.g. "Common Myna")
  //   addToCorpus: true (tick) or false (cross)
  //   source: same as verdict, kept for clarity in call sites
  const setSwapVerdict = useCallback(async (id, args) => {
    // v6.14: bbAlsoCorrect flag for "Both correct" multi-bird votes
    const { verdict, speciesTruth: _rawTruth, addToCorpus, source, bbAlsoCorrect } = args;
    // v6.11: canonicalise on write so DB stops accumulating slug/Title variants.
    // Preserves sub-species (Little Raven, Red Wattlebird) so future splits work.
    const speciesTruth = canonicaliseForWrite(_rawTruth);
    let prevMeta = null;
    let prevDismissed = null;
    // Optimistic local update. For tick (addToCorpus=true):
    //   - verdict='birdnet'      -> set metadata.confirmed=true (blue badge)
    //   - verdict='boundarybirds' or 'neither' -> set metadata.manual_label
    // For cross (addToCorpus=false): just dismiss, no badge.
    setDetections(prev => prev.map(d => {
      if (d.id !== id) return d;
      prevMeta = d.metadata;
      prevDismissed = d.dismissed;
      const optMeta = { ...(d.metadata || {}) };
      if (addToCorpus) {
        if (verdict === "birdnet") {
          optMeta.confirmed = true;
          delete optMeta.manual_label;
        } else {
          optMeta.manual_label = speciesTruth;
          delete optMeta.confirmed;
        }
      }
      return { ...d, metadata: optMeta, dismissed: true };
    }));
    // reappear-fix
    pendingDismissRef.current.set(id, Date.now() + 90000);

    try {
      // Fetch current metadata to merge without clobber
      const current = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}&select=metadata`,
        { headers: SUPA_HEADERS }
      );
      const rows = await current.json();
      const fullMeta = (rows && rows[0] && rows[0].metadata) || {};
      const newMeta = { ...fullMeta };
      if (addToCorpus) {
        if (verdict === "birdnet") {
          newMeta.confirmed = true;
          delete newMeta.manual_label;
          delete newMeta._v5_2_corpus_done;
        } else {
          newMeta.manual_label = speciesTruth;
          delete newMeta.confirmed;
          delete newMeta._v5_2_corpus_done;
        }
      }
      // PATCH body: new top-level columns + merged metadata + dismissed
      // v6.14: include bb_also_correct only when explicitly true
      const body = {
        verdict,
        verdict_source: "user",
        species_truth: speciesTruth,
        add_to_corpus: addToCorpus,
        metadata: newMeta,
        dismissed: true,
      };
      if (bbAlsoCorrect === true) {
        body.bb_also_correct = true;
      }
      const r = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}`,
        {
          method: "PATCH",
          headers: { ...SUPA_HEADERS, "Prefer": "return=minimal" },
          body: JSON.stringify(body),
        }
      );
      if (!r.ok) throw new Error(`Supabase PATCH ${r.status}`);
      // Trigger corpus count refresh if a clip was added
      if (addToCorpus) {
        setTimeout(() => { try { corpusRefreshRef.current?.(); } catch {} }, 1500);
      }
    } catch (e) {
      pendingDismissRef.current.delete(id);
      setDetections(prev => prev.map(d => d.id === id
        ? { ...d, metadata: prevMeta, dismissed: prevDismissed } : d));
      setError("Couldn't save verdict");
      setTimeout(() => setError(null), 3000);
    }
  }, []);

  const setConfirmed = useCallback(async (id) => {
    let prevMeta = null;
    let prevDismissed = null;
    setDetections(prev => prev.map(d => {
      if (d.id !== id) return d;
      prevMeta = d.metadata;
      prevDismissed = d.dismissed;
      return {
        ...d,
        metadata: { ...(d.metadata || {}), confirmed: true },
        dismissed: true,
      };
    }));
    // reappear-fix
    pendingDismissRef.current.set(id, Date.now() + 90000);

    try {
      const current = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}&select=metadata`,
        { headers: SUPA_HEADERS }
      );
      const rows = await current.json();
      const fullMeta = (rows && rows[0] && rows[0].metadata) || {};
      const newMeta = { ...fullMeta, confirmed: true };
      const r = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}`,
        {
          method: "PATCH",
          headers: { ...SUPA_HEADERS, "Prefer": "return=minimal" },
          body: JSON.stringify({ metadata: newMeta, dismissed: true, add_to_corpus: true }),
        }
      );
      if (!r.ok) throw new Error(`Supabase PATCH ${r.status}`);
      setTimeout(() => { try { corpusRefreshRef.current?.(); } catch {} }, 1500);
    } catch (e) {
      pendingDismissRef.current.delete(id);
      setDetections(prev => prev.map(d => d.id === id
        ? { ...d, metadata: prevMeta, dismissed: prevDismissed } : d));
      setError("Couldn't confirm");
      setTimeout(() => setError(null), 3000);
    }
  }, []);

  // v5.4: mark a card as reviewed without confirming or correcting.
  // Sets metadata.reviewed_at to current timestamp. The card stays in
  // history but gets a grey badge and drops out of the Unaddressed
  // history filter. Does NOT contribute to the training corpus (no Pi
  // action wired to reviewed_at) - this is a "skip" state.
  //
  // Unlike confirm/correct, this is NOT recorded as having opinion about
  // the species. It just records that the user has seen the card.
  const setReviewed = useCallback(async (id) => {
    const nowIso = new Date().toISOString();
    let prevMeta = null;
    setDetections(prev => prev.map(d => {
      if (d.id !== id) return d;
      prevMeta = d.metadata;
      return {
        ...d,
        metadata: { ...(d.metadata || {}), reviewed_at: nowIso },
      };
    }));

    try {
      const current = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}&select=metadata`,
        { headers: SUPA_HEADERS }
      );
      const rows = await current.json();
      const fullMeta = (rows && rows[0] && rows[0].metadata) || {};
      const newMeta = { ...fullMeta, reviewed_at: nowIso };
      const r = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}`,
        {
          method: "PATCH",
          headers: { ...SUPA_HEADERS, "Prefer": "return=minimal" },
          body: JSON.stringify({ metadata: newMeta }),
        }
      );
      if (!r.ok) throw new Error(`Supabase PATCH ${r.status}`);
    } catch (e) {
      setDetections(prev => prev.map(d => d.id === id
        ? { ...d, metadata: prevMeta } : d));
      setError("Couldn't mark reviewed");
      setTimeout(() => setError(null), 3000);
    }
  }, []);

  async function requestNotif() {
    if (typeof Notification === "undefined") { setNotifPerm("unsupported"); return; }
    const p = await Notification.requestPermission();
    setNotifPerm(p);
  }

  return (
    <>
      {/* Header */}
      <header style={{
        position: "sticky", top: 0, zIndex: 100,
        background: "rgba(247, 245, 240, 0.92)",
        backdropFilter: "blur(8px)", WebkitBackdropFilter: "blur(8px)",
        borderBottom: "1px solid var(--border)",
        padding: "calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px",
      }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
            <div style={{
              width: 36, height: 36, borderRadius: 10,
              background: "var(--primary)", color: "#fff",
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 20, flexShrink: 0,
            }}>🐦</div>
            <div style={{ minWidth: 0 }}>
              <h1 style={{ fontSize: 17, fontWeight: 700, color: "var(--text)",
                  whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                Bird Call Alert
              </h1>
              <div style={{ fontSize: 11, color: "var(--text-2)", display: "flex",
                  alignItems: "center", gap: 5, marginTop: 1 }}>
                {error ? (
                  <>
                    <div style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--danger)" }}/>
                    <span>{error}</span>
                  </>
                ) : loading ? (
                  <span>Loading…</span>
                ) : (
                  <>
                    <div className="live-dot" style={{
                      width: 6, height: 6, borderRadius: "50%", background: "var(--success)" }}/>
                    <span>Live · {fmtAgeShort(lastFetch)} ago</span>
                  </>
                )}
              </div>
            </div>
          </div>
          <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
            <button onClick={fetchLive} aria-label="Refresh"
              style={{
                width: 40, height: 40, borderRadius: "50%", border: "none",
                background: "var(--surface)", color: "var(--text-2)",
                fontSize: 18, cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                border: "1px solid var(--border)",
              }}>↻</button>
            <button
              onClick={() => setViewMode(viewMode === "history" ? "live" : "history")}
              aria-label={viewMode === "history" ? "Back to live feed" : "Open history"}
              title={viewMode === "history" ? "Back to live" : "History"}
              style={{
                width: 40, height: 40, borderRadius: "50%", border: "none",
                background: viewMode === "history" ? "var(--primary)" : "var(--surface)",
                color: viewMode === "history" ? "#fff" : "var(--text-2)",
                fontSize: 18, cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                border: "1px solid " + (viewMode === "history" ? "var(--primary)" : "var(--border)"),
              }}>{viewMode === "history" ? "←" : "🗂"}</button>
            {/* v6.8: Corpus sheet trigger */}
            <button onClick={() => setCorpusOpen(true)} aria-label="Training corpus"
              title="Training corpus"
              style={{
                width: 40, height: 40, borderRadius: "50%", border: "none",
                background: "var(--surface)", color: "var(--text-2)",
                fontSize: 18, cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                border: "1px solid var(--border)",
              }}>📊</button>
            <button onClick={() => setSettingsOpen(true)} aria-label="Settings"
              style={{
                width: 40, height: 40, borderRadius: "50%", border: "none",
                background: "var(--surface)", color: "var(--text-2)",
                fontSize: 18, cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                border: "1px solid var(--border)",
              }}>⚙</button>
          </div>
        </div>

        {/* Status chip - reflects current filter / view */}
        {viewMode === "live" && (() => {
          const mutedCount = Object.values(classifications).filter(c => c === "muted").length;
          const suspectCount = Object.values(classifications).filter(c => c === "suspect").length;
          const show = viewFilter !== "all" || mutedCount > 0 || suspectCount > 0
            || confThreshold > 0.4 || notifMode !== "priority";
          if (!show) return null;
          return (
          <button onClick={() => setSettingsOpen(true)} style={{
            display: "inline-flex", alignItems: "center", gap: 6, marginTop: 10,
            padding: "5px 11px", background: "var(--surface)",
            border: "1px solid var(--border)", borderRadius: 999,
            fontSize: 12, color: "var(--text-2)", cursor: "pointer",
          }}>
            <span>{VIEW_FILTERS[viewFilter]?.icon} {VIEW_FILTERS[viewFilter]?.label}</span>
            {confThreshold > 0.4 && <span>· {Math.round(confThreshold * 100)}%+</span>}
            {mutedCount > 0 && <span>· {mutedCount} 🔇</span>}
            {suspectCount > 0 && <span>· {suspectCount} ⚠️</span>}
            {notifMode !== "priority" && <span>· notif: {notifMode}</span>}
            <span style={{ color: "var(--text-3)", marginLeft: 2 }}>edit</span>
          </button>
          );
        })()}
        {viewMode === "history" && (
          <div style={{
            display: "inline-flex", alignItems: "center", gap: 6, marginTop: 10,
            padding: "5px 11px", background: "var(--surface-2)",
            border: "1px solid var(--border)", borderRadius: 999,
            fontSize: 12, color: "var(--text-2)",
          }}>
            <span>🗂 Cleared detections</span>
          </div>
        )}
      </header>

      {/* Live feed or History view */}
      <main style={{ padding: "8px 14px 80px", maxWidth: 600, margin: "0 auto" }}>

        {/* ─── LIVE VIEW ─────────────────────────────────────────────── */}
        {viewMode === "live" && (
          <>
            {/* Empty state - no detections in the live 24h window */}
            {!loading && detections.length === 0 && !error && (
              <div style={{
                textAlign: "center", padding: "60px 20px",
                color: "var(--text-2)",
              }}>
                <div style={{ fontSize: 56, marginBottom: 16, opacity: 0.4 }}>🎤</div>
                <h2 style={{ fontSize: 18, fontWeight: 600, color: "var(--text)", marginBottom: 8 }}>
                  Listening for birds
                </h2>
                <p style={{ fontSize: 14, lineHeight: 1.5, maxWidth: 320, margin: "0 auto" }}>
                  Nothing detected in the last 24 hours. New detections appear here;
                  older ones live in History.
                </p>
                <button onClick={() => setViewMode("history")} style={{
                  marginTop: 16, padding: "8px 14px",
                  background: "transparent", color: "var(--primary)",
                  border: "1px solid var(--border)", borderRadius: "var(--r-md)",
                  fontSize: 13, fontWeight: 600, cursor: "pointer",
                }}>Open History</button>
              </div>
            )}

            {/* Filtered-out notice */}
            {!loading && detections.length > 0 && liveItems.length === 0 && (
              <div style={{
                textAlign: "center", padding: "40px 20px", color: "var(--text-2)",
              }}>
                <div style={{ fontSize: 36, marginBottom: 12, opacity: 0.4 }}>🔍</div>
                <p style={{ fontSize: 15, marginBottom: 16 }}>
                  {hiddenByFilter > 0
                    ? `${hiddenByFilter} detection${hiddenByFilter === 1 ? "" : "s"} hidden by current filter.`
                    : "Nothing to show. New detections will appear here."}
                </p>
                {hiddenByFilter > 0 && (
                  <button onClick={() => setSettingsOpen(true)} style={{
                    padding: "10px 16px", background: "var(--primary)", color: "#fff",
                    border: "none", borderRadius: "var(--r-md)", fontSize: 14,
                    fontWeight: 600, cursor: "pointer",
                  }}>Adjust filter</button>
                )}
              </div>
            )}

            {/* v5.4.3: Alert count header, centered above the first tile.
                Updates live as user actions cards (since liveItems is reactive). */}
            {liveItems.length > 0 && (
              <div style={{
                textAlign: "center",
                padding: "12px 0 4px",
                fontSize: 13,
                fontWeight: 600,
                color: "var(--text-2)",
                letterSpacing: 0.3,
              }}>
                {liveItems.length > 50
                  ? `Showing 50 of ${liveItems.length} alerts`
                  : `${liveItems.length} alert${liveItems.length === 1 ? "" : "s"}`}
                {" "}
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    setLiveSortDir(liveSortDir === "desc" ? "asc" : "desc");
                  }}
                  title={liveSortDir === "desc" ? "Switch to oldest first" : "Switch to newest first"}
                  style={{
                    marginLeft: 8, padding: "2px 8px", fontSize: 11,
                    background: "var(--surface-2)",
                    border: "1px solid var(--border)",
                    borderRadius: 999,
                    color: "var(--text-2)",
                    cursor: "pointer",
                    fontFamily: "inherit",
                  }}
                >
                  {liveSortDir === "desc" ? "Newest ↓" : "Oldest ↑"}
                </button>
              </div>
            )}

            {/* Detection list */}
            {liveItems.length > 0 && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 8 }}>
                {liveItems.slice(0, 50).map(d => (
                  <DetectionCard
                    key={d.id} d={d}
                    expanded={expandedId === d.id}
                    onToggle={() => setExpandedId(expandedId === d.id ? null : d.id)}
                    onDismiss={() => setDismissed(d.id, true)}
                    onConfirm={setConfirmed}
                    onSetSwapVerdict={setSwapVerdict}
                    mode="live"
                    classification={getClassification(birdLabel(d), classifications)}
                    onSetClassification={(label, state) => {
                      setClassifications(prev => ({ ...prev, [classificationKey(label)]: state }));
                    }}
                    onSetManualLabel={setManualLabel}
                    corpusCount={corpusCountFor(d)}
                    labelSuggestions={labelSuggestions}
                  />
                ))}
                {liveItems.length > 50 && (
                  <div style={{ textAlign: "center", padding: 12,
                      fontSize: 12, color: "var(--text-3)" }}>
                    Showing latest 50 of {liveItems.length}
                  </div>
                )}
              </div>
            )}
          </>
        )}

        {/* ─── HISTORY VIEW ──────────────────────────────────────────── */}
        {viewMode === "history" && (
          <>
            {/* Classification filter chips. Toggle which states are shown
                across all buckets. Muted is excluded by design. */}
            <div style={{
              display: "flex", gap: 6, marginTop: 8, marginBottom: 8,
              flexWrap: "wrap",
            }}>
              <span style={{
                alignSelf: "center", fontSize: 11, color: "var(--text-3)",
                fontWeight: 600, letterSpacing: 0.5, textTransform: "uppercase",
                marginRight: 4,
              }}>Show</span>
              {[
                { key: "priority", icon: "⭐", label: "Priority", color: "var(--accent)" },
                { key: "suspect",  icon: "⚠️", label: "Suspect",  color: "#ca8a04" },
                { key: "normal",   icon: "○",  label: "Normal",   color: "var(--text-2)" },
                { key: "muted",    icon: "🔇", label: "Muted",    color: "#6b7280" },
              ].map(c => {
                const active = historyClsFilter[c.key];
                return (
                  <button key={c.key}
                    onClick={() => setHistoryClsFilter(prev => ({
                      ...prev, [c.key]: !prev[c.key]
                    }))}
                    style={{
                      display: "inline-flex", alignItems: "center", gap: 5,
                      padding: "5px 11px", borderRadius: 999,
                      background: active ? c.color : "var(--surface)",
                      color: active ? "#fff" : "var(--text-2)",
                      border: "1px solid " + (active ? c.color : "var(--border)"),
                      fontSize: 12, fontWeight: 600, cursor: "pointer",
                      opacity: active ? 1 : 0.7,
                    }}>
                    <span>{c.icon}</span>
                    <span>{c.label}</span>
                  </button>
                );
              })}
            </div>

            {/* v5.4: Status filter chips. Single-select: shows only cards in
                the chosen badge state. "All" returns to showing everything. */}
            <div style={{
              display: "flex", gap: 6, marginTop: 4, marginBottom: 8,
              flexWrap: "wrap",
            }}>
              <span style={{
                alignSelf: "center", fontSize: 11, color: "var(--text-3)",
                fontWeight: 600, letterSpacing: 0.5, textTransform: "uppercase",
                marginRight: 4,
              }}>Status</span>
              {[
                { key: "all",         label: "All",         color: "var(--primary)" },
                { key: "unaddressed", label: "Unaddressed", color: "var(--text-2)" },
                { key: "corpus",      label: "Corpus",      color: "var(--success)" },
                { key: "reviewed",    label: "Reviewed",    color: "var(--text-3)" },
              ].map(s => {
                const active = historyStatusFilter === s.key;
                return (
                  <button key={s.key}
                    onClick={() => setHistoryStatusFilter(s.key)}
                    style={{
                      display: "inline-flex", alignItems: "center", gap: 5,
                      padding: "5px 11px", borderRadius: 999,
                      background: active ? s.color : "var(--surface)",
                      color: active ? "#fff" : "var(--text-2)",
                      border: "1px solid " + (active ? s.color : "var(--border)"),
                      fontSize: 12, fontWeight: 600, cursor: "pointer",
                      opacity: active ? 1 : 0.7,
                    }}>
                    <span>{s.label}</span>
                  </button>
                );
              })}
            </div>

            {/* v5.7: Species filter dropdown. Source: currently-loaded
                history items. "All species" returns to showing everything. */}
            <div style={{
              display: "flex", gap: 6, marginTop: 0, marginBottom: 8,
              alignItems: "center",
            }}>
              <span style={{
                fontSize: 11, color: "var(--text-3)",
                fontWeight: 600, letterSpacing: 0.5, textTransform: "uppercase",
                marginRight: 4,
              }}>Species</span>
              <select
                value={historySpeciesFilter}
                onChange={e => setHistorySpeciesFilter(e.target.value)}
                style={{
                  flex: 1, padding: "5px 10px",
                  borderRadius: 999,
                  background: historySpeciesFilter !== "all" ? "var(--primary)" : "var(--surface)",
                  color: historySpeciesFilter !== "all" ? "#fff" : "var(--text-2)",
                  border: "1px solid " + (historySpeciesFilter !== "all" ? "var(--primary)" : "var(--border)"),
                  fontSize: 12, fontWeight: 600, cursor: "pointer",
                  fontFamily: "inherit",
                  appearance: "none",
                  WebkitAppearance: "none",
                }}
              >
                <option value="all">All species</option>
                {historyAvailableSpecies.map(s => (
                  <option key={s} value={s}>{s}</option>
                ))}
              </select>
            </div>

            {/* v5.9: total clip count for the active species filter.
                Counts effective-species matches across all loaded
                buckets (today + any expanded older buckets). Shows
                under the dropdown so user knows at a glance how many
                clips exist for the current filter. */}
            {historySpeciesFilter !== "all" && historyStatusFilter !== "corpus" && (() => {
              let n = 0;
              const matches = (d) => {
                if (d.metadata && d.metadata.discarded === true) return false;
                return effectiveSpecies(d) === historySpeciesFilter;
              };
              for (const d of detections) if (matches(d)) n++;
              for (const b of Object.values(historyBuckets)) {
                if (!b || !b.items) continue;
                for (const d of b.items) if (matches(d)) n++;
              }
              return (
                <div style={{
                  margin: "4px 0 0 0",
                  padding: "10px 14px",
                  background: "var(--surface)",
                  border: "1px solid var(--border)",
                  borderRadius: "var(--r-md)",
                  fontSize: 13,
                  color: "var(--text-1)",
                  display: "flex",
                  alignItems: "baseline",
                  gap: 8,
                }}>
                  <strong style={{ fontSize: 14 }}>{historySpeciesFilter}</strong>
                  <span style={{ color: "var(--text-2)", fontSize: 12 }}>
                    {n} clip{n === 1 ? "" : "s"} loaded
                  </span>
                </div>
              );
            })()}

            {historyStatusFilter === "corpus" && (historySpeciesFilter === "all" ? (
              <div style={{ padding: "16px 6px", fontSize: 13, color: "var(--text-3)", textAlign: "center" }}>
                Pick a species above to see its corpus clips.
              </div>
            ) : (
              <HistoryCorpusList species={historySpeciesFilter.toLowerCase().replace(/\s+/g, "-")} label={historySpeciesFilter} />
            ))}
            {/* Bucket sections. Each renders as a collapsible header
                showing the count, then (when expanded) the cards. */}
            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 4 }}>
              {(historyStatusFilter === "corpus" ? [] : HISTORY_BUCKET_ORDER).map(bucket => {
                const isToday = bucket === "Today";
                const expanded = !!expandedBuckets[bucket];
                const entry = historyBuckets[bucket];
                const loading = !isToday && entry?.loading;
                const loadError = !isToday && entry?.error;
                const rawItems = isToday
                  ? todayItems
                  : (entry?.loaded ? filterHistoryItems(entry.items) : []);
                // Re-sort just to be safe (filter preserves order, but
                // we want guarantees)
                const items = rawItems.slice().sort(
                  (a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime()
                );
                const count = bucketCounts[bucket];

                return (
                  <section key={bucket} style={{
                    border: "1px solid var(--border)",
                    borderRadius: "var(--r-md)",
                    background: "var(--surface)",
                    overflow: "hidden",
                  }}>
                    <button
                      onClick={() => setExpandedBuckets(prev => ({
                        ...prev, [bucket]: !prev[bucket]
                      }))}
                      style={{
                        width: "100%", display: "flex",
                        alignItems: "center", gap: 8,
                        padding: "12px 14px",
                        background: "transparent",
                        border: "none", cursor: "pointer", textAlign: "left",
                      }}>
                      <span style={{
                        display: "inline-block", width: 14, fontSize: 11,
                        color: "var(--text-2)",
                        transform: expanded ? "rotate(90deg)" : "rotate(0deg)",
                        transition: "transform 0.15s ease",
                      }}>▶</span>
                      <span style={{
                        fontSize: 13, fontWeight: 700, color: "var(--text)",
                        letterSpacing: 0.3,
                      }}>{bucket}</span>
                      <span style={{
                        fontSize: 12, color: "var(--text-3)", marginLeft: "auto",
                      }}>
                        {loading
                          ? "loading…"
                          : loadError
                            ? `error: ${loadError}`
                            : count === null
                              ? (expanded ? "" : "tap to load")
                              : `${count}`
                        }
                      </span>
                    </button>
                    {expanded && (
                      <div style={{
                        padding: "0 10px 12px",
                        borderTop: "1px solid var(--border)",
                      }}>
                        {loading && (
                          <div style={{
                            padding: "20px 6px", fontSize: 13,
                            color: "var(--text-3)", textAlign: "center",
                          }}>Loading…</div>
                        )}
                        {!loading && loadError && (
                          <div style={{
                            padding: "16px 6px", fontSize: 13,
                            color: "var(--danger)", textAlign: "center",
                          }}>
                            {loadError}.{" "}
                            <button
                              onClick={() => fetchHistoryBucket(bucket)}
                              style={{
                                background: "transparent", border: "none",
                                color: "var(--primary)", cursor: "pointer",
                                textDecoration: "underline", fontSize: 13,
                              }}
                            >Try again</button>
                          </div>
                        )}
                        {!loading && !loadError && items.length === 0 && (
                          <div style={{
                            padding: "16px 6px", fontSize: 13,
                            color: "var(--text-3)", textAlign: "center",
                          }}>
                            {isToday
                              ? "Nothing dismissed today yet. Tap the × on a live card to file it here."
                              : entry?.loaded
                                ? "Nothing in this bucket."
                                : "Not loaded yet."}
                          </div>
                        )}
                        {!loading && !loadError && items.length > 0 && (
                          <div style={{
                            display: "flex", flexDirection: "column", gap: 6,
                            paddingTop: 8,
                          }}>
                            {items.map(d => (
                              <DetectionCard
                                key={d.id} d={d}
                                expanded={expandedId === d.id}
                                onToggle={() => setExpandedId(expandedId === d.id ? null : d.id)}
                                onConfirm={setConfirmed}
                                onSetSwapVerdict={setSwapVerdict}
                                onReview={setReviewed}
                                onDiscard={setDiscarded}
                                mode="history"
                                classification={getClassification(birdLabel(d), classifications)}
                                onSetManualLabel={setManualLabel}
                                corpusCount={corpusCountFor(d)}
                                labelSuggestions={labelSuggestions}
                              />
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </section>
                );
              })}
            </div>
          </>
        )}
      </main>

      {/* Version stamp footer. Bumped on each deploy so we can tell which
          build is running when investigating issues. */}
      <footer style={{
        padding: "12px 16px calc(env(safe-area-inset-bottom, 0px) + 16px)",
        textAlign: "center",
        fontSize: 11,
        color: "var(--text-3)",
        opacity: 0.7,
      }}>
        Bird Call Alert · {APP_VERSION} · {APP_VERSION_DATE}
      </footer>

      {/* v6.8: Corpus sheet */}
      <CorpusSheet
        open={corpusOpen}
        onClose={() => setCorpusOpen(false)}
        corpusStats={corpusStats}
      />
      {/* Settings sheet */}
      <SettingsSheet
        open={settingsOpen}
        onClose={() => setSettingsOpen(false)}
        viewFilter={viewFilter} setViewFilter={setViewFilter}
        notifMode={notifMode} setNotifMode={setNotifMode}
        confThreshold={confThreshold} setConfThreshold={setConfThreshold}
        classifications={classifications} setClassifications={setClassifications}
        allSeenSpecies={speciesByLabel}
        notifPerm={notifPerm} requestNotif={requestNotif}
        corpusStats={corpusStats}
      />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
