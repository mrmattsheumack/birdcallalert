// ─── v5.8.0: Service Worker registration ──────────────────────────────
// Registers /sw.js so registration.showNotification() works on Chrome

if ("serviceWorker" in navigator) {

// ─── v5.8.0: Notification helper (SW-first, fallback to direct) ───────
// Use this everywhere INSTEAD of `new Notification()`. On Chrome Android,
// `new Notification()` fails silently because the spec requires SW route.
// This helper tries SW first, then falls back to direct constructor.
async function showBirdNotif(title, body, tag) {
  if (typeof Notification === "undefined") {
    console.warn("[notif] Notification API unavailable");
    return;
  }
  if (Notification.permission !== "granted") {
    console.warn("[notif] permission not granted:", Notification.permission);
    return;
  }
  const options = {
    body: body,
    tag: tag || "bird-detection",
  };
  try {
    if ("serviceWorker" in navigator) {
      const reg = await navigator.serviceWorker.ready;
      if (reg && reg.showNotification) {
        await reg.showNotification(title, options);
        console.log("[notif] shown via SW:", title);
        return;
      }
    }
  } catch (e) {
    console.warn("[notif] SW route failed, falling back:", e);
  }
  try {
    new Notification(title, options);
    console.log("[notif] shown via direct constructor:", title);
  } catch (e) {
    console.warn("[notif] direct constructor failed:", e);
  }
}

// ─── Classification states ──────────────────────────────────────────
// Four states a species can be in:
//   priority — alert me with push notification, show with star+orange
//   normal   — show in feed, no push (default for unclassified species)
//   suspect  — show in feed with yellow border + warning, no push.

// ─── Training corpus tier thresholds ────────────────────────────────
// v5.7.5: 5-tier collection-progress system. The dot next to a species
// indicates how close that species is to having enough training data.
//   0-14   → no dot         "starting" - urgent, keep collecting
//   15-49  → orange ◐       "building" - keep collecting
//   50-79  → lime ◐         "sufficient" - keep but lower priority
//   80-99  → green ●        "ready" - target hit, can mute if you want
//   100+   → gray ●         "saturated" - stop, you have plenty
// Source-of-truth count comes from Supabase: rows with either a
// manual_label OR confirmed=true for a given normalised species label.
const CORPUS_TIER_BUILDING = 15;
const CORPUS_TIER_SUFFICIENT = 50;
const CORPUS_TIER_READY = 80;
const CORPUS_TIER_SATURATED = 100;

// Helper: map a count to {tier, dot, color}. Single source of truth
// used by both the per-card display and the settings list.
function corpusTier(count) {
  if (count >= CORPUS_TIER_SATURATED) {
    return { tier: "saturated", dot: "●", dotColor: "#94a3b8" };
  }
  if (count >= CORPUS_TIER_READY) {
    return { tier: "ready", dot: "●", dotColor: "var(--success)" };
  }
  if (count >= CORPUS_TIER_SUFFICIENT) {
    return { tier: "sufficient", dot: "◐", dotColor: "#84cc16" };
  }
  if (count >= CORPUS_TIER_BUILDING) {
    return { tier: "building", dot: "◐", dotColor: "#ca8a04" };
  }
  return { tier: "starting", dot: "", dotColor: "transparent" };
}

// ─── v5.5: BirdNET post-processor remapping ──────────────────────────
// Empirical remapping table derived from user correction history.
// For each BirdNET prediction shown here, the user has corrected it
// to a different species often enough that we should lead with the
// most-likely real label and show BirdNET's original guess as subtext.
//
// `primary` = most-likely actual species when BirdNET predicts this
// `alternates` = other frequent corrections, offered as quick-confirm chips
// `confidence` = "high" (one dominant correction target) | "medium" | "low"
//
// Confirm button behaviour when remap is active: writes manual_label =
// `primary` (treated as a correction), routing the WAV to the corrected
// species' training-corpus folder rather than BirdNET's wrong folder.
//
// To regenerate this table, run the per-species accuracy query in
// Supabase, then update entries here. Keep in sync with corpus reality.
// Source data: 1678 detections analysed 2026-05-13.
const BIRDNET_REMAPS = {
  // ─── High-confidence remaps (single dominant correction target) ───
  "Red Wattlebird":         { primary: "Little Wattlebird",        alternates: [],                                                confidence: "high" },
  "Gang-gang Cockatoo":     { primary: "Sulphur-crested Cockatoo", alternates: [],                                                confidence: "high" },
  "Eastern Rosella":        { primary: "Crimson Rosella",          alternates: [],                                                confidence: "high" },
  "Olive-backed Oriole":    { primary: "Common Myna",              alternates: [],                                                confidence: "high" },

  // ─── Medium-confidence remaps (clear primary + alternates) ────────
  "Satin Bowerbird":        { primary: "Common Myna",              alternates: ["Little Wattlebird", "Polly", "Little Raven"],   confidence: "medium" },
  "European Greenfinch":    { primary: "Cricket",                  alternates: ["Brown Thornbill"],                              confidence: "medium" },

  // ─── Low-confidence remaps (suggestive, multiple targets) ─────────
  "Australasian Swamphen":  { primary: "Polly",                    alternates: ["Common Myna"],                                  confidence: "low" },
  "Eurasian Coot":          { primary: "Cricket",                  alternates: ["Little Corella"],                               confidence: "low" },
};

// Return remap info for a BirdNET prediction, or null if no remap applies.
// Returned object: { primary, alternates, confidence, original }
//   primary    : best-guess actual species name
//   alternates : array of other likely species
//   confidence : "high" | "medium" | "low"
//   original   : the BirdNET prediction (passed through for display)
function remapBirdNet(speciesGuess) {
  if (!speciesGuess) return null;
  const entry = BIRDNET_REMAPS[speciesGuess];
  if (!entry) return null;
  return {
    primary: entry.primary,
    alternates: entry.alternates || [],
    confidence: entry.confidence,
    original: speciesGuess,
  };
}

// ─── localStorage keys ──────────────────────────────────────────────
// In v4 the species classifications live in `bca_classifications` as a
// {label: state} object. Old `bca_muted` is read once to migrate, then
// abandoned.
const LS = {
  classifications: "bca_classifications",  // v4: {species_label: state}
  classificationsSeeded: "bca_classifications_seeded",
  muted_legacy:    "bca_muted",   // v3 and earlier - migrate once
  filter:          "bca_filter",
  notifMode:       "bca_notif_mode",
  conf:            "bca_conf",
  lastNotif:       "bca_last_notif_id",
  historyStatusFilter: "bca_history_status_filter",  // v5.4: persisted history status pick
  historySpeciesFilter: "bca_history_species_filter",  // v5.7: persisted history species pick
};

// ─── Classification helpers (abstraction layer) ─────────────────────
// All reads/writes go through these functions. When we eventually
// migrate to Supabase-backed classification, only these change.
function loadClassifications() {
  try {
    const raw = localStorage.getItem(LS.classifications);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;  // null = needs seeding
}
function saveClassifications(obj) {
  try { localStorage.setItem(LS.classifications, JSON.stringify(obj)); }
  catch (e) {}
}
function seedClassifications() {
  // Build initial classifications:
  //   - All DEFAULT_PRIORITY_SPECIES → priority
  //   - All species in old bca_muted → muted (one-time v3→v4 migration)
  //   - Everything else → no entry (treated as "normal" by default)
  const obj = {};
  for (const s of DEFAULT_PRIORITY_SPECIES) obj[s] = "priority";
  try {
    const oldMuted = JSON.parse(localStorage.getItem(LS.muted_legacy) || "[]");
    for (const s of oldMuted) obj[s] = "muted";
  } catch (e) {}
  saveClassifications(obj);
  localStorage.setItem(LS.classificationsSeeded, "1");
  return obj;
}
function getClassification(label, classifications) {
  return classifications[label] || "normal";
}

// Sync the muted species list to Supabase pi_config table so the Pi
// stops saving audio for muted species. Called whenever classifications
// change. Failure is non-blocking.
async function syncMutedToServer(classifications) {
  const muted = Object.entries(classifications)
    .filter(([_, state]) => state === "muted")
    .map(([label]) => label);
  try {
    // Upsert: if row exists, update value; else insert
    await fetch(
      `${SUPA_URL}/rest/v1/pi_config?key=eq.muted_species`,
      {
        method: "PATCH",
        headers: { ...SUPA_HEADERS, "Prefer": "return=minimal" },
        body: JSON.stringify({ value: muted }),
      }
    );
  } catch (e) {
    console.warn("Failed to sync muted list to Pi:", e);
  }
}

// ─── Helpers ────────────────────────────────────────────────────────
function birdLabel(d) {
  const m = d.metadata || {};
  if (m.label) return m.label;
  if (m.scientific_name) return `${d.species_guess}_${m.scientific_name}`;
  return d.species_guess || "Unknown";
}

// True if a detection should be flagged as priority. Priority is computed
// client-side from the user's classifications object (in App state, persisted
// to localStorage) rather than read from a server-set flag.
function isPriority(d, classifications) {
  const label = birdLabel(d);
  return getClassification(label, classifications) === "priority";
}

// True if a detection's species is currently muted by the user.
function isMuted(d, classifications) {
  const label = birdLabel(d);
  return getClassification(label, classifications) === "muted";
}

// True if user has marked this species as suspect.
function isSuspect(d, classifications) {
  const label = birdLabel(d);
  return getClassification(label, classifications) === "suspect";
}

// True if the user has manually relabelled this detection AND the new label
// is different from BirdNET's original guess. We compare on the common-name
// portion (label has form "CommonName_ScientificName" or just "CommonName").
// This is what drives the green ✓ "corrected" badge on the card.
function isCorrected(d) {
  const meta = d.metadata || {};
  const manual = (meta.manual_label || "").trim();
  if (!manual) return false;
  const original = (d.species_guess || "").trim();
  if (!original) return manual.length > 0;  // no original to compare, treat as touched
  // Case-insensitive compare. If user typed back the same species (confirmation,
  // not correction) we DON'T flag it - the badge means "different from BirdNET".
  return manual.toLowerCase() !== original.toLowerCase();
}

// v5.2: True if the user has explicitly confirmed BirdNET's guess via
// the new Confirm button. Drives the blue ✓ "confirmed" badge and the
// Pi-side promote into `training-corpus/<species_guess>/`.
function isConfirmed(d) {
  const meta = d.metadata || {};
  return meta.confirmed === true;
}

// v5.4: True if the user has explicitly marked this card as reviewed
// without confirming or correcting. Drives the grey badge in history.
// A "reviewed" card is one the user has chosen to skip but has seen -
// it should NOT appear in the Unaddressed history filter. The clip is
// NOT added to the training corpus (no Pi action on reviewed-only).
function isReviewed(d) {
  const meta = d.metadata || {};
  return !!meta.reviewed_at;
}

// v5.2: Normalise a species label the same way the Pi promote-poll does
// (lowercase, trim, replace whitespace with dashes). Used client-side to
// match up corpus counts across slight spelling variations ("Common Mynah"
// vs "Common mynah" vs "common-mynah").
function normaliseCorpusLabel(s) {
  if (!s) return "";
  return String(s).trim().toLowerCase().replace(/\s+/g, "-");
}

// ─── v5.7.6: Label consolidation remap ──────────────────────────────
// Mirrors the Pi-side _V4_LABEL_REMAPS exactly. The Pi consolidates
// similar species into single training-corpus folders (e.g. Little
// Wattlebird + Red Wattlebird both → wattlebird/). For the app's
// count display to match what the Pi actually has in training-corpus,
// we apply the same consolidation here when counting. Without this,
// the app would show "Little Wattlebird: 62" + "Red Wattlebird: 24"
// as separate entries while the Pi has a single "wattlebird: 98"
// folder, and counts would never match.
const LABEL_CONSOLIDATION_REMAP = {
  "little wattlebird": "Wattlebird",
  "red wattlebird":    "Wattlebird",
  "australian raven":  "Raven",
  "forest raven":      "Raven",
  "little raven":      "Raven",
};

// Apply consolidation: returns the consolidated pretty form for known
// species, or the original label unchanged. Case-insensitive matching.
function consolidateLabel(label) {
  if (!label) return label;
  const key = String(label).trim().toLowerCase();
  return LABEL_CONSOLIDATION_REMAP[key] || label;
}

// Date-bucket label for the History page grouping.
// Boundaries are based on local-time calendar dates (not strict 24h windows)
// so "Today" means today's date, "Yesterday" means yesterday's date, etc.
//   Today:      today's calendar date
//   Yesterday:  yesterday's calendar date
//   This week:  within last 7 days, excluding today/yesterday
//   This month: within last 30 days, excluding the above
//   Older:      anything older than 30 days
function historyBucket(ts) {
  const then = new Date(ts);
  const now = new Date();
  const startOfDay = (d) => {
    const x = new Date(d);
    x.setHours(0, 0, 0, 0);
    return x;
  };
  const today = startOfDay(now);
  const yest = new Date(today);
  yest.setDate(yest.getDate() - 1);
  const weekAgo = new Date(today);
  weekAgo.setDate(weekAgo.getDate() - 7);
  const monthAgo = new Date(today);
  monthAgo.setDate(monthAgo.getDate() - 30);

  const tDay = startOfDay(then);
  if (tDay.getTime() === today.getTime()) return "Today";
  if (tDay.getTime() === yest.getTime()) return "Yesterday";
  if (tDay.getTime() >= weekAgo.getTime()) return "This week";
  if (tDay.getTime() >= monthAgo.getTime()) return "This month";
  return "Older";
}
const HISTORY_BUCKET_ORDER = ["Today", "Yesterday", "This week", "This month", "Older"];

// Time-range bounds for each history bucket (as ISO strings, UTC).
// Used to build Supabase queries that fetch one bucket at a time.
// Returns { gte, lt } where: created_at >= gte AND created_at < lt
// Same calendar-day logic as historyBucket() above.
function historyBucketRange(bucket) {
  const now = new Date();
  const startOfDay = (d) => {
    const x = new Date(d);
    x.setHours(0, 0, 0, 0);
    return x;
  };
  const today = startOfDay(now);
  const tomorrow = new Date(today);
  tomorrow.setDate(tomorrow.getDate() + 1);
  const yest = new Date(today);
  yest.setDate(yest.getDate() - 1);
  const weekAgo = new Date(today);
  weekAgo.setDate(weekAgo.getDate() - 7);
  const monthAgo = new Date(today);
  monthAgo.setDate(monthAgo.getDate() - 30);

  switch (bucket) {
    case "Today":      return { gte: today.toISOString(),     lt: tomorrow.toISOString() };
    case "Yesterday":  return { gte: yest.toISOString(),      lt: today.toISOString() };
    case "This week":  return { gte: weekAgo.toISOString(),   lt: yest.toISOString() };
    case "This month": return { gte: monthAgo.toISOString(),  lt: weekAgo.toISOString() };
    case "Older":      return { gte: null,                    lt: monthAgo.toISOString() };
    default:           return { gte: null, lt: null };
  }
}

function fmtAge(ts) {
  if (!ts) return "";
  const mins = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  if (mins < 1440) {
    const h = Math.floor(mins / 60);
    const remM = mins % 60;
    return remM === 0 ? `${h}h ago` : `${h}h ${remM}m ago`;
  }
  return `${Math.floor(mins / 1440)}d ago`;
}

function fmtAgeShort(ts) {
  if (!ts) return "";
  const mins = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  if (mins < 1) return "now";
  if (mins < 60) return `${mins}m`;
  if (mins < 1440) return `${Math.floor(mins / 60)}h`;
  return `${Math.floor(mins / 1440)}d`;
}

function lsGet(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v === null ? fallback : v;
  } catch (e) {
    return fallback;
  }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, val); } catch (e) {}
}

// ─── Detection card ─────────────────────────────────────────────────
// Single detection row, used in both the live feed and the history view.
// `mode` is "live" or "history" - in live mode, the action buttons are
// Confirm (✓) and Dismiss (×); in history they appear too, but only on
// cards that haven't been acted on yet. Cards already corrected or
// confirmed in history show no buttons (the action is done).
//
// v4 props: classification (priority/normal/suspect/muted),
//           onSetClassification(label, newState) - changes user's classification
//           onSetManualLabel(detectionId, label) - records manual relabel
// v5.2 props: onConfirm(detectionId) - records "BirdNET was right" + dismisses
//             corpusCount: number of clips already in training corpus for this
//               species (used for per-card tier dot)
// v5.4 props: onReview(detectionId) - marks card as reviewed (no opinion).
//             Wired to the × button when in history mode, so reviewing-but-not-
//             confirming-or-correcting becomes an explicit action. Cards marked
//             reviewed get a grey badge and drop out of the Unaddressed filter.
// v5.4.2 props: labelSuggestions: deduped sorted list of strings combining
//             prior manual_labels and BirdNET species_guess values across
//             all loaded detections. Used to drive autocomplete on the
//             "what is this actually?" input. Prevents duplicate variants
//             like "Common Myna" vs "Common Mynah".
function DetectionCard({ d, expanded, onToggle, onDismiss, onRestore, mode,
                         classification, onSetClassification, onSetManualLabel,
                         onConfirm, onReview, onDiscard, corpusCount, labelSuggestions }) {
  const label = birdLabel(d);
  const meta = d.metadata || {};
  const conf = Math.round((d.confidence || 0) * 100);

  const isPriorityCls = classification === "priority";
  const isSuspectCls  = classification === "suspect";

  // v5: user has supplied a correction (manual_label differs from species_guess)
  const corrected = isCorrected(d);

  // v5.2: user has confirmed BirdNET was right (separate from correction)
  const confirmed = isConfirmed(d);

  // v5.4: user has marked card as reviewed (no opinion either way)
  const reviewed = isReviewed(d);

  // v5.5: BirdNET post-processor remap. Applies only when:
  //   - BirdNET's guess is in BIRDNET_REMAPS table, AND
  //   - The user hasn't already acted on the card (no correction/confirm)
  // When active, we display the remap.primary as the headline label and
  // show BirdNET's original guess in subtext. Confirm button writes the
  // remapped label as manual_label (so the Pi promotes to the right folder).
  const remap = (!corrected && !confirmed) ? remapBirdNet(d.species_guess) : null;
  const displaySpecies = remap ? remap.primary : d.species_guess;

  // Do we show the Confirm/Dismiss buttons?
  // Live: always show.
  // History: show only if not already actioned in any way (no badge of any colour).
  const actioned = corrected || confirmed || reviewed;
  const showActionButtons = mode === "live" || !actioned;

  // v3: regional plausibility
  const regionFlagged = meta.region_match === false;
  const regionCount = typeof meta.region_count === "number" ? meta.region_count : null;

  // v4: audio clip available?
  const clipFilename = meta.clip_filename || null;
  const clipUrl = clipFilename ? `${PI_AUDIO_BASE}/clips/${clipFilename}` : null;

  // v4: manual label persisted in the row's metadata
  const [manualLabelDraft, setManualLabelDraft] = useState(meta.manual_label || "");
  const [manualSaving, setManualSaving] = useState(false);

  // v5.4.2: autocomplete dropdown state and filtered suggestions
  const [suggestionsOpen, setSuggestionsOpen] = useState(false);
  const filteredSuggestions = useMemo(() => {
    if (!labelSuggestions || labelSuggestions.length === 0) return [];
    const q = (manualLabelDraft || "").trim().toLowerCase();
    if (q.length < 2) return [];
    // Two-bucket ranking: exact-prefix matches first, then substring matches
    const prefix = [];
    const substring = [];
    for (const s of labelSuggestions) {
      const lower = s.toLowerCase();
      if (lower === q) continue;  // skip exact match (no point suggesting current input)
      if (lower.startsWith(q)) prefix.push(s);
      else if (lower.includes(q)) substring.push(s);
    }
    return [...prefix, ...substring].slice(0, 6);
  }, [manualLabelDraft, labelSuggestions]);

  // Stop propagation so action button clicks don't toggle the card
  function handleAction(e, fn) {
    e.stopPropagation();
    fn?.();
  }

  // Border styling by classification (live mode only)
  let borderColor = "var(--border)";
  let borderLeft = "1px solid var(--border)";
  if (mode === "live") {
    if (isPriorityCls) {
      borderColor = "rgba(217, 119, 6, 0.35)";
      borderLeft = "4px solid var(--accent)";
    } else if (isSuspectCls) {
      borderColor = "rgba(202, 138, 4, 0.55)";
      borderLeft = "4px solid #ca8a04";
    } else if (regionFlagged) {
      borderColor = "rgba(202, 138, 4, 0.45)";
      borderLeft = "4px solid #ca8a04";
    }
  }

  async function handleSaveManualLabel(e) {
    e.stopPropagation();
    if (manualSaving) return;
    setManualSaving(true);
    try {
      await onSetManualLabel?.(d.id, manualLabelDraft.trim(), clipFilename);
    } finally {
      setManualSaving(false);
    }
  }

  function cycleClassification(e) {
    e.stopPropagation();
    const order = ["normal", "priority", "suspect", "muted"];
    const cur = classification || "normal";
    const next = order[(order.indexOf(cur) + 1) % order.length];
    onSetClassification?.(label, next);
  }

  return (
    <div onClick={onToggle}
      style={{
        position: "relative",
        background: "var(--surface)",
        border: "1px solid " + borderColor,
        borderLeft,
        borderRadius: "var(--r-md)",
        padding: "14px 16px",
        cursor: "pointer",
        boxShadow: "var(--shadow)",
        opacity: mode === "history" ? 0.85 : 1,
      }}>

      {/* v5.7: discard button - history mode only. Renders independently
          of the action-buttons cluster so it appears on actioned cards
          (confirmed/corrected/reviewed) too - those are exactly the
          cards in training-corpus that we might want to remove. Positioned
          left of the badge area so it doesn't overlap. */}
      {mode === "history" && onDiscard && (
        <button
          onClick={(e) => {
            e.stopPropagation();
            if (window.confirm("Discard this clip? It'll be removed from training.")) {
              onDiscard(d.id);
            }
          }}
          aria-label="Discard from training corpus"
          title="Discard: remove this clip from training"
          style={{
            position: "absolute", top: 8, right: 38,
            width: 22, height: 22, borderRadius: "50%",
            background: "#b91c1c",
            color: "#fff",
            border: "none",
            cursor: "pointer",
            fontSize: 11, lineHeight: 1,
            display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: "0 1px 3px rgba(185, 28, 28, 0.4)",
            zIndex: 3,
          }}
        >🗑</button>
      )}

      {/* v5/v5.2/v5.4: top-right corner content. Mutually exclusive:
          - Corrected (green ✓ badge) takes priority over confirmed
          - Confirmed (blue ✓ badge) takes priority over reviewed
          - Reviewed (grey · badge, v5.4) - "I looked at this, no opinion"
          - Otherwise show the action buttons (Confirm ✓ and × Skip/Dismiss).
            In live mode × dismisses to history. In history mode × marks
            the card as reviewed so it leaves the Unaddressed filter.
          v5.4: badges are FILLED with no border. Buttons have a thin white
          border + outer shadow so they read as interactive. This stops the
          "is it a button or a badge?" confusion. */}
      {corrected && (
        <div
          title={`You corrected this to: ${meta.manual_label}`}
          aria-label={`Corrected to ${meta.manual_label}`}
          style={{
            position: "absolute", top: 8, right: 8,
            width: 22, height: 22, borderRadius: "50%",
            background: "var(--success)",
            color: "#fff",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 13, fontWeight: 700, lineHeight: 1,
            boxShadow: "0 1px 2px rgba(21, 128, 61, 0.35)",
            zIndex: 2,
          }}
        >✓</div>
      )}
      {confirmed && !corrected && (
        <div
          title={`You confirmed: ${d.species_guess}`}
          aria-label={`Confirmed ${d.species_guess}`}
          style={{
            position: "absolute", top: 8, right: 8,
            width: 22, height: 22, borderRadius: "50%",
            background: "#1d4ed8",
            color: "#fff",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 13, fontWeight: 700, lineHeight: 1,
            boxShadow: "0 1px 2px rgba(29, 78, 216, 0.35)",
            zIndex: 2,
          }}
        >✓</div>
      )}
      {reviewed && !confirmed && !corrected && (
        <div
          title="You marked this as reviewed (no opinion). Not in training corpus."
          aria-label="Reviewed - no opinion"
          style={{
            position: "absolute", top: 8, right: 8,
            width: 22, height: 22, borderRadius: "50%",
            background: "var(--text-3)",
            color: "#fff",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 13, fontWeight: 700, lineHeight: 1,
            boxShadow: "0 1px 2px rgba(0, 0, 0, 0.15)",
            zIndex: 2,
          }}
        >·</div>
      )}
      {showActionButtons && !actioned && (
        <div style={{
          position: "absolute", top: 6, right: 6,
          display: "flex", gap: 4, zIndex: 2,
        }}>
          {onConfirm && (
            <button
              onClick={(e) => handleAction(e, () => {
                // v5.5: when post-processor has remapped, "confirm" means
                // "confirm the REMAPPED species, not BirdNET's". Write as
                // manual_label so the Pi promotes to the correct corpus folder.
                if (remap && onSetManualLabel) {
                  onSetManualLabel(d.id, remap.primary, clipFilename);
                } else {
                  onConfirm(d.id);
                }
              })}
              aria-label={remap ? `Confirm as ${remap.primary}` : "Confirm BirdNET's call"}
              title={remap ? `Confirm: ${remap.primary}` : "Confirm: BirdNET is right"}
              style={{
                width: 32, height: 32, borderRadius: "50%",
                background: "#1d4ed8",
                color: "#fff",
                // v5.4: buttons get a white inner border so they're visually
                // distinct from the flat-filled badges
                border: "2px solid #fff",
                cursor: "pointer",
                fontSize: 14, fontWeight: 700, lineHeight: 1,
                display: "flex", alignItems: "center", justifyContent: "center",
                boxShadow: "0 2px 6px rgba(29, 78, 216, 0.45)",
              }}
            >✓</button>
          )}
          {/* The × button:
              - in live mode: dismisses to history
              - in history mode: marks the card as reviewed (drops out of Unaddressed)
              v5.4 fix: previously this button did nothing in history because
              onDismiss wasn't wired for history. */}
          <button
            onClick={(e) => handleAction(e, () => {
              if (mode === "history" && onReview) {
                onReview(d.id);
              } else if (onDismiss) {
                onDismiss();
              }
            })}
            aria-label={mode === "history" ? "Mark reviewed" : "Dismiss"}
            title={mode === "history"
              ? "Skip: mark as reviewed (no opinion)"
              : "Dismiss: file without acting"}
            style={{
              width: 32, height: 32, borderRadius: "50%",
              background: "#fff",
              color: "var(--text-2)",
              border: "2px solid var(--border)",
              cursor: "pointer",
              fontSize: 18, fontWeight: 600, lineHeight: 1,
              display: "flex", alignItems: "center", justifyContent: "center",
              boxShadow: "0 2px 6px rgba(0, 0, 0, 0.12)",
            }}
          >×</button>
        </div>
      )}

      {/* Suspect banner takes priority over region banner. Both are yellow but
          carry slightly different messages. */}
      {isSuspectCls && mode === "live" && (
        <div style={{
          display: "flex", alignItems: "center", gap: 8,
          margin: "-2px -4px 10px",
          padding: "8px 10px",
          background: "rgba(254, 243, 199, 0.85)",
          border: "1px solid rgba(202, 138, 4, 0.45)",
          borderRadius: "var(--r-sm)",
          fontSize: 12, color: "#854d0e", lineHeight: 1.35,
        }}>
          <span style={{ fontSize: 16, lineHeight: 1 }}>⚠️</span>
          <span style={{ flex: 1 }}>
            <strong>Suspect</strong> — you've marked this species as likely misidentified.
            Listen to the clip and record what it actually is.
          </span>
        </div>
      )}
      {!isSuspectCls && regionFlagged && mode === "live" && (
        <div style={{
          display: "flex", alignItems: "center", gap: 8,
          margin: "-2px -4px 10px",
          padding: "8px 10px",
          background: "rgba(254, 243, 199, 0.85)",
          border: "1px solid rgba(202, 138, 4, 0.35)",
          borderRadius: "var(--r-sm)",
          fontSize: 12, color: "#854d0e", lineHeight: 1.35,
        }}>
          <span style={{ fontSize: 16, lineHeight: 1 }}>⚠️</span>
          <span style={{ flex: 1 }}>
            <strong>Likely misidentified</strong> — not recorded within 10km of your home in eBird data.
          </span>
        </div>
      )}

      <div style={{ display: "flex", alignItems: "flex-start",
          justifyContent: "space-between", gap: 12 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 17, fontWeight: 600, color: "var(--text)",
              lineHeight: 1.25 }}>
            {isPriorityCls && mode === "live" && (
              <span style={{ color: "var(--accent)", marginRight: 6 }}>★</span>
            )}
            {isSuspectCls && mode === "live" && !isPriorityCls && (
              <span style={{ color: "#ca8a04", marginRight: 6 }}>⚠</span>
            )}
            {displaySpecies}
          </div>
          {/* v5.5: when post-processor has remapped this prediction, surface
              BirdNET's original guess as small audit-trail text. Helps the
              user spot when the remap looks wrong, and preserves trust by
              not hiding the raw model output. */}
          {remap && (
            <div style={{ fontSize: 11, color: "var(--text-3)",
                marginTop: 3, fontStyle: "italic" }}>
              BirdNET said: {remap.original}
              {remap.confidence === "low" && (
                <span style={{ marginLeft: 6, color: "#ca8a04" }}>· uncertain</span>
              )}
            </div>
          )}
          {meta.scientific_name && !remap && (
            <div style={{ fontSize: 13, color: "var(--text-2)",
                fontStyle: "italic", marginTop: 3 }}>
              {meta.scientific_name}
            </div>
          )}
          {/* v5.5: quick-confirm chips for alternate likely species when
              the remap has more than one common correction target. Tap a
              chip to confirm THAT label instead of the primary. */}
          {remap && remap.alternates.length > 0 && mode === "live" && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 4,
                marginTop: 6 }}>
              <span style={{ fontSize: 11, color: "var(--text-3)",
                  alignSelf: "center", marginRight: 2 }}>or:</span>
              {remap.alternates.map(alt => (
                <button
                  key={alt}
                  onClick={(e) => handleAction(e, () => onSetManualLabel(d.id, alt, clipFilename))}
                  style={{
                    fontSize: 11, padding: "2px 8px",
                    background: "transparent", color: "var(--text-2)",
                    border: "1px solid var(--border)",
                    borderRadius: 999, cursor: "pointer",
                    whiteSpace: "nowrap",
                  }}
                  title={`Confirm as ${alt}`}
                >{alt}</button>
              ))}
            </div>
          )}
          {/* Manual relabel chip if set */}
          {meta.manual_label && (
            <div style={{ fontSize: 12, color: "var(--text)",
                marginTop: 6, padding: "3px 8px",
                background: "rgba(31, 107, 58, 0.1)",
                border: "1px solid rgba(31, 107, 58, 0.25)",
                borderRadius: 999, display: "inline-block" }}>
              You: <strong>{meta.manual_label}</strong>
            </div>
          )}
          <div style={{ fontSize: 13, color: "var(--text-2)", marginTop: 6 }}>
            {fmtAge(d.created_at)}
          </div>
        </div>
        <div style={{ display: "flex", flexDirection: "column",
            alignItems: "flex-end", flexShrink: 0, gap: 6 }}>
          <div style={{
            fontSize: 18, fontWeight: 700,
            color: conf >= 75 ? "var(--success)" :
                   conf >= 50 ? "var(--primary)" : "var(--text-2)",
          }}>{conf}%</div>
          <div style={{ fontSize: 11, color: "var(--text-3)" }}>
            confidence
          </div>
          {/* v5.2: per-card corpus stat - shows how many clips are already
              in the training corpus for this species. Same font weight/colour
              as the confidence label so it doesn't fight for attention.
              Tier dot signals when a species is well-collected (green ●),
              building (yellow ◐), or still under-collected (no dot). */}
          {typeof corpusCount === "number" && (() => {
            // v5.7.5: 5-tier system via corpusTier helper
            const { dot, dotColor } = corpusTier(corpusCount);
            return (
              <div style={{
                fontSize: 11, color: "var(--text-3)",
                marginTop: 4, display: "flex",
                alignItems: "baseline", gap: 3,
                justifyContent: "flex-end",
              }}>
                <span>{corpusCount} clip{corpusCount === 1 ? "" : "s"}</span>
                {dot && <span style={{ color: dotColor, fontSize: 11 }}>{dot}</span>}
              </div>
            );
          })()}
          {/* Old × and Restore buttons removed in v5.2 - actions now live
              in the top-right corner button cluster. */}
        </div>
      </div>

      {expanded && (
        <div style={{ marginTop: 12, paddingTop: 12,
            borderTop: "1px solid var(--border)" }}>

          {/* v5.4.1: Inline audio player. Previously this was a "Play in new
              tab" link because the Pi served plain HTTP and the HTTPS web app
              couldn't mix-content-play inline. Now the Pi serves audio over
              HTTPS via Tailscale Serve, so the audio element works inline.
              Requires Tailscale running on the device for the .ts.net
              hostname to resolve correctly. */}
          {clipUrl && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 10, color: "var(--text-3)",
                  fontWeight: 600, letterSpacing: 0.5,
                  textTransform: "uppercase", marginBottom: 6 }}>
                Audio clip
              </div>
              <audio
                controls
                preload="none"
                src={clipUrl}
                onClick={(e) => e.stopPropagation()}
                style={{
                  width: "100%",
                  height: 40,
                  borderRadius: "var(--r-sm)",
                }}
              />
              <div style={{ fontSize: 11, color: "var(--text-3)", marginTop: 4, lineHeight: 1.4 }}>
                Plays when Tailscale is running on this device.
              </div>
            </div>
          )}

          {/* Manual relabel input - available in both live and history mode.
              v5.3: previously gated to mode === "live" which meant cards
              that aged out of live (or were dismissed/confirmed) couldn't
              be relabelled. The 24h live window makes this problematic if
              the user doesn't get to review a card within a day. Now
              available everywhere. */}
          {clipUrl && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 10, color: "var(--text-3)",
                  fontWeight: 600, letterSpacing: 0.5,
                  textTransform: "uppercase", marginBottom: 6 }}>
                What is this actually?
              </div>
              <div style={{ display: "flex", gap: 6, position: "relative" }}>
                <div style={{ flex: 1, position: "relative" }}>
                  <input
                    type="text"
                    value={manualLabelDraft}
                    onChange={(e) => {
                      e.stopPropagation();
                      setManualLabelDraft(e.target.value);
                      setSuggestionsOpen(true);
                    }}
                    onFocus={() => setSuggestionsOpen(true)}
                    onBlur={() => {
                      // Defer the close so a click on a suggestion item can register
                      setTimeout(() => setSuggestionsOpen(false), 150);
                    }}
                    onClick={(e) => e.stopPropagation()}
                    placeholder="e.g. Bell Miner, or 'unknown' if not sure"
                    style={{
                      width: "100%", padding: "8px 10px",
                      border: "1px solid var(--border)",
                      borderRadius: "var(--r-sm)",
                      fontSize: 14, fontFamily: "inherit",
                      background: "var(--surface)",
                      boxSizing: "border-box",
                    }}
                  />
                  {/* v5.4.2: autocomplete dropdown. Shows when input has 2+
                      chars and there are matching suggestions. Suggestions
                      come from your prior manual_labels + BirdNET's species
                      guesses across all loaded detections. */}
                  {suggestionsOpen && filteredSuggestions.length > 0 && (
                    <div
                      onClick={(e) => e.stopPropagation()}
                      style={{
                        position: "absolute",
                        top: "calc(100% + 2px)",
                        left: 0, right: 0,
                        background: "#fff",
                        border: "1px solid var(--border)",
                        borderRadius: "var(--r-sm)",
                        boxShadow: "0 4px 12px rgba(0, 0, 0, 0.1)",
                        maxHeight: 220,
                        overflowY: "auto",
                        zIndex: 10,
                      }}
                    >
                      {filteredSuggestions.map((s, i) => (
                        <button
                          key={s}
                          // onMouseDown fires before onBlur, so the suggestion
                          // click registers before the input deferred-close fires
                          onMouseDown={(e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            setManualLabelDraft(s);
                            setSuggestionsOpen(false);
                          }}
                          style={{
                            display: "block", width: "100%", textAlign: "left",
                            padding: "8px 10px",
                            background: "transparent",
                            border: "none",
                            borderBottom: i < filteredSuggestions.length - 1
                              ? "1px solid var(--border)" : "none",
                            fontSize: 14,
                            fontFamily: "inherit",
                            color: "var(--text)",
                            cursor: "pointer",
                          }}
                        >
                          {s}
                        </button>
                      ))}
                    </div>
                  )}
                </div>
                <button
                  onClick={handleSaveManualLabel}
                  disabled={manualSaving || !manualLabelDraft.trim() || manualLabelDraft.trim() === (meta.manual_label || "")}
                  style={{
                    padding: "8px 14px",
                    background: "var(--primary)", color: "#fff",
                    border: "none", borderRadius: "var(--r-sm)",
                    fontSize: 13, fontWeight: 600, cursor: "pointer",
                    opacity: (manualSaving || !manualLabelDraft.trim() || manualLabelDraft.trim() === (meta.manual_label || "")) ? 0.5 : 1,
                  }}
                >{manualSaving ? "..." : "Save"}</button>
              </div>
              <div style={{ fontSize: 11, color: "var(--text-3)", marginTop: 6, lineHeight: 1.4 }}>
                Saving copies this clip to <code style={{
                  background: "var(--surface-2)", padding: "1px 4px",
                  borderRadius: 3, fontSize: 11 }}>training-corpus/&lt;label&gt;</code>
                {" "}on the Pi. Used later for a custom classifier.
                {confirmed && !corrected && (
                  <span style={{ display: "block", marginTop: 4, color: "var(--text-2)" }}>
                    Note: this will replace your previous confirmation.
                  </span>
                )}
              </div>
            </div>
          )}

          {/* Classification quick-toggle */}
          {mode === "live" && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 10, color: "var(--text-3)",
                  fontWeight: 600, letterSpacing: 0.5,
                  textTransform: "uppercase", marginBottom: 6 }}>
                Species classification
              </div>
              <div style={{ display: "flex", gap: 4 }}>
                {Object.entries(CLASSIFICATIONS).map(([key, cfg]) => {
                  const active = (classification || "normal") === key;
                  return (
                    <button key={key}
                      onClick={(e) => { e.stopPropagation(); onSetClassification?.(label, key); }}
                      style={{
                        flex: 1, padding: "8px 6px",
                        background: active ? cfg.color : "var(--surface)",
                        color: active ? "#fff" : "var(--text-2)",
                        border: "1px solid " + (active ? cfg.color : "var(--border)"),
                        borderRadius: "var(--r-sm)",
                        fontSize: 11, fontWeight: 500, cursor: "pointer",
                        display: "flex", flexDirection: "column", gap: 2,
                        alignItems: "center",
                      }}>
                      <span style={{ fontSize: 14 }}>{cfg.icon}</span>
                      <span>{cfg.label}</span>
                    </button>
                  );
                })}
              </div>
              <div style={{ fontSize: 11, color: "var(--text-3)", marginTop: 6 }}>
                Affects all detections of <strong>{d.species_guess}</strong>, current and future.
              </div>
            </div>
          )}

          {/* Metadata grid */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {[
              { l: "Detected", v: new Date(d.created_at).toLocaleString("en-AU", {
                  hour: "2-digit", minute: "2-digit",
                  day: "2-digit", month: "short" }) },
              { l: "Confidence", v: `${conf}%` },
              { l: "Detector", v: meta.detector || "birdnet" },
              { l: "Window", v: meta.start_time_secs != null
                  ? `${meta.start_time_secs.toFixed(1)}–${(meta.end_time_secs || 0).toFixed(1)}s`
                  : "—" },
              ...(meta.region_match !== undefined ? [{
                l: "10km eBird records",
                v: regionFlagged
                  ? "Not recorded within 10km"
                  : (regionCount ? `${regionCount.toLocaleString()} sighting${regionCount === 1 ? "" : "s"}` : "Plausible"),
                span: true,
              }] : []),
            ].map(x => (
              <div key={x.l} style={{ background: "var(--surface-2)",
                  borderRadius: "var(--r-sm)", padding: "8px 10px",
                  gridColumn: x.span ? "1 / -1" : "auto" }}>
                <div style={{ fontSize: 10, color: "var(--text-3)",
                    fontWeight: 600, letterSpacing: 0.5,
                    textTransform: "uppercase", marginBottom: 2 }}>{x.l}</div>
                <div style={{ fontSize: 13,
                    color: x.l === "10km eBird records" && regionFlagged ? "#854d0e" : "var(--text)",
                    fontWeight: 500 }}>{x.v}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Main app ───────────────────────────────────────────────────────
function App() {
  const [detections, setDetections] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [lastFetch, setLastFetch] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [expandedId, setExpandedId] = useState(null);
  const [now, setNow] = useState(Date.now());

  // viewMode = "live" (default) | "history"
  const [viewMode, setViewMode] = useState("live");

  const [viewFilter, setViewFilter] = useState(() => lsGet(LS.filter, "all"));
  const [notifMode, setNotifMode] = useState(() => lsGet(LS.notifMode, "priority"));
  const [confThreshold, setConfThreshold] = useState(() => parseFloat(lsGet(LS.conf, "0.40")));

  // v4: quad-state classification per species. Loaded from localStorage,
  // seeded with DEFAULT_PRIORITY_SPECIES on first run. Migrated from the
  // old bca_muted set if present.
  const [classifications, setClassificationsState] = useState(() => {
    let c = loadClassifications();
    if (c === null) {
      c = seedClassifications();
    }
    return c;
  });

  // Wrapper that persists + syncs to server. Use this everywhere instead
  // of setClassificationsState directly.
  const setClassifications = useCallback((updater) => {
    setClassificationsState(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      saveClassifications(next);
      // Fire-and-forget sync of muted list to Supabase pi_config
      syncMutedToServer(next);
      return next;
    });
  }, []);

  const [notifPerm, setNotifPerm] = useState(() =>
    typeof Notification !== "undefined" ? Notification.permission : "unsupported");
  const lastNotifId = useRef(lsGet(LS.lastNotif, null));
  // v5.2: ref to fetchCorpusStats so action callbacks can nudge a refresh
  // without taking fetchCorpusStats as a dep (it's defined later in the
  // component, and we'd rather not reorder code).
  const corpusRefreshRef = useRef(null);

  // Persist settings
  useEffect(() => { lsSet(LS.filter, viewFilter); }, [viewFilter]);
  useEffect(() => { lsSet(LS.notifMode, notifMode); }, [notifMode]);
  useEffect(() => { lsSet(LS.conf, String(confThreshold)); }, [confThreshold]);

  // Sync muted list to Pi once on mount. Future updates go through
  // setClassifications which also syncs.
  useEffect(() => {
    syncMutedToServer(classifications);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Tick "now" every 30s so age labels update without re-fetching
  useEffect(() => {
    const iv = setInterval(() => setNow(Date.now()), 30000);
    return () => clearInterval(iv);
  }, []);

  // ─── Data layer: live window + history buckets ─────────────────────
  //
  // We split data into two scopes:
  //   1. LIVE WINDOW: last 24 hours. Pulled every 20s. Includes both
  //      dismissed and non-dismissed rows. The live feed shows the
  //      non-dismissed subset; the History "Today" bucket shows the
  //      dismissed subset of this same data, so dismissing a card today
  //      makes it appear in "Today" instantly with no extra fetch.
  //   2. HISTORY BUCKETS (Yesterday / This week / This month / Older):
  //      lazy-loaded. Not fetched until the user expands the bucket.
  //      Cached for the session after first load.
  //
  // This is the v5 fix for the limit=100 problem: in v4 we asked for the
  // last 100 rows regardless of age, so high detection volume pushed
  // older dismissed rows out of the response before they reached the
  // client. Now the live query is time-bounded, and history queries are
  // bucket-bounded.

  // History bucket cache. Keyed by bucket name. Each entry:
  //   { items: [...], loading: bool, loaded: bool, error: string|null }
  // "loaded" distinguishes "we tried and got zero results" from "we
  // haven't tried yet".
  const [historyBuckets, setHistoryBuckets] = useState({});

  // Which history buckets are expanded. Today is expanded by default
  // (it auto-fills from the live window). Others wait for user tap.
  const [expandedBuckets, setExpandedBuckets] = useState(() => ({
    "Today": true,
    "Yesterday": false,
    "This week": false,
    "This month": false,
    "Older": false,
  }));

  // History classification filter: which classifications to show.
  // v5.8.1: muted is now included as a chip (default OFF) so user can
  // opt-in to viewing muted clips for audit/quality-review purposes.
  const [historyClsFilter, setHistoryClsFilter] = useState({
    priority: true,
    suspect: true,
    normal: true,
    muted: false,
  });

  // v5.4: History status filter. One-of-four pick (single select):
  //   - "all" (default): show everything regardless of badge state
  //   - "unaddressed": show cards with no badge - haven't been actioned
  //   - "confirmed": show only cards you tapped Confirm on (blue ✓)
  //   - "corrected": show only cards you manually relabeled (green ✓)
  //   - "reviewed": show only cards you marked reviewed/skipped (grey ·)
  //
  // Persisted in localStorage so it survives across sessions.
  const [historyStatusFilter, setHistoryStatusFilter] = useState(() =>
    lsGet(LS.historyStatusFilter, "all"));
  useEffect(() => {
    lsSet(LS.historyStatusFilter, historyStatusFilter);
  }, [historyStatusFilter]);

  // v5.7: History species filter. Single-select: "all" or a specific
  // species_guess value. Source list is derived from currently-loaded
  // history items, so the dropdown only ever offers species you can
  // actually filter to. Persisted in localStorage.
  const [historySpeciesFilter, setHistorySpeciesFilter] = useState(() =>
    lsGet(LS.historySpeciesFilter, "all"));
  useEffect(() => {
    lsSet(LS.historySpeciesFilter, historySpeciesFilter);
  }, [historySpeciesFilter]);

  // Refs for callbacks that should not re-create the polling interval
  const classificationsRef = useRef(classifications);
  useEffect(() => { classificationsRef.current = classifications; }, [classifications]);

  // Fetch the live 24-hour window. Includes dismissed and non-dismissed
  // so the "Today" bucket of history is populated for free. Returns
  // newest-first, capped at 500 rows as a safety net (24h × ~10/h ≈ 240
  // typical, but storms can spike).
  const fetchLive = useCallback(async () => {
    try {
      // v5.7.4: extended live window from 24h to 48h to give the user
      // more time to review before clips drop into History.
      const cutoff = new Date(Date.now() - 48 * 60 * 60 * 1000).toISOString();
      const r = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?source=eq.bird_detection`
          + `&created_at=gte.${encodeURIComponent(cutoff)}`
          + `&order=created_at.desc&limit=500`,
        { headers: SUPA_HEADERS }
      );
      if (!r.ok) {
        setError(`Couldn't load detections (${r.status})`);
        setLoading(false);
        return;
      }
      const data = await r.json();
      setDetections(data || []);
      setLastFetch(new Date());
      setError(null);

      // Notification for newest detection, gated by notifMode + classification
      const cls_now = classificationsRef.current;
      if (data && data.length > 0 && notifPerm === "granted" && notifMode !== "off") {
        for (const newest of data) {
          if (newest.dismissed) continue;
          if (newest.id === lastNotifId.current) break;
          const label = birdLabel(newest);
          const cls = getClassification(label, cls_now);
          // Muted and suspect species never notify (suspect = "I want to see
          // it but don't ping me about it")
          if (cls === "muted" || cls === "suspect") continue;
          const ageMin = (Date.now() - new Date(newest.created_at).getTime()) / 60000;
          const passesMode =
            notifMode === "all" ||
            (notifMode === "priority" && cls === "priority");
          if (
            ageMin < 5 &&
            passesMode &&
            (newest.confidence || 0) >= confThreshold
          ) {
            // v5.8.0: showBirdNotif uses SW route (works on Chrome Android),
            // falls back to direct constructor for older browsers.
            const _notifTitle = `🐦 ${newest.species_guess}`;
            const _notifBody = `Detected nearby · ${Math.round((newest.confidence || 0) * 100)}% confidence`;
            showBirdNotif(_notifTitle, _notifBody, "bird-detection");
            lastNotifId.current = newest.id;
            lsSet(LS.lastNotif, newest.id);
            break;
          }
        }
      }
    } catch (e) {
      setError("Network error");
    }
    setLoading(false);
  }, [notifPerm, confThreshold, notifMode]);

  useEffect(() => {
    fetchLive();
    const iv = setInterval(fetchLive, 20000);
    return () => clearInterval(iv);
  }, [fetchLive]);

  // Fetch one history bucket from Supabase. Yesterday / This week /
  // This month / Older. Only dismissed rows are pulled — non-dismissed
  // older items would mean something weird is happening (live feed
  // should keep them visible until age >= 24h, at which point they're
  // dismissed-or-not in the older buckets, but we treat the older
  // buckets as "the archive" so we include both states there).
  //
  // Actually, important: an item more than 24h old that the user never
  // dismissed should STILL appear in history (otherwise it falls into
  // a gap between live and history). So we don't filter by dismissed
  // for buckets older than Today — we include everything in the range.
  const fetchHistoryBucket = useCallback(async (bucket) => {
    setHistoryBuckets(prev => ({
      ...prev,
      [bucket]: { items: prev[bucket]?.items || [], loading: true, loaded: false, error: null },
    }));
    try {
      const { gte, lt } = historyBucketRange(bucket);
      let q = `${SUPA_URL}/rest/v1/candidate_sightings?source=eq.bird_detection`;
      if (gte) q += `&created_at=gte.${encodeURIComponent(gte)}`;
      if (lt)  q += `&created_at=lt.${encodeURIComponent(lt)}`;
      q += `&order=created_at.desc&limit=1000`;
      const r = await fetch(q, { headers: SUPA_HEADERS });
      if (!r.ok) {
        setHistoryBuckets(prev => ({
          ...prev,
          [bucket]: { items: [], loading: false, loaded: false, error: `HTTP ${r.status}` },
        }));
        return;
      }
      const data = await r.json();
      setHistoryBuckets(prev => ({
        ...prev,
        [bucket]: { items: data || [], loading: false, loaded: true, error: null },
      }));
    } catch (e) {
      setHistoryBuckets(prev => ({
        ...prev,
        [bucket]: { items: [], loading: false, loaded: false, error: "Network error" },
      }));
    }
  }, []);

  // Auto-fetch buckets as the user expands them. Today doesn't need
  // its own fetch — it's derived from the live window.
  //
  // v5.8.1: when user picks a specific species in the filter, auto-expand
  // AND auto-fetch all buckets so they immediately see all data for that
  // species. Without this, the user only sees rows from buckets they had
  // manually expanded, which can hide most of the data.
  useEffect(() => {
    const speciesFilterActive = historySpeciesFilter !== "all";
    if (speciesFilterActive) {
      // Auto-expand all buckets when filtering by species.
      // Guard: only update state if any bucket is currently collapsed,
      // otherwise we'd create a new object every render -> infinite loop.
      const needsExpansion = !expandedBuckets["Yesterday"] ||
                              !expandedBuckets["This week"] ||
                              !expandedBuckets["This month"] ||
                              !expandedBuckets["Older"];
      if (needsExpansion) {
        setExpandedBuckets(prev => ({
          ...prev,
          "Yesterday": true,
          "This week": true,
          "This month": true,
          "Older": true,
        }));
      }
    }
    for (const bucket of ["Yesterday", "This week", "This month", "Older"]) {
      const shouldFetch = speciesFilterActive || expandedBuckets[bucket];
      if (shouldFetch && !historyBuckets[bucket]?.loaded && !historyBuckets[bucket]?.loading) {
        fetchHistoryBucket(bucket);
      }
    }
  }, [expandedBuckets, historyBuckets, fetchHistoryBucket, historySpeciesFilter]);

  // Live-view list: from the 24h window, non-dismissed, passes confidence
  // + classification, passes filter.
  // Sorted: priority first, then suspect, then normal, by recency within each group.
  const liveItems = useMemo(() => {
    const items = detections.filter(d => {
      if (d.dismissed) return false;
      if ((d.confidence || 0) < confThreshold) return false;
      const label = birdLabel(d);
      const cls = getClassification(label, classifications);
      if (cls === "muted") return false;
      if (viewFilter === "priority" && cls !== "priority") return false;
      return true;
    });
    // Stable sort: priority(0) → suspect(1) → normal(2), then by created_at desc
    const order = { priority: 0, suspect: 1, normal: 2 };
    items.sort((a, b) => {
      const ca = getClassification(birdLabel(a), classifications);
      const cb = getClassification(birdLabel(b), classifications);
      const oa = order[ca] ?? 2;
      const ob = order[cb] ?? 2;
      if (oa !== ob) return oa - ob;
      return new Date(b.created_at).getTime() - new Date(a.created_at).getTime();
    });
    return items;
  }, [detections, viewFilter, confThreshold, classifications]);

  // v5.7: derive sorted unique species_guess values from currently-loaded
  // history items. Used to populate the species filter dropdown. We pull
  // from todayItems (always loaded) AND from any expanded history bucket
  // the user has fetched. Sorted alphabetically for predictable order.
  const historyAvailableSpecies = useMemo(() => {
    const seen = new Set();
    // Today bucket (derived from detections in live window)
    for (const d of detections) {
      if (d.dismissed && d.species_guess) seen.add(d.species_guess);
    }
    // Any other loaded bucket
    for (const bucket of Object.values(historyBuckets)) {
      if (!bucket || !bucket.items) continue;
      for (const d of bucket.items) {
        if (d.species_guess) seen.add(d.species_guess);
      }
    }
    return [...seen].sort((a, b) => a.localeCompare(b));
  }, [detections, historyBuckets]);

  // Helper: shared filter applied to history items.
  // - Muted species are always excluded from history
  // - The historyClsFilter chips decide which of priority/suspect/normal show
  // - v5.4: historyStatusFilter narrows to a single badge state
  const filterHistoryItems = useCallback((items) => {
    return items.filter(d => {
      // v5.7: hide discarded rows. We're not building an "audit log" view
      // yet - discarded clips should disappear from History so the user
      // can see clear progress through the corpus cleanup task.
      if (d.metadata && d.metadata.discarded === true) return false;
      // v5.7: species filter takes precedence - if "all" passes through.
      if (historySpeciesFilter !== "all") {
        if ((d.species_guess || "") !== historySpeciesFilter) return false;
      }
      const label = birdLabel(d);
      const cls = getClassification(label, classifications);
      // v5.8.1: muted now respects the chip toggle (default OFF) so user
      // can opt into seeing muted clips for audit/quality-review.
      if (cls === "muted"    && !historyClsFilter.muted)    return false;
      if (cls === "priority" && !historyClsFilter.priority) return false;
      if (cls === "suspect"  && !historyClsFilter.suspect)  return false;
      if (cls === "normal"   && !historyClsFilter.normal)   return false;

      // v5.4: status filter. Compute badge state for this card and check
      // against the active filter. corrected wins over confirmed wins
      // over reviewed - same precedence as the badge rendering.
      if (historyStatusFilter !== "all") {
        const c = isCorrected(d);
        const cf = !c && isConfirmed(d);
        const rv = !c && !cf && isReviewed(d);
        const unaddressed = !c && !cf && !rv;
        if (historyStatusFilter === "corrected"   && !c)   return false;
        if (historyStatusFilter === "confirmed"   && !cf)  return false;
        if (historyStatusFilter === "reviewed"    && !rv)  return false;
        if (historyStatusFilter === "unaddressed" && !unaddressed) return false;
      }
      return true;
    });
  }, [classifications, historyClsFilter, historyStatusFilter, historySpeciesFilter]);

  // History "Today" bucket: items dismissed today.
  // Derived from the live window (already in memory) so dismissing a card
  // makes it appear in Today instantly with no fetch.
  //
  // We filter to dismissed-only here because today is the "actioned" view:
  // you're actively triaging in the live feed, and history is where things
  // go when you've explicitly cleared them. Yesterday and older buckets
  // include everything (dismissed or not) because at that point the
  // distinction is moot — those are the archive view.
  const todayItems = useMemo(() => {
    const { gte, lt } = historyBucketRange("Today");
    const filtered = detections.filter(d => {
      if (!d.dismissed) return false;
      const t = d.created_at;
      return t >= gte && t < lt;
    });
    return filterHistoryItems(filtered)
      .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());
  }, [detections, filterHistoryItems]);

  // Counts for each history bucket (for the header chips).
  // Today comes from local data. Others come from the bucket cache once
  // loaded (we show "—" until they've been fetched).
  const bucketCounts = useMemo(() => {
    const out = { "Today": todayItems.length };
    for (const b of ["Yesterday", "This week", "This month", "Older"]) {
      const entry = historyBuckets[b];
      if (entry?.loaded) {
        out[b] = filterHistoryItems(entry.items).length;
      } else {
        out[b] = null;  // unknown until loaded
      }
    }
    return out;
  }, [todayItems, historyBuckets, filterHistoryItems]);

  // Total count of items hidden by the current live filter (for the
  // "X hidden by current filter" notice)
  const hiddenByFilter = useMemo(() => {
    if (viewMode !== "live") return 0;
    const visibleNonDismissed = detections.filter(d => !d.dismissed).length;
    return visibleNonDismissed - liveItems.length;
  }, [detections, liveItems, viewMode]);

  // ─── v5.2: Training corpus stats ──────────────────────────────────
  // Per-species count of clips that have either a manual_label set
  // (corrections) OR confirmed=true (confirmations). These are the rows
  // the Pi promote-poll has copied into training-corpus/.
  //
  // Stored as: { total, entries: [{ label, count }], byNormalisedLabel }
  // where byNormalisedLabel is a lookup keyed on the normalised form
  // ("common-mynah" rather than "Common Mynah") so per-card lookups work
  // regardless of casing.
  //
  // Fetched directly from Supabase as a count aggregation, refreshed
  // every 60 seconds plus immediately after any Confirm or Correct
  // action so the displayed count moves with the user's interaction.
  const [corpusStats, setCorpusStats] = useState(null);

  const fetchCorpusStats = useCallback(async () => {
    // We need both manual_label values AND confirmed flags. The simplest
    // safe query is to ask Supabase for all rows where either is set,
    // returning just enough columns to bucket them. We paginate via the
    // count header in case the result is large.
    try {
      // v5.7.7: read truth-from-disk via pi_config.corpus_counts.
      // The Pi publishes its actual training-corpus folder file counts
      // every ~120s. We just slugify any incoming species name to look
      // up its count here, instead of trying to count Supabase rows
      // (which drift from Pi disk due to historical artefacts, manual
      // corrections, discards, etc).
      const url = `${SUPA_URL}/rest/v1/pi_config`
        + `?key=eq.corpus_counts`
        + `&select=value`;
      const r = await fetch(url, { headers: SUPA_HEADERS });
      if (!r.ok) {
        // Quietly fail. Settings panel just keeps "loading…".
        return;
      }
      const rows = await r.json();
      if (!rows || !rows.length || !rows[0].value) {
        // Pi hasn't published yet. Show nothing rather than stale data.
        setCorpusStats({ total: 0, entries: [], byNormalisedLabel: new Map() });
        return;
      }
      // value is {slug: count, ...}. Slug is the Pi's folder name and is
      // already in our normalised form (lowercase + dashes). Build pretty
      // label by capitalising each dash-segment.
      const piCounts = rows[0].value;
      const counts = new Map();         // pretty label → {label, count}
      const norm = new Map();           // normalised slug → count
      for (const slug of Object.keys(piCounts)) {
        const count = piCounts[slug];
        if (typeof count !== "number" || count <= 0) continue;
        const pretty = slug.split("-").map(w =>
          w ? w[0].toUpperCase() + w.slice(1) : w
        ).join(" ");
        counts.set(slug, { label: pretty, count });
        norm.set(slug, count);
      }
      const entries = [...counts.values()].sort((a, b) => b.count - a.count);
      const total = entries.reduce((s, e) => s + e.count, 0);
      setCorpusStats({ total, entries, byNormalisedLabel: norm });
    } catch (e) {
      // Network error - keep the previous stats visible. Silent.
    }
  }, []);

  // Fetch corpus stats on mount and then every 60s. The numbers don't
  // need to be real-time; they're a rough progress indicator.
  useEffect(() => {
    corpusRefreshRef.current = fetchCorpusStats;
    fetchCorpusStats();
    const iv = setInterval(fetchCorpusStats, 60000);
    return () => clearInterval(iv);
  }, [fetchCorpusStats]);

  // Helper used by DetectionCard to look up how many clips this species
  // already has in the training corpus. Returns 0 if not yet loaded or
  // unknown.
  const corpusCountFor = useCallback((d) => {
    if (!corpusStats) return null;
    // Match priority: user's manual_label (most specific), then
    // species_guess (BirdNET's guess - what we'd promote to on Confirm).
    const meta = d.metadata || {};
    // v5.7.6: consolidate species name (so Little Wattlebird lookups
    // resolve to the consolidated "wattlebird" entry) THEN normalise.
    const candidates = [
      meta.manual_label,
      d.species_guess,
    ].filter(Boolean).map(s => normaliseCorpusLabel(consolidateLabel(s)));
    for (const k of candidates) {
      if (corpusStats.byNormalisedLabel.has(k)) {
        return corpusStats.byNormalisedLabel.get(k);
      }
    }
    return 0;
  }, [corpusStats]);

  // Species summary - one row per species, used both in feed grouping and
  // in the settings classification list. Built from the live (24h) window
  // only; older species require checking the History view to find.
  const speciesByLabel = useMemo(() => {
    const m = new Map();
    for (const d of detections) {  // use unfiltered list so settings sees everything in window
      const label = birdLabel(d);
      const e = m.get(label) || {
        label, common: d.species_guess, count: 0, latestTs: null, maxConf: 0,
        scientific: (d.metadata || {}).scientific_name || null,
      };
      e.count += 1;
      const ts = new Date(d.created_at).getTime();
      if (e.latestTs === null || ts > e.latestTs) e.latestTs = ts;
      e.maxConf = Math.max(e.maxConf, d.confidence || 0);
      m.set(label, e);
    }
    // Add lastSeen as ISO string for easy display, sorted by recency
    return [...m.values()]
      .map(e => ({ ...e, lastSeen: e.latestTs ? new Date(e.latestTs).toISOString() : null }))
      .sort((a, b) => b.latestTs - a.latestTs);
  }, [detections]);

  // v5.4.2: deduped label suggestions for the manual_label input autocomplete.
  // Combines two sources:
  //   1. Prior manual_label values (your typed corrections from history)
  //   2. BirdNET species_guess values (every species name BirdNET has used)
  // Sources are merged and ranked by FREQUENCY of use across all loaded
  // detections, so common labels surface first. Includes both live (24h)
  // detections and any history buckets the user has loaded.
  const labelSuggestions = useMemo(() => {
    const counts = new Map();
    function bump(s) {
      if (!s) return;
      const trimmed = s.trim();
      if (!trimmed) return;
      counts.set(trimmed, (counts.get(trimmed) || 0) + 1);
    }
    // Live detections
    for (const d of detections) {
      bump(d.species_guess);
      bump((d.metadata || {}).manual_label);
    }
    // History buckets - whatever's loaded
    for (const bucket of Object.values(historyBuckets)) {
      if (!bucket || !bucket.items) continue;
      for (const d of bucket.items) {
        bump(d.species_guess);
        bump((d.metadata || {}).manual_label);
      }
    }
    return [...counts.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([label]) => label);
  }, [detections, historyBuckets]);

  // Dismiss / un-dismiss a detection. Optimistically updates local state
  // so the UI is instant, then PATCHes Supabase. If the PATCH fails we
  // roll back.
  const setDismissed = useCallback(async (id, dismissed) => {
    // Optimistic update
    setDetections(prev => prev.map(d => d.id === id ? { ...d, dismissed } : d));
    try {
      const r = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}`,
        {
          method: "PATCH",
          headers: { ...SUPA_HEADERS, "Prefer": "return=minimal" },
          body: JSON.stringify({ dismissed }),
        }
      );
      if (!r.ok) {
        // Roll back on failure
        setDetections(prev => prev.map(d => d.id === id ? { ...d, dismissed: !dismissed } : d));
        setError(`Couldn't ${dismissed ? "clear" : "restore"} (${r.status})`);
        setTimeout(() => setError(null), 3000);
      }
    } catch (e) {
      setDetections(prev => prev.map(d => d.id === id ? { ...d, dismissed: !dismissed } : d));
      setError("Network error");
      setTimeout(() => setError(null), 3000);
    }
  }, []);

  // v4: write a manual label to a detection's metadata. The Pi polls
  // Supabase periodically and copies labelled clips into the training
  // corpus locally - we don't make a cross-origin HTTPS→HTTP fetch from
  // the browser (modern browsers block that as mixed content).
  // Optimistically updates local state; rolls back on Supabase failure.
  // v5.2: saving a correction now also auto-dismisses so the card moves
  // to history in one action rather than requiring a second tap on X.
  const setManualLabel = useCallback(async (id, manualLabel, clipFilename) => {
    if (!manualLabel) return;
    const labelTrim = manualLabel.trim();

    // Optimistic update of local detection - label AND dismissed in one go
    let prevMeta = null;
    let prevDismissed = null;
    setDetections(prev => prev.map(d => {
      if (d.id !== id) return d;
      prevMeta = d.metadata;
      prevDismissed = d.dismissed;
      const optMeta = { ...(d.metadata || {}), manual_label: labelTrim };
      // v5.3: if this card was previously confirmed, clear that flag so
      // the badge updates from blue (confirmed) to green (corrected).
      delete optMeta.confirmed;
      return {
        ...d,
        metadata: optMeta,
        dismissed: true,
      };
    }));

    // PATCH the Supabase row's metadata + dismissed. We fetch the existing
    // metadata first to merge into the jsonb without clobbering other keys.
    try {
      const current = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}&select=metadata`,
        { headers: SUPA_HEADERS }
      );
      const rows = await current.json();
      const fullMeta = (rows && rows[0] && rows[0].metadata) || {};
      // v5.3: writing a correction overrides any prior confirmation.
      // We remove the confirmed flag AND the v5.2 corpus-done sentinel
      // so the Pi's promote-poll will re-process this row and copy the
      // WAV to the corrected-species folder. Note: the WAV may already
      // exist in the original species folder from a prior confirm; that
      // stale copy stays there until a future corpus cleanup pass. TODO.
      const newMeta = { ...fullMeta, manual_label: labelTrim };
      delete newMeta.confirmed;
      delete newMeta._v5_2_corpus_done;
      const r = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}`,
        {
          method: "PATCH",
          headers: { ...SUPA_HEADERS, "Prefer": "return=minimal" },
          body: JSON.stringify({ metadata: newMeta, dismissed: true }),
        }
      );
      if (!r.ok) throw new Error(`Supabase PATCH ${r.status}`);
      // v5.2: nudge a corpus stats refresh shortly after, so the per-card
      // and Settings stat counts move quickly after the user acts.
      setTimeout(() => { try { corpusRefreshRef.current?.(); } catch {} }, 1500);
    } catch (e) {
      // Roll back both fields
      setDetections(prev => prev.map(d => d.id === id
        ? { ...d, metadata: prevMeta, dismissed: prevDismissed } : d));
      setError("Couldn't save label");
      setTimeout(() => setError(null), 3000);
      return;
    }
  }, []);

  // v5.7: discard a clip. Sets metadata.discarded=true + discarded_at.
  // The Pi's discard-poll picks this up on next tick (within 2 min) and
  // moves the WAV from training-corpus/<slug>/ to _quarantine/<slug>/.
  // This is reversible - clearing metadata.discarded would let the v4
  // promote flow re-promote the clip on next poll (assuming the WAV is
  // restored from quarantine first). The web app does not currently
  // expose an undiscard button - that's tomorrow's work.
  const setDiscarded = useCallback(async (id) => {
    let prevMeta = null;
    const nowIso = new Date().toISOString();
    const mutateRow = (d) => {
      if (d.id !== id) return d;
      if (prevMeta === null) prevMeta = d.metadata;
      return {
        ...d,
        metadata: {
          ...(d.metadata || {}),
          discarded: true,
          discarded_at: nowIso,
        },
      };
    };
    setDetections(prev => prev.map(mutateRow));
    setHistoryBuckets(prev => {
      const next = {};
      for (const [bucket, entry] of Object.entries(prev)) {
        if (!entry || !entry.items) { next[bucket] = entry; continue; }
        next[bucket] = { ...entry, items: entry.items.map(mutateRow) };
      }
      return next;
    });

    // PATCH Supabase. Fetch existing metadata first to merge cleanly.
    try {
      const current = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}&select=metadata`,
        { headers: SUPA_HEADERS }
      );
      const rows = await current.json();
      const fullMeta = (rows && rows[0] && rows[0].metadata) || {};
      const newMeta = {
        ...fullMeta,
        discarded: true,
        discarded_at: new Date().toISOString(),
      };
      const r = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}`,
        {
          method: "PATCH",
          headers: { ...SUPA_HEADERS, "Prefer": "return=minimal" },
          body: JSON.stringify({ metadata: newMeta }),
        }
      );
      if (!r.ok) throw new Error(`Supabase PATCH ${r.status}`);
      setTimeout(() => { try { corpusRefreshRef.current?.(); } catch {} }, 1500);
    } catch (e) {
      const restoreRow = (d) => (d.id === id ? { ...d, metadata: prevMeta } : d);
      setDetections(prev => prev.map(restoreRow));
      setHistoryBuckets(prev => {
        const next = {};
        for (const [bucket, entry] of Object.entries(prev)) {
          if (!entry || !entry.items) { next[bucket] = entry; continue; }
          next[bucket] = { ...entry, items: entry.items.map(restoreRow) };
        }
        return next;
      });
      setError("Couldn't discard clip");
      setTimeout(() => setError(null), 3000);
      return;
    }
  }, []);

  // v5.2: confirm that BirdNET's guess was right.
  // Writes metadata.confirmed=true AND dismissed=true in one PATCH so the
  // card moves to history immediately. The Pi promote-poll thread treats
  // confirmed=true rows the same way as manual_label rows: copy the WAV
  // into training-corpus/<species_guess>/ (normalised). This builds the
  // "positive confirmations" half of the BoundaryBirds training data,
  // complementing the corrections half.
  const setConfirmed = useCallback(async (id) => {
    let prevMeta = null;
    let prevDismissed = null;
    setDetections(prev => prev.map(d => {
      if (d.id !== id) return d;
      prevMeta = d.metadata;
      prevDismissed = d.dismissed;
      return {
        ...d,
        metadata: { ...(d.metadata || {}), confirmed: true },
        dismissed: true,
      };
    }));

    try {
      const current = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}&select=metadata`,
        { headers: SUPA_HEADERS }
      );
      const rows = await current.json();
      const fullMeta = (rows && rows[0] && rows[0].metadata) || {};
      const newMeta = { ...fullMeta, confirmed: true };
      const r = await fetch(
        `${SUPA_URL}/rest/v1/candidate_sightings?id=eq.${id}`,
        {
          method: "PATCH",
          headers: { ...SUPA_HEADERS, "Prefer": "return=minimal" },
